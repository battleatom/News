<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="Underreported V6 — high-impact, local and undercovered news in a clean standalone architecture.">
  <title>Underreported V6</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <a class="skip-link" href="#feed">Skip to stories</a>
  <div id="app-shell" class="app-shell">
    <header class="masthead">
      <div class="brand-block"><h1>UNDERREPORTED</h1><p>High-impact news · local context · less noise</p></div>
      <div id="health" class="health" aria-live="polite">Loading V6…</div>
    </header>
    <div class="toolbar" aria-label="Site status">
      <div id="local-status" class="local-status"><span id="local-date">—</span><span class="sep">·</span><span id="local-time">—</span><span class="sep">·</span><button id="location-button" class="text-button" type="button">Location: resolving…</button><span class="sep">·</span><span id="weather-status" class="weather-status"></span></div>
      <div id="refresh-status" class="refresh-status" aria-live="polite">Feed: loading…</div>
    </div>
    <div id="markets" class="markets" aria-label="Market snapshot"></div>
    <nav id="tabs" class="tabs" aria-label="News categories" role="tablist"></nav>
  </div>
  <main class="page"><section id="feed" class="feed" aria-live="polite"></section></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="nfl-cloudflare-proxy.js?v=2"></script>
  <script type="module" src="app.js?v=9"></script>
  <script src="story-sanitize.js?v=1"></script>
  <script src="infinite-scroll.js?v=2"></script>
  <script src="story-position.js?v=6"></script>
  <script src="status-ux.js?v=4"></script>
  <script src="tab-ux.js?v=6"></script>
  <script src="tab-count-sync.js?v=3"></script>
  <script>
  (()=>{
    let loaded=false,loading=false;
    const tabs=document.getElementById('tabs');
    const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
    const loadAdmin=async()=>{
      if(loaded||loading)return;loading=true;
      try{
        await loadScript('admin-ops-cloudflare.js?v=7');
        await loadScript('admin-layout.js?v=5');
        await loadScript('admin-refresh.js?v=2');
        await loadScript('admin-pool.js?v=1');
        await loadScript('admin-runtime-files.js?v=6');
        await loadScript('admin-export.js?v=6');
        loaded=true;
        document.dispatchEvent(new CustomEvent('v6:tabchange',{detail:{category:'admin'}}));
      }catch(e){console.warn('Admin diagnostics failed to load',e)}finally{loading=false}
    };
    tabs?.addEventListener('click',e=>{if(e.target.closest('.tab[data-category="admin"]'))loadAdmin()},true);
    setTimeout(()=>{if(tabs?.querySelector('.tab[data-category="admin"][aria-selected="true"]'))loadAdmin()},600);
  })();
  </script>
  <script type="module" src="weather.js?v=4"></script>
</body>
</html>
