<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#111827">
<title>Underreported — High-Impact News</title>
<style>
:root{--ink:#172033;--muted:#64748b;--line:#e2e8f0;--paper:#fff;--soft:#f8fafc;--accent:#111827}
*{box-sizing:border-box;margin:0;padding:0}html{background:#0b1120}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0b1120;color:var(--ink);min-height:100vh}.container{max-width:980px;margin:auto;background:var(--paper);min-height:100vh;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.28)}
header{background:linear-gradient(135deg,#111827,#263449);color:#fff;padding:24px 20px 20px}header h1{font-size:27px;letter-spacing:-.7px;line-height:1.05;margin-bottom:6px}header p{font-size:13px;color:#cbd5e1;line-height:1.45;max-width:480px}
.toolbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:0;z-index:20}.toolbar button{border:0;border-radius:7px;padding:7px 11px;background:#111827;color:#fff;font-size:12px;font-weight:750;cursor:pointer}.toolbar button:hover{background:#334155}.toolbar button:disabled{opacity:.6;cursor:wait}#status{font-size:11px;color:var(--muted)}
.markets{height:31px;display:flex;align-items:center;overflow-x:auto;border-bottom:1px solid #1e293b;background:#0f172a;color:#cbd5e1;white-space:nowrap;scrollbar-width:none}.markets::-webkit-scrollbar{display:none}.markets-track{display:flex;align-items:center;gap:18px;min-width:max-content;padding:0 14px;font-size:10px;font-weight:700}.market-label{color:#fff;letter-spacing:.8px}.market{display:inline-flex;gap:5px;align-items:center}.market-name{color:#94a3b8}.market-value{color:#e2e8f0}.up{color:#22c55e}.down{color:#ef4444}.neutral{color:#94a3b8}.market-time{font-size:9px;color:#64748b;font-weight:500}
.tabs{display:flex;gap:0;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--line);background:#fff;scrollbar-width:none;position:sticky;top:40px;z-index:19}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:0;border-bottom:3px solid transparent;padding:11px 10px 9px;background:transparent;color:#64748b;font-size:11px;font-weight:750;cursor:pointer;white-space:nowrap}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{padding:18px 20px 28px}.section{--accent:#111827}.section-header{display:flex;justify-content:space-between;align-items:baseline;padding:0 0 9px;border-bottom:2px solid var(--accent);margin-bottom:0}.section-header h2{font-size:17px;line-height:1.2;letter-spacing:-.2px}.count{font-size:10px;color:var(--muted)}.section-body{border-bottom:1px solid var(--line)}
.news-item{padding:15px 2px 14px;border-bottom:1px solid var(--line)}.news-item:last-child{border-bottom:0}.news-item h3{font-size:16px;line-height:1.3;margin-bottom:6px;font-weight:760;letter-spacing:-.15px}.news-item h3 a{color:var(--ink);text-decoration:none}.news-item h3 a:hover{text-decoration:underline}.description{font-size:12px;line-height:1.5;color:#526174;margin-bottom:7px;max-width:760px}.why{font-size:11px;line-height:1.45;color:#334155;background:#f8fafc;border-left:2px solid var(--accent);padding:7px 9px;margin:8px 0}.meta{font-size:10px;color:#94a3b8;display:flex;gap:7px;flex-wrap:wrap}.source{font-weight:700;color:#64748b}.empty,.loading{text-align:center;padding:36px 10px;color:var(--muted);font-size:13px}footer{text-align:center;padding:15px;background:var(--soft);border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
@media(max-width:600px){html{background:#fff}body{background:#fff}.container{width:100%;box-shadow:none}header{padding:20px 15px 17px}header h1{font-size:24px}.toolbar{padding:8px 12px}.markets{height:29px}.markets-track{gap:15px;padding:0 11px;font-size:9.5px}.tabs{padding:0 7px;top:38px}.tab{padding:10px 9px 8px;font-size:10.5px}.content{padding:15px 14px 24px}.section-header{padding-bottom:8px}.section-header h2{font-size:16px}.news-item{padding:14px 1px 13px}.news-item h3{font-size:16px;line-height:1.3;margin-bottom:5px}.description{font-size:12px;line-height:1.48}.why{font-size:11px;padding:7px 8px}.meta{font-size:10px}}
@media(min-width:601px){.news-item:first-child h3{font-size:21px;line-height:1.22}.news-item:first-child{padding-top:17px}}
</style></head>
<body><div class="container"><header><h1>UNDERREPORTED</h1><p>High-impact stories outside the usual news cycle.</p></header><div class="toolbar"><button id="refresh" onclick="loadNews(true)">↻ Refresh</button><span id="status">Loading…</span></div><div class="markets" aria-label="Market data"><div class="markets-track" id="markets-track"><span class="market-label">MARKETS</span><span class="market"><span class="market-name">Loading market data…</span></span></div></div><nav class="tabs" id="tabs" aria-label="News categories"></nav><main class="content" id="news-feed"><div class="loading">Loading news…</div></main><footer>Automated news intelligence · <span id="last-update">Last update: —</span></footer></div>
<script>
const sections=[['top','🔴 Top Stories','#dc2626'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a04'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b']];
let allItems=[],active='top';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function buildTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';sections.forEach(([key,label,accent])=>{const b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;buildTabs();render(allItems)};b.style.setProperty('--accent',accent);tabs.appendChild(b)})}
function render(items){const def=sections.find(x=>x[0]===active);const accent=def?def[2]:'#111827';const list=items.filter(item=>(item.querySelector('category')?.textContent?.trim()||'world')===active);const root=document.getElementById('news-feed');root.innerHTML='';const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent',accent);const head=document.createElement('div');head.className='section-header';head.innerHTML=`<h2>${esc(def?def[1]:'News')}</h2><span class="count">${list.length} stories</span>`;sec.appendChild(head);const body=document.createElement('div');body.className='section-body';if(!list.length)body.innerHTML='<div class="empty">No stories available right now.</div>';list.forEach((item,i)=>{const title=item.querySelector('title')?.textContent||'Untitled';const desc=item.querySelector('description')?.textContent||'';const why=item.querySelector('whyMatters')?.textContent||'';const link=item.querySelector('link')?.textContent||'#';const date=item.querySelector('pubDate')?.textContent||'';const source=item.querySelector('source')?.textContent||'';const article=document.createElement('article');article.className='news-item';article.innerHTML=`<h3><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(title)}</a></h3>${desc?`<p class="description">${esc(desc)}</p>`:''}${why?`<div class="why">${esc(why)}</div>`:''}<div class="meta"><span>${esc(formatDate(date))}</span>${source?`<span class="source">${esc(source)}</span>`:''}</div>`;body.appendChild(article)});sec.appendChild(body);root.appendChild(sec)}
function marketHtml(name,value,change,cls){return `<span class="market"><span class="market-name">${esc(name)}</span><span class="market-value">${esc(value)}</span><span class="${cls}">${change}</span></span>`}
function fmtMarket(v,name){if(name==='10Y'||name==='VIX')return Number(v).toFixed(2);if(name==='WTI OIL'||name==='GOLD')return '$'+Number(v).toFixed(2);return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
async function loadMarkets(){const track=document.getElementById('markets-track');try{const r=await fetch('markets.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('market file HTTP '+r.status);const data=await r.json();const valid=(data.markets||[]).some(v=>v&&v.price!=null);if(!valid)throw new Error('no market data');let html='<span class="market-label">MARKETS</span>';(data.markets||[]).forEach(v=>{if(v.error||v.price==null){html+=`<span class="market"><span class="market-name">${esc(v.name)}</span><span class="neutral">—</span></span>`;return}const cls=v.changePct>0?'up':v.changePct<0?'down':'neutral';const arrow=v.changePct>0?'▲':v.changePct<0?'▼':'—';html+=marketHtml(v.name,fmtMarket(v.price,v.name),arrow+' '+Math.abs(Number(v.changePct)).toFixed(2)+'%',cls)});html+=`<span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>`;html+=`<span class="market-time">${data.marketClosed?'MARKETS CLOSED':'MARKET DATA'} · ${formatDate(data.updatedAt)}</span>`;track.innerHTML=html}catch(e){track.innerHTML='<span class="market-label">MARKETS</span><span class="market"><span class="neutral">Data temporarily unavailable</span></span><span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>'}}
async function loadNews(manual=false){const btn=document.getElementById('refresh'),status=document.getElementById('status');btn.disabled=true;status.textContent=manual?'Refreshing…':'Loading…';try{const response=await fetch('News?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const text=await response.text();const xml=new DOMParser().parseFromString(text,'text/xml');if(xml.querySelector('parsererror'))throw new Error('Invalid RSS/XML feed');const channel=xml.querySelector('channel');allItems=[...xml.querySelectorAll('item')];buildTabs();render(allItems);const updated=channel?.querySelector('lastBuildDate')?.textContent||new Date().toISOString();document.getElementById('last-update').textContent='Last update: '+formatDate(updated);status.textContent=allItems.length+' stories loaded'}catch(e){document.getElementById('news-feed').innerHTML=`<div class="empty">Unable to load the news feed.<br><small>${esc(e.message)}</small></div>`;status.textContent='Update failed'}finally{btn.disabled=false}}
loadNews();loadMarkets();setInterval(()=>loadNews(false),15*60*1000);setInterval(loadMarkets,60*1000);
</script></body></html>
