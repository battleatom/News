<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b1120">
<title>Underreported — High-Impact News</title>



















































<link rel="stylesheet" href="styles/theme.css?v=3">
</head>
<body><div class="container"><header><h1>UNDERREPORTED</h1><p>High-impact stories outside the usual news cycle.</p></header><div class="toolbar"><button id="refresh" onclick="loadNews(true)">↻ Refresh</button><span id="status">Loading…</span></div><div class="markets" aria-label="Market data"><div class="markets-track" id="markets-track"><span class="market-label">MARKETS</span><span class="market"><span class="market-name">Loading market data…</span></span></div></div><nav class="tabs" id="tabs" aria-label="News categories"></nav><main class="content" id="news-feed"><div class="loading">Loading news…</div></main><footer>Automated news intelligence · <span id="last-update">Last update: —</span></footer></div>
<script>
const sections=[['top','🔴 Top Stories','#dc2626'],['nfl','🏈 NFL','#166534'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a04'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['region','🌎 Region','#2563eb'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b']];
let allItems=[],active=localStorage.getItem('underreported-active-tab')||'top';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function buildTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';sections.forEach(([key,label,accent])=>{const b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;localStorage.setItem('underreported-active-tab',active);buildTabs();render(allItems)};b.style.setProperty('--accent',accent);tabs.appendChild(b)})}
function render(items){const def=sections.find(x=>x[0]===active);const accent=def?def[2]:'#111827';const list=items.filter(item=>(item.querySelector('category')?.textContent?.trim()||'world')===active);const root=document.getElementById('news-feed');root.innerHTML='';const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent',accent);const head=document.createElement('div');head.className='section-header';head.innerHTML=`<h2>${esc(def?def[1]:'News')}</h2><span class="count">${list.length} stories</span>`;sec.appendChild(head);const body=document.createElement('div');body.className='section-body';if(!list.length)body.innerHTML='<div class="empty">No stories available right now.</div>';list.forEach((item,i)=>{const title=item.querySelector('title')?.textContent||'Untitled';const desc=item.querySelector('description')?.textContent||'';const why=item.querySelector('whyMatters')?.textContent||'';const link=item.querySelector('link')?.textContent||'#';const date=item.querySelector('pubDate')?.textContent||'';const source=item.querySelector('source')?.textContent||'';const article=document.createElement('article');article.className='news-item';article.innerHTML=`<h3><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(title)}</a></h3>${desc?`<p class="description">${esc(desc)}</p>`:''}${why?`<div class="why">${esc(why)}</div>`:''}<div class="meta"><span>${esc(formatDate(date))}</span>${source?`<span class="source">${esc(source)}</span>`:''}</div>`;body.appendChild(article)});sec.appendChild(body);root.appendChild(sec)}
function marketHtml(name,value,change,cls){return `<span class="market"><span class="market-name">${esc(name)}</span><span class="market-value">${esc(value)}</span><span class="${cls}">${change}</span></span>`}
function fmtMarket(v,name){if(name==='10Y'||name==='VIX')return Number(v).toFixed(2);if(name==='WTI OIL'||name==='GOLD')return '$'+Number(v).toFixed(2);return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
async function loadMarkets(){const track=document.getElementById('markets-track');try{const r=await fetch('markets.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('market file HTTP '+r.status);const data=await r.json();const valid=(data.markets||[]).some(v=>v&&v.price!=null);if(!valid)throw new Error('no market data');let html='<span class="market-label">MARKETS</span>';(data.markets||[]).forEach(v=>{if(v.error||v.price==null){html+=`<span class="market"><span class="market-name">${esc(v.name)}</span><span class="neutral">—</span></span>`;return}const cls=v.changePct>0?'up':v.changePct<0?'down':'neutral';const arrow=v.changePct>0?'▲':v.changePct<0?'▼':'—';html+=marketHtml(v.name,fmtMarket(v.price,v.name),arrow+' '+Math.abs(Number(v.changePct)).toFixed(2)+'%',cls)});html+=`<span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>`;html+=`<span class="market-time">${data.marketClosed?'MARKETS CLOSED':'MARKET DATA'} · ${formatDate(data.updatedAt)}</span>`;track.innerHTML=html}catch(e){track.innerHTML='<span class="market-label">MARKETS</span><span class="market"><span class="neutral">Data temporarily unavailable</span></span><span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>'}}
async function loadNews(manual=false){const btn=document.getElementById('refresh'),status=document.getElementById('status');btn.disabled=true;status.textContent=manual?'Refreshing…':'Loading…';try{const response=await fetch('News?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const text=await response.text();const xml=new DOMParser().parseFromString(text,'text/xml');if(xml.querySelector('parsererror'))throw new Error('Invalid RSS/XML feed');const channel=xml.querySelector('channel');allItems=[...xml.querySelectorAll('item')];buildTabs();render(allItems);const updated=channel?.querySelector('lastBuildDate')?.textContent||new Date().toISOString();document.getElementById('last-update').textContent='Last update: '+formatDate(updated);status.textContent=allItems.length+' stories loaded'}catch(e){document.getElementById('news-feed').innerHTML=`<div class="empty">Unable to load the news feed.<br><small>${esc(e.message)}</small></div>`;status.textContent='Update failed'}finally{btn.disabled=false}}
loadNews();loadMarkets();setInterval(()=>loadNews(false),15*60*1000);setInterval(loadMarkets,60*1000);
</script>





<script id="region-tab-v1">
let detectedRegion=localStorage.getItem('underreported-region')||'southwest',detectedLocation=localStorage.getItem('underreported-location')||'';
const regionLabels={southwest:'Southwest',west:'West',mountain:'Mountain West',midwest:'Midwest',south:'South',northeast:'Northeast','pacific-northwest':'Pacific Northwest',southeast:'Southeast'};
const stateRegion={AZ:'southwest',NM:'southwest',UT:'southwest',CO:'southwest',CA:'west',NV:'west',HI:'west',ID:'mountain',MT:'mountain',WY:'mountain',IL:'midwest',IN:'midwest',MI:'midwest',OH:'midwest',WI:'midwest',MN:'midwest',IA:'midwest',MO:'midwest',KS:'midwest',NE:'midwest',SD:'midwest',ND:'midwest',TX:'south',OK:'south',AR:'south',LA:'south',TN:'south',KY:'south',VA:'south',WV:'south',MD:'south',DE:'south',NY:'northeast',PA:'northeast',NJ:'northeast',CT:'northeast',RI:'northeast',MA:'northeast',VT:'northeast',NH:'northeast',ME:'northeast',DC:'northeast',WA:'pacific-northwest',OR:'pacific-northwest',AK:'pacific-northwest',FL:'southeast',GA:'southeast',AL:'southeast',SC:'southeast',NC:'southeast',MS:'southeast'};
function renderNfl(){
 const root=document.getElementById('news-feed');root.innerHTML='';const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent','#166534');
 const h=document.createElement('div');h.className='section-header';h.innerHTML='<h2>🏈 NFL</h2><span class="count">Live scores & latest news</span>';sec.appendChild(h);
 const body=document.createElement('div');body.className='section-body';body.innerHTML='<div class="loading">Loading NFL scores…</div>';sec.appendChild(body);root.appendChild(sec);
 fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=32',{cache:'no-store'}).then(r=>r.json()).then(d=>{body.innerHTML='';(d.events||[]).forEach(ev=>{const c=ev.competitions?.[0],ts=c?.competitors||[],a=ts.find(t=>t.homeAway==='away'),h=ts.find(t=>t.homeAway==='home'),card=document.createElement('article');card.className='news-item';card.innerHTML=`<h3>${esc(a?.team?.displayName||'Away')} <strong>${esc(a?.score??'-')}</strong> @ ${esc(h?.team?.displayName||'Home')} <strong>${esc(h?.score??'-')}</strong></h3><div class="meta"><span>${esc(ev.status?.type?.state==='post'?'FINAL':ev.status?.type?.shortDetail||ev.status?.type?.detail||'Scheduled')}</span></div>`;body.appendChild(card)});if(!d.events?.length)body.innerHTML='<div class="empty">No NFL games currently scheduled.</div>'}).catch(()=>body.innerHTML='<div class="empty">NFL scores are temporarily unavailable.</div>');
 const allNfl=allItems.filter(x=>(x.querySelector('category')?.textContent?.trim()||'')==='nfl');
 const count=Math.min(loadCounts?.nfl||10,allNfl.length),news=allNfl.slice(0,count);
 const nh=document.createElement('div');nh.className='section-header';nh.style.marginTop='28px';nh.innerHTML=`<h2>NFL News</h2><span class="count">Showing ${count} of ${allNfl.length}</span>`;root.appendChild(nh);
 const nb=document.createElement('div');nb.className='section-body';news.forEach((item,i)=>{const ar=document.createElement('article');ar.className='news-item';const title=item.querySelector('title')?.textContent||'Untitled',link=item.querySelector('link')?.textContent||'#',desc=item.querySelector('description')?.textContent||'',source=item.querySelector('source')?.textContent||'';ar.innerHTML=`<h3><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(title)}</a></h3>${desc?`<p class="description">${esc(desc)}</p>`:''}<div class="meta">${source?`<span class="source">${esc(source)}</span>`:''}</div>`;nb.appendChild(ar)});root.appendChild(nb);
 if(allNfl.length>count){const more=document.createElement('div');more.className='load-more-wrap';const button=document.createElement('button');button.className='load-more';const next=Math.min(count+10,allNfl.length);button.textContent=`Load 10 more (${next} of ${allNfl.length})`;button.onclick=()=>{loadCounts.nfl=next;render(allItems)};more.appendChild(button);root.appendChild(more)}
}
function regionRender(items){if(active==='nfl'){renderNfl();return}const def=sections.find(x=>x[0]===active),accent=def?def[2]:'#111827';let list=items.filter(x=>(x.querySelector('category')?.textContent?.trim()||'world')===active);if(active==='region')list=list.filter(x=>(x.querySelector('region')?.textContent?.trim()||'')===detectedRegion);const root=document.getElementById('news-feed');root.innerHTML='';const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent',accent);const head=document.createElement('div');head.className='section-header';const label=active==='region'?'🌎 '+regionLabels[detectedRegion]+' Region':(def?def[1]:'News');head.innerHTML=`<h2>${esc(label)}</h2><span class="count">${list.length} stories</span>`;sec.appendChild(head);const body=document.createElement('div');body.className='section-body';if(!list.length)body.innerHTML='<div class="empty">No stories available right now.</div>';list.forEach((item,i)=>{const ar=document.createElement('article');ar.className='news-item';const title=item.querySelector('title')?.textContent||'Untitled',desc=item.querySelector('description')?.textContent||'',why=item.querySelector('whyMatters')?.textContent||'',link=item.querySelector('link')?.textContent||'#',date=item.querySelector('pubDate')?.textContent||'',source=item.querySelector('source')?.textContent||'';ar.innerHTML=`<h3><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(title)}</a></h3>${desc?`<p class="description">${esc(desc)}</p>`:''}${why?`<div class="why">${esc(why)}</div>`:''}<div class="meta"><span>${esc(formatDate(date))}</span>${source?`<span class="source">${esc(source)}</span>`:''}</div>`;body.appendChild(ar)});sec.appendChild(body);root.appendChild(sec)}
render=regionRender;
buildTabs=function(){const tabs=document.getElementById('tabs');tabs.innerHTML='';sections.forEach(([key,label,accent])=>{const b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=key==='region'&&detectedLocation?'🌎 '+regionLabels[detectedRegion]:label;b.onclick=()=>{active=key;localStorage.setItem('underreported-active-tab',active);buildTabs();render(allItems);if(key==='region')detectUserRegion().then(()=>{if(active==='region')render(allItems)}).catch(()=>{});};b.style.setProperty('--accent',accent);tabs.appendChild(b)})};
async function detectUserRegion(){try{let c;if(navigator.geolocation)c=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:8000,maximumAge:300000}));const p=new URLSearchParams({localityLanguage:'en'});if(c){p.set('latitude',c.coords.latitude);p.set('longitude',c.coords.longitude)}const d=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?'+p,{cache:'no-store'}).then(r=>r.json()),code=(d.principalSubdivisionCode||'').replace(/^US-/,'').toUpperCase();if(stateRegion[code])detectedRegion=stateRegion[code];detectedLocation=[d.city,d.principalSubdivisionCode?.replace(/^US-/,'')].filter(Boolean).join(', ');localStorage.setItem('underreported-region',detectedRegion);localStorage.setItem('underreported-location',detectedLocation);buildTabs();if(active==='region')render(allItems)}catch(e){buildTabs()}}
detectUserRegion();
</script><script id="load-more-v1">
const STORIES_PER_PAGE = 10;
const loadCounts = {};

function paginatedNewsItems(items){
  const categoryItems = items.filter(item => (item.querySelector('category')?.textContent?.trim() || 'world') === active);
  let available = categoryItems;
  if(active === 'region') available = categoryItems.filter(item => (item.querySelector('region')?.textContent?.trim() || '') === detectedRegion);
  const count = Math.min(loadCounts[active] || STORIES_PER_PAGE, available.length);
  return {available, visible: available.slice(0, count), count};
}

const baseRenderWithPagination = render;
render = function(items){
  if(active === 'nfl') return baseRenderWithPagination(items);

  const data = paginatedNewsItems(items);
  baseRenderWithPagination(data.visible);
  const root = document.getElementById('news-feed');
  const section = root.querySelector('.section');
  if(!section) return;
  const countEl = section.querySelector('.section-header .count');
  if(countEl) countEl.textContent = `Showing ${data.count} of ${data.available.length} stories`;
  if(data.available.length <= data.count) return;
  const more = document.createElement('div');
  more.className = 'load-more-wrap';
  const button = document.createElement('button');
  button.className = 'load-more';
  const next = Math.min(data.count + STORIES_PER_PAGE, data.available.length);
  button.textContent = `Load 10 more (${next} of ${data.available.length})`;
  button.onclick = () => { loadCounts[active] = next; render(allItems); };
  more.appendChild(button);
  section.appendChild(more);
};
</script>
</body></html>
