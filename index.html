var allItems=[],active=localStorage.getItem('underreported-active-tab')||'top';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function buildTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';sections.forEach(([key,label,accent])=>{const b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;localStorage.setItem('underreported-active-tab',active);buildTabs();render(allItems)};b.style.setProperty('--accent',accent);tabs.appendChild(b)})}
function render(items){const def=sections.find(x=>x[0]===active);const accent=def?def[2]:'#111827';const list=items.filter(item=>(item.querySelector('category')?.textContent?.trim()||'world')===active);const root=document.getElementById('news-feed');root.innerHTML='';const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent',accent);const head=document.createElement('div');head.className='section-header';head.innerHTML=`<h2>${esc(def?def[1]:'News')}</h2><span class="count">${list.length} stories</span>`;sec.appendChild(head);const body=document.createElement('div');body.className='section-body';if(!list.length)body.innerHTML='<div class="empty">No stories available right now.</div>';list.forEach((item,i)=>{const title=item.querySelector('title')?.textContent||'Untitled';const desc=item.querySelector('description')?.textContent||'';const why=item.querySelector('whyMatters')?.textContent||'';const link=item.querySelector('link')?.textContent||'#';const date=item.querySelector('pubDate')?.textContent||'';const source=item.querySelector('source')?.textContent||'';const article=document.createElement('article');article.className='news-item';article.innerHTML=`<h3><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(title)}</a></h3>${desc?`<p class="description">${esc(desc)}</p>`:''}${why?`<div class="why">${esc(why)}</div>`:''}<div class="meta"><span>${esc(formatDate(date))}</span>${source?`<span class="source">${esc(source)}</span>`:''}</div>`;body.appendChild(article)});sec.appendChild(body);root.appendChild(sec)}
function marketHtml(name,value,change,cls){return `<span class="market"><span class="market-name">${esc(name)}</span><span class="market-value">${esc(value)}</span><span class="${cls}">${change}</span></span>`}
function fmtMarket(v,name){if(name==='10Y'||name==='VIX')return Number(v).toFixed(2);if(name==='WTI OIL'||name==='GOLD')return '$'+Number(v).toFixed(2);return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
async function loadMarkets(){const track=document.getElementById('markets-track');try{const r=await fetch('markets.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('market file HTTP '+r.status);const data=await r.json();const valid=(data.markets||[]).some(v=>v&&v.price!=null);if(!valid)throw new Error('no market data');let html='<span class="market-label">MARKETS</span>';(data.markets||[]).forEach(v=>{if(v.error||v.price==null){html+=`<span class="market"><span class="market-name">${esc(v.name)}</span><span class="neutral">—</span></span>`;return}const cls=v.changePct>0?'up':v.changePct<0?'down':'neutral';const arrow=v.changePct>0?'▲':v.changePct<0?'▼':'—';html+=marketHtml(v.name,fmtMarket(v.price,v.name),arrow+' '+Math.abs(Number(v.changePct)).toFixed(2)+'%',cls)});html+=`<span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>`;html+=`<span class="market-time">${data.marketClosed?'MARKETS CLOSED':'MARKET DATA'} · ${formatDate(data.updatedAt)}</span>`;track.innerHTML=html}catch(e){track.innerHTML='<span class="market-label">MARKETS</span><span class="market"><span class="neutral">Data temporarily unavailable</span></span><span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>'}}
async function loadNews(manual=false){const btn=document.getElementById('refresh'),status=document.getElementById('status');btn.disabled=true;status.textContent=manual?'Refreshing…':'Loading…';try{const response=await fetch('News?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const text=await response.text();const xml=new DOMParser().parseFromString(text,'text/xml');if(xml.querySelector('parsererror'))throw new Error('Invalid RSS/XML feed');const channel=xml.querySelector('channel');allItems=[...xml.querySelectorAll('item')];buildTabs();render(allItems);const updated=channel?.querySelector('lastBuildDate')?.textContent||new Date().toISOString();document.getElementById('last-update').textContent='Last update: '+formatDate(updated);status.textContent=allItems.length+' stories loaded'}catch(e){document.getElementById('news-feed').innerHTML=`<div class="empty">Unable to load the news feed.<br><small>${esc(e.message)}</small></div>`;status.textContent='Update failed'}finally{btn.disabled=false}}
window.addEventListener('DOMContentLoaded',()=>{if(typeof window.refreshNewsFromPage==='function'){window.refreshNewsFromPage(false)}else{loadNews(false)}});loadMarkets();setInterval(loadMarkets,60*1000);

<script id="boxoffice-location-v1">
(function(){
  if(document.getElementById('boxoffice-location-v1')) return;
  const previousRender = render;
  const stateNames = {AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',DC:'District of Columbia'};
  function localState(){
    const saved=(localStorage.getItem('underreported-location')||'').toUpperCase();
    const m=saved.match(/(?:^|,\s*)([A-Z]{2})$/);
    return m ? m[1] : '';
  }
  function safeUrl(u){try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:'#';}catch(e){return '#';}}
  function renderLocalBoxOffice(data){
    const root=document.getElementById('news-feed');
    const state=localState();
    const loc=(data.locations||{})[state]||null;
    const stateName=loc?.stateName||stateNames[state]||'your area';
    const movies=data.movies||[];
    root.innerHTML='';
    const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent','#9a3412');
    const head=document.createElement('div');head.className='section-header';
    head.innerHTML=`<h2>🎬 Box Office — ${esc(stateName)}</h2><span class="count">Movies, releases & local box-office news</span>`;sec.appendChild(head);
    const intro=document.createElement('div');intro.className='boxoffice-intro';
    intro.innerHTML=`Showing national movie releases plus box-office/theater news selected for <strong>${esc(stateName)}</strong>.${state==='NM'&&/Farmington/i.test(localStorage.getItem('underreported-location')||'')?' Local Farmington showtimes are included when available.':''}`;
    sec.appendChild(intro);
    const body=document.createElement('div');body.className='section-body';

    if(loc?.news?.length){
      const localTitle=document.createElement('div');localTitle.className='boxoffice-section-title';localTitle.textContent=`📍 ${stateName} Box Office & Theater News`;
      body.appendChild(localTitle);
      loc.news.forEach((n,i)=>{
        const ar=document.createElement('article');ar.className='news-item';
        ar.innerHTML=`<h3><a href="${esc(safeUrl(n.link))}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(n.title||'Untitled')}</a></h3>${n.description?`<p class="description">${esc(n.description)}</p>`:''}<div class="meta">${n.source?`<span class="source">${esc(n.source)}</span>`:''}${n.pubDate?`<span>${esc(formatDate(n.pubDate))}</span>`:''}</div>`;
        body.appendChild(ar);
      });
    }

    const nationalTitle=document.createElement('div');nationalTitle.className='boxoffice-section-title';nationalTitle.textContent='🎥 Movies & Releases';body.appendChild(nationalTitle);
    if(!movies.length){body.insertAdjacentHTML('beforeend','<div class="empty">Movie information is temporarily unavailable.</div>');}
    movies.forEach(movie=>{
      const card=document.createElement('article');card.className='news-item movie-card';
      const status=movie.status||'Upcoming';
      const localTheaters=movie.theaters||[];
      const showtimeHtml=localTheaters.length?`<div class="movie-showtimes"><strong>Local showtimes</strong>${localTheaters.map(t=>`<small>${esc(t.name||'Theater')}: ${esc((t.showtimes||[]).join(', '))}</small>`).join('')}</div>`:'';
      card.innerHTML=`<h3>${esc(movie.title||'Untitled')}</h3><div class="movie-details"><span class="movie-status">${esc(status)}</span>${movie.releaseDate?`<span class="movie-pill">Release: ${esc(movie.releaseDate)}</span>`:''}${movie.rating?`<span class="movie-pill">${esc(movie.rating)}</span>`:''}${movie.runtime?`<span class="movie-pill">${esc(movie.runtime)}</span>`:''}</div>${movie.description?`<p class="description">${esc(movie.description)}</p>`:''}${showtimeHtml}`;
      body.appendChild(card);
    });
    sec.appendChild(body);root.appendChild(sec);
  }
  function locationAwareRender(items){
    if(active!=='boxoffice') return previousRender(items);
    const root=document.getElementById('news-feed');root.innerHTML='<div class="loading">Loading location-specific Box Office…</div>';
    fetch('boxoffice.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Box Office data unavailable');return r.json()}).then(data=>renderLocalBoxOffice(data)).catch(()=>{root.innerHTML='<div class="empty">Box Office information is temporarily unavailable.</div>'});
  }
  render=locationAwareRender;
})();
</script>
<script id="local-status-v1">
(function(){
'use strict';
const weatherCodes={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Foggy'],48:['🌫️','Foggy'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['❄️','Snow'],75:['❄️','Heavy snow'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Heavy snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Severe thunderstorm']};

function updateClock(){const d=new Date(),date=document.getElementById('local-date'),time=document.getElementById('local-time');if(!date||!time)return;date.textContent=d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});time.textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});clearTimeout(clockTimer);clockTimer=setTimeout(updateClock,Math.max(1000,60000-(d.getSeconds()*1000+d.getMilliseconds())));}

async function loadWeather(){const icon=document.getElementById('weather-icon'),temp=document.getElementById('weather-temp'),condition=document.getElementById('weather-condition'),location=document.getElementById('weather-location');try{const c=await coords();const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(c.lat)}&longitude=${encodeURIComponent(c.lon)}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`,{cache:'no-store'});if(!r.ok)throw new Error('weather unavailable');const d=await r.json(),code=Number(d.current?.weather_code),w=weatherCodes[code]||['🌡️','Current conditions'];icon.textContent=w[0];temp.textContent=Math.round(Number(d.current?.temperature_2m))+'°';condition.textContent=w[1];location.textContent=c.label||[c.city,c.state].filter(Boolean).join(', ');}catch(e){condition.textContent='Weather unavailable';}finally{clearTimeout(weatherTimer);weatherTimer=setTimeout(loadWeather,10*60*1000);}}

const CANONICAL_SECTIONS=[['top','🔴 Top Stories','#dc2626'],['nfl','🏈 NFL','#166534'],['x','𝕏 Top Issues','#111827'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a04'],['legislation','📜 Laws & Legislation','#a16207'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['region','🌎 Region','#2563eb'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b'],['boxoffice','🎬 Box Office','#9a3412']];

const AUTO_PULL_MS=15*60*1000;

function normalizeDuplicateKey(item){const link=(item.querySelector('link')?.textContent||'').trim().toLowerCase().replace(/[?#].*$/,'').replace(/\/$/,'');if(link)return 'l:'+link;const title=(item.querySelector('title')?.textContent||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();return 't:'+title;}
function dedupeFetchedItems(items){const seen=new Set(),out=[];for(const item of items){const key=normalizeDuplicateKey(item);if(seen.has(key))continue;seen.add(key);out.push(item);}return {items:out,removed:items.length-out.length};}
function canonicalBuildTabs(){const root=document.getElementById('tabs');if(!root)return;root.innerHTML='';const seen=new Set();CANONICAL_SECTIONS.forEach(([key,label,accent])=>{if(seen.has(key))return;seen.add(key);const b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=key==='region'&&typeof detectedLocation!=='undefined'&&detectedLocation?'🌎 '+(typeof regionLabels!=='undefined'?regionLabels[detectedRegion]:'Region'):label;b.style.setProperty('--accent',accent);b.onclick=()=>{active=key;localStorage.setItem('underreported-active-tab',active);canonicalBuildTabs();canonicalRender(allItems)};root.appendChild(b)});}
function countdownText(ms){const sec=Math.max(0,Math.ceil(ms/1000));if(sec<=0)return 'now';const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:m?`${m}m ${String(s).padStart(2,'0')}s`:`${s}s`;}
function pullStatusHtml(count,failed=false,phase=''){ensurePullStatus();const root=document.getElementById('pull-status');if(!root)return;const last=lastSuccessfulPull?new Date(lastSuccessfulPull):null;const next=nextScheduledPull?new Date(nextScheduledPull):null;const left=next?countdownText(next.getTime()-Date.now()):'—';let lead=failed?'<span class="warn"><strong>⚠ Update failed</strong></span>':pullInProgress?'<span class="busy"><strong>↻ Fetching news…</strong></span>':'<span class="ok"><strong>✓ Auto update active</strong></span>';let extra=phase?`<span>${esc(phase)}</span><span class="sep">·</span>`:'';root.innerHTML=`${lead}<span class="sep">·</span>${extra}<span>Last fetch: <strong>${last?formatDate(last.toISOString()):'—'}</strong></span><span class="sep">·</span><span>Next fetch: <strong>${left}</strong></span><span class="sep">·</span><span class="count">${count||0} stories fetched</span>`;}

async function fetchNewsDocument(){
  const urls=[];
  const addUrl=(u)=>{if(u&&!urls.includes(u))urls.push(u)};
  try{addUrl(new URL('News',document.baseURI).href)}catch(e){}
  try{addUrl(new URL('./News',window.location.href).href)}catch(e){}
  // GitHub Pages project-site fallback. This only runs if the normal relative
  // URL failed and prevents a stale/odd browser base URL from breaking Refresh.
  try{addUrl(new URL('/News/News',window.location.origin).href)}catch(e){}
  let lastError=null;
  for(let attempt=0;attempt<3;attempt++){
    for(const base of urls){
      try{
        const sep=base.includes('?')?'&':'?';
        const response=await fetch(base+sep+'ts='+(Date.now()+attempt),{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const text=await response.text();
        const xml=new DOMParser().parseFromString(text,'text/xml');
        if(xml.querySelector('parsererror'))throw new Error('Invalid RSS/XML feed');
        const items=[...xml.querySelectorAll('channel > item')];
        if(!items.length)throw new Error('News feed returned zero items');
        return {response,text,xml,items};
      }catch(e){lastError=e;}
    }
    if(attempt<2)await new Promise(resolve=>setTimeout(resolve,600*(attempt+1)));
  }
  throw lastError||new Error('Unable to fetch News feed');
}

async function refreshNewsFromPage(manual=false){
  ensurePullStatus();
  const btn=document.getElementById('refresh'),status=document.getElementById('status');
  if(pullInProgress)return false;
  pullInProgress=true;
  if(btn)btn.disabled=true;
  if(status)status.textContent=manual?'Fetching…':'Updating…';
  pullStatusHtml(allItems.length,false,'Connecting to news feed');
  try{
    const loaded=await fetchNewsDocument();
    const xml=loaded.xml;
    const fetched=loaded.items;
    pullStatusHtml(allItems.length,false,'Feed downloaded');

    const beforeLinks=new Set(allItems.map(normalizeDuplicateKey));
    const result=dedupeFetchedItems(fetched);
    const refreshedItems=result.items;
    const newCount=refreshedItems.filter(item=>!beforeLinks.has(normalizeDuplicateKey(item))).length;
    allItems=refreshedItems;
    if(result.removed)console.info('Client refresh removed',result.removed,'exact duplicate article(s).');

    const channel=xml.querySelector('channel');
    const updated=channel?.querySelector('lastBuildDate')?.textContent||new Date().toISOString();
    const phase=newCount===0?'No new stories — feed is current':(result.removed?`Found ${newCount} new · removed ${result.removed} duplicate${result.removed===1?'':'s'}`:`Found ${newCount} new stor${newCount===1?'y':'ies'}`);
    pullStatusHtml(allItems.length,false,'Rendering updated feed');

    try{
      canonicalBuildTabs();
      canonicalRender(allItems);
      decorateNewBadges();
    }catch(renderError){
      console.error('Feed downloaded successfully, but page rendering failed:',renderError);
      nextScheduledPull=Date.now()+60000;
      window.nextScheduledPull=nextScheduledPull;
      if(status)status.textContent='Feed downloaded · display refresh failed';
      pullStatusHtml(allItems.length,false,'Display refresh failed · retry scheduled');
      return false;
    }

    // Only mark the pull successful after both data validation and rendering succeed.
    lastSuccessfulPull=Date.now();
    nextScheduledPull=lastSuccessfulPull+AUTO_PULL_MS;
    window.lastSuccessfulPull=lastSuccessfulPull;
    window.nextScheduledPull=nextScheduledPull;
    const lastUpdateEl=document.getElementById('last-update');
    if(lastUpdateEl)lastUpdateEl.textContent='Last update: '+formatDate(updated);
    if(status)status.textContent=allItems.length+' stories fetched · '+newCount+' new · '+result.removed+' duplicates removed';
    pullStatusHtml(allItems.length,false,phase);
    return true;
  }catch(e){
    console.error('News feed refresh failed after retries:',e);
    if(allItems.length){
      try{canonicalBuildTabs();canonicalRender(allItems);decorateNewBadges();}catch(renderExistingError){console.error('Unable to render existing feed after refresh failure:',renderExistingError);}
      if(status)status.textContent='Refresh unavailable · showing '+allItems.length+' current stories';
      pullStatusHtml(allItems.length,false,'Refresh unavailable · current feed kept');
    }else{
      if(status)status.textContent='Update failed';
      pullStatusHtml(0,true,'Unable to fetch or parse feed');
    }
    return false;
  }finally{
    pullInProgress=false;
    if(btn)btn.disabled=false;

<script id="auto-refresh-timer-v1">
(function(){
  'use strict';
  const INTERVAL=15*60*1000;
  const RETRY=60*1000;
  const BUSY_RETRY=30*1000;
  let timer=null;

  function schedule(delay){
    clearTimeout(timer);
    timer=setTimeout(run,Math.max(1000,Number(delay)||1000));
    window.__autoRefreshTimeout=timer;
  }

  function ensureNextPull(){
    if(typeof window.nextScheduledPull!=='number' || !window.nextScheduledPull){
      const last=Number(window.lastSuccessfulPull)||0;
      window.nextScheduledPull=last?last+INTERVAL:Date.now()+INTERVAL;
    }
    return window.nextScheduledPull;
  }

  async function run(){
    try{
      const due=ensureNextPull();
      if(window.pullInProgress){schedule(BUSY_RETRY);return;}
      if(Date.now()<due){schedule(due-Date.now());return;}
      if(typeof window.refreshNewsFromPage!=='function'){schedule(RETRY);return;}
      const before=Number(window.lastSuccessfulPull)||0;
      try{await window.refreshNewsFromPage(false);}catch(err){console.error('Automatic news refresh failed:',err);}
      const last=Number(window.lastSuccessfulPull)||0;
      window.nextScheduledPull=last>before?last+INTERVAL:Date.now()+RETRY;
      schedule(window.nextScheduledPull-Date.now());
    }catch(err){
      console.error('Automatic refresh scheduler error:',err);
      window.nextScheduledPull=Date.now()+RETRY;
      schedule(RETRY);
    }
  }

  function start(){
    if(window.__autoRefreshTimerV1)return;
    window.__autoRefreshTimerV1=true;
    const due=ensureNextPull();
    schedule(Math.max(1000,due-Date.now()));
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

      const ad=Date.parse(a.item.querySelector('pubDate')?.textContent||'')||0;

<script id="top-cycle-reliability-v1">
(function(){
  'use strict';

  function currentTab(){
    try{return window.active || (typeof active!=='undefined'?active:'top')}catch(e){return window.active||'top'}
  }
  function currentItems(){
    try{return window.allItems || (typeof allItems!=='undefined'?allItems:[])}catch(e){return window.allItems||[]}
  }
  function nextCircularBatch(ordered){
    if(!ordered.length)return [];
    const keys=ordered.map(topStoryKey);
    const current=(window.topRotationKeys||[]).filter(k=>keys.includes(k));
    let start=0;
    if(current.length){
      const last=keys.indexOf(current[current.length-1]);
      if(last>=0)start=(last+1)%ordered.length;
    }else if(ordered.length>STORIES_PER_PAGE){
      // If navigation/re-rendering lost the explicit rotation state while the
      // daily seen set is already exhausted, move away from the newest batch
      // instead of re-rendering the same ten and appearing to do nothing.
      start=STORIES_PER_PAGE%ordered.length;
    }
    const circular=ordered.slice(start).concat(ordered.slice(0,start));
    return circular.slice(0,Math.min(STORIES_PER_PAGE,ordered.length));
  }

  window.cycleTopStoriesAndRefresh=async function(){
    if(currentTab()!=='top')return false;
    const items=currentItems();
    const ordered=topItemsNewestFirst(items);
    if(!ordered.length)return false;

    const seen=readTopSeen();
    const unseen=ordered.filter(item=>!seen.has(topStoryKey(item)));
    const wrapped=unseen.length===0;
    const batch=wrapped?nextCircularBatch(ordered):unseen.slice(0,STORIES_PER_PAGE);
    if(!batch.length)return false;

    window.topRotationKeys=batch.map(topStoryKey);
    loadCounts.top=STORIES_PER_PAGE;
    canonicalRender(items);

    const status=document.getElementById('status');
    if(status){
      status.textContent=wrapped
        ? `Continuing Top Stories cycle · ${batch.length} stories · checking for updates…`
        : `Showing ${batch.length} unseen Top Stories · checking for updates…`;
    }

    // Passive refresh: start it after the visible batch changes, but do not
    // make the discovery button wait for the network request. The canonical
    // refresh keeps all tabs current and preserves the active Top rotation.
    const refreshFn=window.refreshNewsFromPage || (typeof refreshNewsFromPage==='function'?refreshNewsFromPage:null);
    if(refreshFn){
      Promise.resolve(refreshFn(false)).catch(e=>console.error('Passive full-feed refresh failed:',e));
    }
    return true;
  };

  // Capture-phase delegation makes the button reliable after any tab rebuild.
  // It intentionally supersedes older per-button listeners without stacking
  // multiple Top cycles on a single click.
  document.addEventListener('click',async function(e){
    const btn=e.target?.closest?.('#refresh');
    if(!btn || currentTab()!=='top')return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(btn.dataset.topCycleBusy==='1')return;
    btn.dataset.topCycleBusy='1';
    btn.disabled=true;
    btn.textContent='⟳ Checking…';
    try{
      await window.cycleTopStoriesAndRefresh();
    }catch(err){
      console.error('Top Stories cycle failed:',err);
    }finally{
      btn.dataset.topCycleBusy='';
      btn.disabled=false;
      btn.textContent='↻ Next Top Stories';
      if(typeof window.refreshPullStatsUI==='function')window.refreshPullStatsUI(false,'');
    }
  },true);
})();
</script>
<script id="alerts-status-v22">
(function(){

  let refreshState='scheduled';

  let statsTimer=null;

  const byId=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function shortTime(ms){if(!ms)return '—';try{return new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch(e){return '—'}}
  function countdown(ms){

        window.lastSuccessfulPull=Math.max(Number(window.lastSuccessfulPull)||0,parsed);
        const now=Date.now(),next=Number(window.nextScheduledPull)||0;
        if(next<=now&&refreshState!=='retrying')window.nextScheduledPull=Math.max(parsed+AUTO_MS,now+1000);
      }
    }catch(e){console.warn('Update statistics unavailable:',e)}
    if(typeof window.decorateNewBadges==='function')window.decorateNewBadges();
    renderStatus();
  }

  function wireTopButton(){
    const btn=byId('refresh');if(!btn)return;
    const current=()=>{try{return typeof active!=='undefined'?active:(window.active||'top')}catch(e){return window.active||'top'}};
    btn.hidden=current()!=='top';btn.type='button';btn.textContent='↻ Next Top Stories';
    if(btn.dataset.v22Wired)return;btn.dataset.v22Wired='1';
    btn.addEventListener('click',async()=>{
      if(btn.disabled||current()!=='top')return;
      btn.disabled=true;btn.textContent='⟳ Checking…';
      try{if(typeof window.cycleTopStoriesAndRefresh==='function')await window.cycleTopStoriesAndRefresh();else if(typeof window.refreshNewsFromPage==='function')await window.refreshNewsFromPage(false)}catch(e){console.error(e)}
      finally{btn.disabled=false;btn.textContent='↻ Next Top Stories';renderStatus()}
    });
  }
  window.syncTopDiscoveryButton=function(){wireTopButton();renderStatus()};

  const originalRefresh=window.refreshNewsFromPage;
  if(typeof originalRefresh==='function'&&!originalRefresh.__v22Wrapped){
    const wrapped=async function(...args){
      const before=Number(window.lastSuccessfulPull)||0;refreshState='checking';renderStatus();
      try{return await originalRefresh.apply(this,args)}finally{
        const after=Number(window.lastSuccessfulPull)||0;
        refreshState=after>before?'scheduled':'retrying';
        if(refreshState==='retrying'&&Number(window.nextScheduledPull)<=Date.now())window.nextScheduledPull=Date.now()+60*1000;
        await loadStats();
      }
    };
    wrapped.__v22Wrapped=true;window.refreshNewsFromPage=wrapped;
  }

  const tabs=byId('tabs');if(tabs)tabs.addEventListener('click',()=>setTimeout(()=>{wireTopButton();renderStatus()},0));
  function tick(){renderStatus();tickTimer=setTimeout(tick,1000-(Date.now()%1000)+20)}
  function refreshStatsLoop(){void loadStats();statsTimer=setTimeout(refreshStatsLoop,60000)}
  wireTopButton();void loadStats();tick();statsTimer=setTimeout(refreshStatsLoop,60000);
  window.__alertsStatusV22=true;
})();
</script>
<script id="alerts-new-v23">
(function(){
  'use strict';
  const RED_SITE_TTL=60*60*1000;
  const BLUE_PUBLISHED_TTL=3*60*60*1000;
  const YELLOW_SITE_TTL=3*60*60*1000;
  const YELLOW_MIN_PUBLISHED_AGE=6*60*60*1000;
  const CLOCK_SLOP=5*60*1000;
  const SERVER_STATS='update-stats.json';
  const CLIENT_KEY='underreported-first-seen-v26';
  let serverFirstSeen=new Map();
  let clientFirstSeen=new Map();
  let refreshWrapped=false;
  let badgeTimer=0;

  function normalizeLink(v){
    try{const u=new URL(String(v||''),location.href);u.hash='';return u.href}
    catch(e){return String(v||'').trim()}
  }
  function feedItems(){
    try{return (typeof allItems!=='undefined'&&Array.isArray(allItems))?allItems:(Array.isArray(window.allItems)?window.allItems:[])}catch(e){return Array.isArray(window.allItems)?window.allItems:[]}
  }
  function feedLinks(){
    const out=new Set();
    feedItems().forEach(item=>{const link=normalizeLink(item?.querySelector?.('link')?.textContent||'');if(link)out.add(link)});
    return out;
  }
  function publicationMap(){
    const out=new Map();
    feedItems().forEach(item=>{
      const link=normalizeLink(item?.querySelector?.('link')?.textContent||'');
      const pub=Date.parse(item?.querySelector?.('pubDate')?.textContent||'')||0;
      if(link)out.set(link,pub);
    });
    return out;
  }
  function pruneClient(){
    const cutoff=Date.now()-YELLOW_SITE_TTL;
    for(const [link,at] of clientFirstSeen){if(!Number.isFinite(at)||at<cutoff)clientFirstSeen.delete(link)}
  }
  function saveClient(){
    pruneClient();
    try{localStorage.setItem(CLIENT_KEY,JSON.stringify([...clientFirstSeen]))}catch(e){}
  }
  function restoreClient(){
    try{
      const rows=JSON.parse(localStorage.getItem(CLIENT_KEY)||'[]');
      if(Array.isArray(rows))rows.forEach(row=>{if(Array.isArray(row)&&row.length===2)clientFirstSeen.set(normalizeLink(row[0]),Number(row[1])||0)});
    }catch(e){}
    pruneClient();
  }
  function markClientNew(links){
    const now=Date.now();
    (links||[]).forEach(raw=>{
      const link=normalizeLink(raw);if(!link)return;
      if(!clientFirstSeen.has(link)&&!serverFirstSeen.has(link))clientFirstSeen.set(link,now);
    });
    saveClient();
  }
  function firstSeenFor(link){
    link=normalizeLink(link);if(!link)return 0;
    const server=Number(serverFirstSeen.get(link)||0);if(server)return server;
    pruneClient();return Number(clientFirstSeen.get(link)||0);
  }
  function classifyTimes(publishedAt,firstSeenAt,now=Date.now()){
    const pub=Number(publishedAt)||0,first=Number(firstSeenAt)||0;
    const siteAge=first?now-first:Infinity;
    const pubAge=pub?now-pub:Infinity;
    if(first&&siteAge>=-CLOCK_SLOP&&siteAge<=RED_SITE_TTL)return 'red';
    if(pub&&pubAge>=-CLOCK_SLOP&&pubAge<=BLUE_PUBLISHED_TTL)return 'blue';
    if(first&&siteAge>=-CLOCK_SLOP&&siteAge<=YELLOW_SITE_TTL&&pub&&pubAge>YELLOW_MIN_PUBLISHED_AGE)return 'yellow';
    return '';
  }
  window.__classifyNewBadgeV26=classifyTimes;

  function scheduleNextChange(pub,first,now){
    const points=[];
    if(first){points.push(first+RED_SITE_TTL,first+YELLOW_SITE_TTL)}
    if(pub)points.push(pub+BLUE_PUBLISHED_TTL);
    return points.filter(x=>x>now+250).sort((a,b)=>a-b)[0]||0;
  }
  function decorate(){
    const pubs=publicationMap(),now=Date.now();let next=0;
    document.querySelectorAll('#news-feed .news-item').forEach(card=>{
      const h=card.querySelector('h3');if(!h)return;
      const href=normalizeLink(card.querySelector('h3 a[href]')?.href||'');
      const first=firstSeenFor(href),pub=pubs.get(href)||0;
      const state=classifyTimes(pub,first,now);
      let badge=h.querySelector('.new-badge');
      if(!state){if(badge)badge.remove();return}
      if(!badge){badge=document.createElement('span');badge.className='new-badge';badge.textContent='NEW';h.appendChild(badge)}
      badge.classList.remove('new-badge-red','new-badge-blue','new-badge-yellow');
      badge.classList.add('new-badge-'+state);
      if(state==='red')badge.title='New to Underreported within the last hour';
      if(state==='blue')badge.title='Published within the last three hours';
      if(state==='yellow')badge.title='Older article newly added to Underreported within the last three hours';
      const change=scheduleNextChange(pub,first,now);if(change&&(!next||change<next))next=change;
    });
    if(badgeTimer)clearTimeout(badgeTimer);
    if(next)badgeTimer=setTimeout(decorate,Math.max(500,next-Date.now()+100));
  }
  window.decorateNewBadges=decorate;
  window.__markNewArticleLinksV23=function(links){markClientNew(links);decorate()};

  async function syncServerNew(){
    try{
      const r=await fetch(SERVER_STATS+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
      const stats=await r.json();
      const map=new Map();
      if(stats.firstSeenAt&&typeof stats.firstSeenAt==='object'){
        Object.entries(stats.firstSeenAt).forEach(([raw,stamp])=>{const link=normalizeLink(raw),at=Date.parse(stamp)||Number(stamp)||0;if(link&&at)map.set(link,at)});
      }else{
        const at=Date.parse(stats.updatedAt||'')||0;
        (stats.newLinks||[]).forEach(raw=>{const link=normalizeLink(raw);if(link&&at)map.set(link,at)});
      }
      serverFirstSeen=map;
    }catch(e){console.warn('NEW article statistics unavailable:',e)}
    decorate();
  }

  function wrapRefresh(){
    if(refreshWrapped||typeof window.refreshNewsFromPage!=='function')return;
    const previous=window.refreshNewsFromPage;
    if(previous.__v23Wrapped){refreshWrapped=true;return}
    const wrapped=async function(...args){
      const before=feedLinks();
      const result=await previous.apply(this,args);
      const after=feedLinks();
      const discovered=[...after].filter(link=>!before.has(link));
      if(discovered.length)markClientNew(discovered);
      await syncServerNew();
      decorate();
      return result;
    };
    wrapped.__v23Wrapped=true;
    window.refreshNewsFromPage=wrapped;
    refreshWrapped=true;
  }

  restoreClient();wrapRefresh();void syncServerNew();
  const feed=document.getElementById('news-feed');
  if(feed)new MutationObserver(decorate).observe(feed,{childList:true,subtree:true});
  document.addEventListener('underreported:feed-rendered',decorate);
  window.__alertsNewV23=true;
  window.__alertsNewV26=true;
})();
</script>
