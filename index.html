<body><div class="container"><header><h1>UNDERREPORTED</h1><p>High-impact stories outside the usual news cycle.</p></header><div class="toolbar"><button id="refresh" type="button">↻ Next Top Stories</button><span id="status">Loading…</span><div id="local-status" class="local-status" aria-label="Local date, time and weather"><span class="local-date" id="local-date">—</span><span class="local-sep">·</span><span class="local-time" id="local-time">—</span><span class="local-sep">·</span><span class="local-weather"><span id="weather-icon">☀️</span><span class="weather-temp" id="weather-temp">—°</span><span class="weather-condition" id="weather-condition">Loading weather…</span><span class="weather-location" id="weather-location"></span></span></div></div><div id="pull-stats-ui" role="status" aria-live="polite" class="ready"><strong>✓ Auto update active</strong><span>•</span><span>Loading pull statistics…</span></div><div class="markets" aria-label="Market data"><div class="markets-track" id="markets-track"><span class="market-label">MARKETS</span><span class="market"><span class="market-name">Loading market data…</span></span></div></div><nav class="tabs" id="tabs" aria-label="News categories"></nav><main class="content" id="news-feed"><div class="loading">Loading news…</div></main><footer>Automated news intelligence · <span id="last-update">Last update: —</span></footer></div>
<script>
const sections=[['top','🔴 Top Stories','#dc2626'],['nfl','🏈 NFL','#166534'],['x','𝕏 Top Issues','#111827'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a04'],['legislation','📜 Laws & Legislation','#a16207'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['region','🌎 Region','#2563eb'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b'],['boxoffice','🎬 Box Office','#9a3412']];









































































var allItems=[],active=localStorage.getItem('underreported-active-tab')||'top';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function buildTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';sections.forEach(([key,label,accent])=>{const b=document.createElement('button');b.className='tab'+(key===active?' active':'');b.textContent=label;b.onclick=()=>{active=key;localStorage.setItem('underreported-active-tab',active);buildTabs();render(allItems)};b.style.setProperty('--accent',accent);tabs.appendChild(b)})}
function render(items){const def=sections.find(x=>x[0]===active);const accent=def?def[2]:'#111827';const list=items.filter(item=>(item.querySelector('category')?.textContent?.trim()||'world')===active);const root=document.getElementById('news-feed');root.innerHTML='';const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent',accent);const head=document.createElement('div');head.className='section-header';head.innerHTML=`<h2>${esc(def?def[1]:'News')}</h2><span class="count">${list.length} stories</span>`;sec.appendChild(head);const body=document.createElement('div');body.className='section-body';if(!list.length)body.innerHTML='<div class="empty">No stories available right now.</div>';list.forEach((item,i)=>{const title=item.querySelector('title')?.textContent||'Untitled';const desc=item.querySelector('description')?.textContent||'';const why=item.querySelector('whyMatters')?.textContent||'';const link=item.querySelector('link')?.textContent||'#';const date=item.querySelector('pubDate')?.textContent||'';const source=item.querySelector('source')?.textContent||'';const article=document.createElement('article');article.className='news-item';article.innerHTML=`<h3><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(title)}</a></h3>${desc?`<p class="description">${esc(desc)}</p>`:''}${why?`<div class="why">${esc(why)}</div>`:''}<div class="meta"><span>${esc(formatDate(date))}</span>${source?`<span class="source">${esc(source)}</span>`:''}</div>`;body.appendChild(article)});sec.appendChild(body);root.appendChild(sec)}
function marketHtml(name,value,change,cls){return `<span class="market"><span class="market-name">${esc(name)}</span><span class="market-value">${esc(value)}</span><span class="${cls}">${change}</span></span>`}
function fmtMarket(v,name){if(name==='10Y'||name==='VIX')return Number(v).toFixed(2);if(name==='WTI OIL'||name==='GOLD')return '$'+Number(v).toFixed(2);return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
async function loadMarkets(){const track=document.getElementById('markets-track');try{const r=await fetch('markets.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('market file HTTP '+r.status);const data=await r.json();const valid=(data.markets||[]).some(v=>v&&v.price!=null);if(!valid)throw new Error('no market data');let html='<span class="market-label">MARKETS</span>';(data.markets||[]).forEach(v=>{if(v.error||v.price==null){html+=`<span class="market"><span class="market-name">${esc(v.name)}</span><span class="neutral">—</span></span>`;return}const cls=v.changePct>0?'up':v.changePct<0?'down':'neutral';const arrow=v.changePct>0?'▲':v.changePct<0?'▼':'—';html+=marketHtml(v.name,fmtMarket(v.price,v.name),arrow+' '+Math.abs(Number(v.changePct)).toFixed(2)+'%',cls)});html+=`<span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>`;html+=`<span class="market-time">${data.marketClosed?'MARKETS CLOSED':'MARKET DATA'} · ${formatDate(data.updatedAt)}</span>`;track.innerHTML=html}catch(e){track.innerHTML='<span class="market-label">MARKETS</span><span class="market"><span class="neutral">Data temporarily unavailable</span></span><span class="market"><span class="market-name">OPEC</span><span class="neutral">WATCH</span></span>'}}
async function loadNews(manual=false){const btn=document.getElementById('refresh'),status=document.getElementById('status');btn.disabled=true;status.textContent=manual?'Refreshing…':'Loading…';try{const response=await fetch('News?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const text=await response.text();const xml=new DOMParser().parseFromString(text,'text/xml');if(xml.querySelector('parsererror'))throw new Error('Invalid RSS/XML feed');const channel=xml.querySelector('channel');allItems=[...xml.querySelectorAll('item')];buildTabs();render(allItems);const updated=channel?.querySelector('lastBuildDate')?.textContent||new Date().toISOString();document.getElementById('last-update').textContent='Last update: '+formatDate(updated);status.textContent=allItems.length+' stories loaded'}catch(e){document.getElementById('news-feed').innerHTML=`<div class="empty">Unable to load the news feed.<br><small>${esc(e.message)}</small></div>`;status.textContent='Update failed'}finally{btn.disabled=false}}
window.addEventListener('DOMContentLoaded',()=>{if(typeof window.refreshNewsFromPage==='function'){window.refreshNewsFromPage(false)}else{loadNews(false)}});loadMarkets();setInterval(loadMarkets,60*1000);
</script>



















































































































<script id="boxoffice-location-v1">
(function(){
  if(document.getElementById('boxoffice-location-v1')) return;
  const previousRender = render;
  const stateNames = {AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',DC:'District of Columbia'};
  function localState(){
    const saved=(localStorage.getItem('underreported-location')||'').toUpperCase();
    const m=saved.match(/(?:^|,\s*)([A-Z]{2})$/);
    return m ? m[1] : '';
  }
  function safeUrl(u){try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:'#';}catch(e){return '#';}}
  function renderLocalBoxOffice(data){
    const root=document.getElementById('news-feed');
    const state=localState();
    const loc=(data.locations||{})[state]||null;
    const stateName=loc?.stateName||stateNames[state]||'your area';
    const movies=data.movies||[];
    root.innerHTML='';
    const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--accent','#9a3412');
    const head=document.createElement('div');head.className='section-header';
    head.innerHTML=`<h2>🎬 Box Office — ${esc(stateName)}</h2><span class="count">Movies, releases & local box-office news</span>`;sec.appendChild(head);
    const intro=document.createElement('div');intro.className='boxoffice-intro';
    intro.innerHTML=`Showing national movie releases plus box-office/theater news selected for <strong>${esc(stateName)}</strong>.${state==='NM'&&/Farmington/i.test(localStorage.getItem('underreported-location')||'')?' Local Farmington showtimes are included when available.':''}`;
    sec.appendChild(intro);
    const body=document.createElement('div');body.className='section-body';

    if(loc?.news?.length){
      const localTitle=document.createElement('div');localTitle.className='boxoffice-section-title';localTitle.textContent=`📍 ${stateName} Box Office & Theater News`;
      body.appendChild(localTitle);
      loc.news.forEach((n,i)=>{
        const ar=document.createElement('article');ar.className='news-item';
        ar.innerHTML=`<h3><a href="${esc(safeUrl(n.link))}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(n.title||'Untitled')}</a></h3>${n.description?`<p class="description">${esc(n.description)}</p>`:''}<div class="meta">${n.source?`<span class="source">${esc(n.source)}</span>`:''}${n.pubDate?`<span>${esc(formatDate(n.pubDate))}</span>`:''}</div>`;
        body.appendChild(ar);
      });
    }

    const nationalTitle=document.createElement('div');nationalTitle.className='boxoffice-section-title';nationalTitle.textContent='🎥 Movies & Releases';body.appendChild(nationalTitle);
    if(!movies.length){body.insertAdjacentHTML('beforeend','<div class="empty">Movie information is temporarily unavailable.</div>');}
    movies.forEach(movie=>{
      const card=document.createElement('article');card.className='news-item movie-card';
      const status=movie.status||'Upcoming';
      const localTheaters=movie.theaters||[];
      const showtimeHtml=localTheaters.length?`<div class="movie-showtimes"><strong>Local showtimes</strong>${localTheaters.map(t=>`<small>${esc(t.name||'Theater')}: ${esc((t.showtimes||[]).join(', '))}</small>`).join('')}</div>`:'';
      card.innerHTML=`<h3>${esc(movie.title||'Untitled')}</h3><div class="movie-details"><span class="movie-status">${esc(status)}</span>${movie.releaseDate?`<span class="movie-pill">Release: ${esc(movie.releaseDate)}</span>`:''}${movie.rating?`<span class="movie-pill">${esc(movie.rating)}</span>`:''}${movie.runtime?`<span class="movie-pill">${esc(movie.runtime)}</span>`:''}</div>${movie.description?`<p class="description">${esc(movie.description)}</p>`:''}${showtimeHtml}`;
      body.appendChild(card);
    });
    sec.appendChild(body);root.appendChild(sec);
  }
  function locationAwareRender(items){
    if(active!=='boxoffice') return previousRender(items);
    const root=document.getElementById('news-feed');root.innerHTML='<div class="loading">Loading location-specific Box Office…</div>';
    fetch('boxoffice.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Box Office data unavailable');return r.json()}).then(data=>renderLocalBoxOffice(data)).catch(()=>{root.innerHTML='<div class="empty">Box Office information is temporarily unavailable.</div>'});
  }
  render=locationAwareRender;
})();
</script>






















































































































































































































































































































































































































































































































































<script id="related-coverage-v1">
(function(){
  function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
  function decorate(){
    document.querySelectorAll('.news-item').forEach(card=>{
      if(card.querySelector('.related-coverage'))return;
      const titleEl=card.querySelector('h3 a'); if(!titleEl)return;
      const title=titleEl.textContent.replace(/^\d+\.\s*/,'').trim();
      const item=(window.allItems||[]).find(x=>(x.querySelector('title')?.textContent||'').trim()===title);
      if(!item)return;
      const related=[...item.querySelectorAll('relatedArticles article')];
      if(!related.length)return;
      const box=document.createElement('div');box.className='related-coverage';
      box.innerHTML='<strong>Similar coverage:</strong>'+related.map(r=>{const t=r.querySelector('title')?.textContent||'';const l=r.querySelector('link')?.textContent||'#';const src=r.querySelector('source')?.textContent||'';return `<a href="${esc(l)}" target="_blank" rel="noopener noreferrer">${esc(t)}${src?' <span class="source">— '+esc(src)+'</span>':''}</a>`}).join('');
      card.appendChild(box);

    }
    if(attempt<2)await new Promise(resolve=>setTimeout(resolve,600*(attempt+1)));

}

<script id="auto-refresh-timer-v1">
(function(){
  'use strict';
  const INTERVAL=15*60*1000;
  const RETRY=60*1000;
  function start(){
    if(window.__autoRefreshTimerV1)return;
    window.__autoRefreshTimerV1=true;
    function tick(){
      try{
        if(window.pullInProgress)return;
        if(typeof window.nextScheduledPull!=='number' || !window.nextScheduledPull){
          const last=Number(window.lastSuccessfulPull)||0;
          window.nextScheduledPull=last?last+INTERVAL:Date.now()+INTERVAL;
        }
        if(Date.now()<window.nextScheduledPull)return;
        if(typeof window.refreshNewsFromPage!=='function')return;
        const before=Number(window.lastSuccessfulPull)||0;
        window.refreshNewsFromPage(false).then(function(){
          const last=Number(window.lastSuccessfulPull)||0;
          if(last>before)window.nextScheduledPull=last+INTERVAL;
          else window.nextScheduledPull=Date.now()+RETRY;
        }).catch(function(err){
          console.error('Automatic news refresh failed:',err);
          window.nextScheduledPull=Date.now()+RETRY;
        });
      }catch(e){
        console.error('Automatic refresh timer error:',e);
        window.nextScheduledPull=Date.now()+RETRY;
      }
    }
    setInterval(tick,1000);
    tick();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

<script id="load-more-v1">
const STORIES_PER_PAGE = 10;
const TOP_DISCOVERY_MARKER = 'top-story-cycle-v1';
const TOP_SEEN_STORAGE = 'news-top-seen-v1';
window.loadCounts = window.loadCounts || {};
const loadCounts = window.loadCounts;
window.topRotationKeys = window.topRotationKeys || [];

function topStoryKey(item){
  const link=(item.querySelector('link')?.textContent||'').trim().toLowerCase().replace(/[?#].*$/,'').replace(/\/$/,'');
  if(link)return 'l:'+link;
  const title=(item.querySelector('title')?.textContent||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  return 't:'+title;
}
function topStorageDay(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function readTopSeen(){
  try{
    const raw=JSON.parse(localStorage.getItem(TOP_SEEN_STORAGE)||'{}');
    if(raw.day!==topStorageDay()||!Array.isArray(raw.keys))return new Set();
    return new Set(raw.keys);
  }catch(e){return new Set()}
}
function writeTopSeen(seen){
  try{localStorage.setItem(TOP_SEEN_STORAGE,JSON.stringify({day:topStorageDay(),keys:[...seen].slice(-300)}))}catch(e){}
}
function topItemsNewestFirst(items){
  return items
    .map((item,index)=>({item,index}))
    .filter(x=>(x.item.querySelector('category')?.textContent?.trim()||'world')==='top')
    .sort((a,b)=>{
      const ad=Date.parse(a.item.querySelector('pubDate')?.textContent||'')||0;
      const bd=Date.parse(b.item.querySelector('pubDate')?.textContent||'')||0;
      return bd-ad||a.index-b.index;
    })
    .map(x=>x.item);
}
function topItemIsFresh(item){
  const ms=Date.parse(item.querySelector('pubDate')?.textContent||'');
  return Number.isFinite(ms)&&Date.now()-ms<=60*60*1000&&Date.now()>=ms-5*60*1000;
}
function topDisplayItems(items){
  const ordered=topItemsNewestFirst(items);
  const seen=readTopSeen();
  const byKey=new Map(ordered.map(item=>[topStoryKey(item),item]));
  const freshUnseen=ordered.filter(item=>!seen.has(topStoryKey(item))&&topItemIsFresh(item));
  const freshKeys=new Set(freshUnseen.map(topStoryKey));
  const rotated=(window.topRotationKeys||[]).map(k=>byKey.get(k)).filter(Boolean).filter(item=>!freshKeys.has(topStoryKey(item)));
  const used=new Set([...freshUnseen,...rotated].map(topStoryKey));
  return [...freshUnseen,...rotated,...ordered.filter(item=>!used.has(topStoryKey(item)))];
}
function markTopStoriesSeen(items){
  const seen=readTopSeen();
  items.forEach(item=>seen.add(topStoryKey(item)));
  writeTopSeen(seen);
}
function syncDiscoveryButton(){
  if(typeof window.syncTopDiscoveryButton==='function')window.syncTopDiscoveryButton();
}

function paginatedNewsItems(items){
  let available;
  if(active==='top'){
    available=topDisplayItems(items);
  }else{
    const categoryItems=items.filter(item=>(item.querySelector('category')?.textContent?.trim()||'world')===active);
    available=categoryItems;
    if(active==='region')available=categoryItems.filter(item=>(item.querySelector('region')?.textContent?.trim()||'')===detectedRegion);
  }
  const count=Math.min(loadCounts[active]||STORIES_PER_PAGE,available.length);
  return {available,visible:available.slice(0,count),count};
}

function appendLoadMoreControl(data){
  const root=document.getElementById('news-feed');
  if(!root)return;
  root.querySelectorAll('.load-more-wrap').forEach(el=>el.remove());
  if(data.available.length<=data.count)return;
  const more=document.createElement('div');
  more.className='load-more-wrap';
  const button=document.createElement('button');
  button.type='button';
  button.className='load-more';
  const next=Math.min(data.count+STORIES_PER_PAGE,data.available.length);
  button.textContent=`Load 10 more (${next} of ${data.available.length})`;
  button.onclick=()=>{
    loadCounts[active]=next;
    canonicalRender(allItems);
  };
  more.appendChild(button);
  // Keep pagination outside the category section. Several category renderers
  // rebuild their section after canonicalRender and could otherwise delete it.
  root.appendChild(more);
}

const baseCanonicalRenderWithPagination=canonicalRender;
canonicalRender=function(items){
  if(active==='bookmarks'||active==='boxoffice'){
    const out=baseCanonicalRenderWithPagination(items);
    syncDiscoveryButton();
    return out;
  }
  if(active==='nfl'){
    const data=paginatedNewsItems(items);
    loadCounts.nfl=data.count;
    baseCanonicalRenderWithPagination(items);
    const nflHeaders=[...document.querySelectorAll('.section-header')];
    const nflNewsHeader=nflHeaders.find(el=>el.querySelector('h2')?.textContent?.trim()==='NFL News');
    const countEl=nflNewsHeader?.querySelector('.count');
    if(countEl)countEl.textContent=`Showing ${data.count} of ${data.available.length}`;
    appendLoadMoreControl(data);
    syncDiscoveryButton();
    return;
  }
  const data=paginatedNewsItems(items);
  baseCanonicalRenderWithPagination(data.visible);
  const root=document.getElementById('news-feed');
  const countEl=root?.querySelector('.section .section-header .count');
  if(countEl)countEl.textContent=`Showing ${data.count} of ${data.available.length} stories`;
  if(active==='top')markTopStoriesSeen(data.visible);
  appendLoadMoreControl(data);
  syncDiscoveryButton();
};

window.cycleTopStoriesAndRefresh=async function(){
  if(active!=='top')return false;
  const ordered=topItemsNewestFirst(allItems);
  const seen=readTopSeen();
  const unseen=ordered.filter(item=>!seen.has(topStoryKey(item)));
  const status=document.getElementById('status');
  if(unseen.length){
    const batch=unseen.slice(0,STORIES_PER_PAGE);
    window.topRotationKeys=batch.map(topStoryKey);
    loadCounts.top=STORIES_PER_PAGE;
    canonicalRender(allItems);
    if(status)status.textContent=`Showing ${batch.length} unseen Top Stories · checking for updates…`;
  }else{
    window.topRotationKeys=[];
    loadCounts.top=STORIES_PER_PAGE;
    canonicalRender(allItems);
    if(status)status.textContent='You’re caught up · showing newest Top Stories · checking for updates…';
  }
  const refreshFn=window.refreshNewsFromPage||(typeof refreshNewsFromPage==='function'?refreshNewsFromPage:null);
  if(refreshFn){
    try{await refreshFn(false)}catch(e){console.error('Passive full-feed refresh failed:',e)}
  }
  return true;
};

render=canonicalRender;
window.render=canonicalRender;
syncDiscoveryButton();
</script>

<script id="legislation-location-v1">
(function(){
 'use strict';
 const STATES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',DC:'District of Columbia'};
 let stateCache=null,cacheLoaded=false,cachePromise=null,lastState='';
 function stateCode(){
   let code=(localStorage.getItem('underreported-state')||'').toUpperCase();
   if(STATES[code])return code;
   const loc=(localStorage.getItem('underreported-location')||'').toUpperCase();
   const m=loc.match(/(?:,\s*|\b)([A-Z]{2})$/); return m&&STATES[m[1]]?m[1]:'NM';
 }
 function stateName(){return STATES[stateCode()]||'New Mexico'}
 function x(doc,tag,value){const e=doc.createElement(tag);e.textContent=value||'';return e}
 function jsonItem(rec){
   const doc=document.implementation.createDocument('','item'); const item=doc.documentElement;
   const link=rec.officialSource||rec.indexSource||'#';
   item.appendChild(x(doc,'title',`${rec.billNumber||''} — ${rec.title||'State legislation'}`));
   item.appendChild(x(doc,'link',link)); item.appendChild(x(doc,'description',rec.description||rec.title||''));
   item.appendChild(x(doc,'pubDate',rec.latestActionDate||rec.statusDate||'')); item.appendChild(x(doc,'source',`${rec.stateName||stateName()} Legislature`));
   item.appendChild(x(doc,'category','legislation')); item.appendChild(x(doc,'jurisdiction',rec.stateName||stateName()));
   item.appendChild(x(doc,'status',rec.status||'Active')); item.appendChild(x(doc,'whatItDoes',rec.description||rec.title||''));
   item.appendChild(x(doc,'whoAffected','Residents, organizations, agencies, or programs covered by the measure'));
   item.appendChild(x(doc,'effectiveDate','See official bill text / enacted law'));
   item.appendChild(x(doc,'nextStep',/passed|enrolled/i.test(rec.status||'')?'Implementation, executive action, or final procedural steps.':'Watch the next committee, floor, or executive action.'));
   item.appendChild(x(doc,'officialSource',rec.officialSource||'')); item.appendChild(x(doc,'billNumber',rec.billNumber||''));
   item.appendChild(x(doc,'latestAction',rec.latestAction||'')); item.appendChild(x(doc,'sponsor',rec.sponsor||''));
   return item;
 }
 function startCacheLoad(){
   if(cacheLoaded||cachePromise)return cachePromise;

   return cachePromise;

 function locationItems(items){

   const federal=items.filter(i=>(i.querySelector('category')?.textContent?.trim()||'')==='legislation' && /federal/i.test(i.querySelector('jurisdiction')?.textContent||''));

<script id="top-cycle-reliability-v1">
(function(){
  'use strict';

  function currentTab(){
    try{return window.active || (typeof active!=='undefined'?active:'top')}catch(e){return window.active||'top'}
  }
  function currentItems(){
    try{return window.allItems || (typeof allItems!=='undefined'?allItems:[])}catch(e){return window.allItems||[]}
  }
  function nextCircularBatch(ordered){
    if(!ordered.length)return [];
    const keys=ordered.map(topStoryKey);
    const current=(window.topRotationKeys||[]).filter(k=>keys.includes(k));
    let start=0;
    if(current.length){
      const last=keys.indexOf(current[current.length-1]);
      if(last>=0)start=(last+1)%ordered.length;
    }else if(ordered.length>STORIES_PER_PAGE){
      // If navigation/re-rendering lost the explicit rotation state while the
      // daily seen set is already exhausted, move away from the newest batch
      // instead of re-rendering the same ten and appearing to do nothing.
      start=STORIES_PER_PAGE%ordered.length;
    }
    const circular=ordered.slice(start).concat(ordered.slice(0,start));
    return circular.slice(0,Math.min(STORIES_PER_PAGE,ordered.length));
  }

  window.cycleTopStoriesAndRefresh=async function(){
    if(currentTab()!=='top')return false;
    const items=currentItems();
    const ordered=topItemsNewestFirst(items);
    if(!ordered.length)return false;

    const seen=readTopSeen();
    const unseen=ordered.filter(item=>!seen.has(topStoryKey(item)));
    const wrapped=unseen.length===0;
    const batch=wrapped?nextCircularBatch(ordered):unseen.slice(0,STORIES_PER_PAGE);
    if(!batch.length)return false;

    window.topRotationKeys=batch.map(topStoryKey);
    loadCounts.top=STORIES_PER_PAGE;
    canonicalRender(items);

    const status=document.getElementById('status');
    if(status){
      status.textContent=wrapped
        ? `Continuing Top Stories cycle · ${batch.length} stories · checking for updates…`
        : `Showing ${batch.length} unseen Top Stories · checking for updates…`;
    }

    // Passive refresh: start it after the visible batch changes, but do not
    // make the discovery button wait for the network request. The canonical
    // refresh keeps all tabs current and preserves the active Top rotation.
    const refreshFn=window.refreshNewsFromPage || (typeof refreshNewsFromPage==='function'?refreshNewsFromPage:null);
    if(refreshFn){
      Promise.resolve(refreshFn(false)).catch(e=>console.error('Passive full-feed refresh failed:',e));
    }
    return true;
  };

  // Capture-phase delegation makes the button reliable after any tab rebuild.
  // It intentionally supersedes older per-button listeners without stacking
  // multiple Top cycles on a single click.
  document.addEventListener('click',async function(e){
    const btn=e.target?.closest?.('#refresh');
    if(!btn || currentTab()!=='top')return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(btn.dataset.topCycleBusy==='1')return;
    btn.dataset.topCycleBusy='1';
    btn.disabled=true;
    btn.textContent='⟳ Checking…';
    try{
      await window.cycleTopStoriesAndRefresh();
    }catch(err){
      console.error('Top Stories cycle failed:',err);
    }finally{
      btn.dataset.topCycleBusy='';
      btn.disabled=false;
      btn.textContent='↻ Next Top Stories';
      if(typeof window.refreshPullStatsUI==='function')window.refreshPullStatsUI(false,'');
    }
  },true);
})();
</script>
