<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underreported High-Impact Brief</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 30px 20px;
        }
        .news-item {
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }
        .news-item h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
            line-height: 1.4;
        }
        .news-item p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .news-item .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        .news-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            margin-top: 10px;
        }
        .news-item a:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Underreported High-Impact Brief</h1>
            <p>Five underreported stories whose secondary effects remain largely unnoticed</p>
        </header>
        <div class="content" id="news-feed">
            <div class="loading">Loading news...</div>
        </div>
        <footer>
            Last updated: <span id="last-update">—</span>
        </footer>
    </div>

    <script>
        fetch('News')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, 'text/xml');
                
                const channel = xmlDoc.querySelector('channel');
                const items = xmlDoc.querySelectorAll('item');
                const lastBuildDate = channel.querySelector('lastBuildDate')?.textContent || 'Unknown';
                
                document.getElementById('last-update').textContent = lastBuildDate;
                
                const feedContainer = document.getElementById('news-feed');
                feedContainer.innerHTML = '';
                
                items.forEach((item, index) => {
                    const title = item.querySelector('title')?.textContent || 'No title';
                    const description = item.querySelector('description')?.textContent || 'No description';
                    const link = item.querySelector('link')?.textContent || '#';
                    const pubDate = item.querySelector('pubDate')?.textContent || 'No date';
                    
                    const newsHTML = `
                        <div class="news-item">
                            <h3>${title}</h3>
                            <p>${description}</p>
                            <div class="meta">
                                <span>${pubDate}</span>
                            </div>
                            <a href="${link}" target="_blank">Read more →</a>
                        </div>
                    `;
                    feedContainer.innerHTML += newsHTML;
                });
            })
            .catch(error => {
                document.getElementById('news-feed').innerHTML = '<p style="color: red;">Error loading news feed: ' + error + '</p>';
            });
    </script>
</body>
</html>
