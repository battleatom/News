name: V6 Clean Build

on:
  push:
    branches: [v6]
    paths:
      - 'v6/**'
      - '.github/workflows/v6-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v6-clean-build
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V6
        uses: actions/checkout@v4
        with:
          ref: v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate standalone Python
        run: python -m py_compile v6/src/*.py v6/tests/test_v6.py v6/tests/browser_smoke.py
      - name: Validate ES module syntax
        run: |
          for f in v6/web/*.js; do node --input-type=module --check < "$f"; done
      - name: Unit tests
        run: python -m unittest discover -s v6/tests -p 'test_*.py'
      - name: Verify Alpha Vantage credential
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python v6/src/markets.py --verify-alpha
      - name: Deterministic V6 build
        run: python v6/src/build.py --fixture v6/tests/fixtures/stories.json
      - name: Static architecture audit
        run: python v6/src/audit.py
      - name: Install browser test dependencies
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke test - fixture build
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory v6/dist >/tmp/v6-http.log 2>&1 &
          echo $! >/tmp/v6-http.pid
          sleep 2
          python v6/tests/browser_smoke.py
          kill $(cat /tmp/v6-http.pid) || true
      - name: Upload deterministic V6 build
        uses: actions/upload-artifact@v4
        with:
          name: v6-fixture-build
          path: v6/dist
          if-no-files-found: error
      - name: Independent live V6 collection
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python v6/src/build.py
      - name: Audit live V6 build
        run: python v6/src/audit.py
      - name: Live inventory quality gate
        run: python v6/src/live_quality.py
      - name: Browser smoke test - live build
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory v6/dist >/tmp/v6-live-http.log 2>&1 &
          echo $! >/tmp/v6-live-http.pid
          sleep 2
          python v6/tests/browser_smoke.py --require-boxoffice
          kill $(cat /tmp/v6-live-http.pid) || true
      - name: Upload live V6 build
        uses: actions/upload-artifact@v4
        with:
          name: v6-live-build
          path: v6/dist
          if-no-files-found: error
      - name: Publish exact tested build to V6 preview
        run: |
          set -euo pipefail
          rm -rf /tmp/v6-tested-dist
          mkdir -p /tmp/v6-tested-dist
          cp -a v6/dist/. /tmp/v6-tested-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan v6-preview-publish
          git rm -rf . || true
          cp -a /tmp/v6-tested-dist/. .
          git add -A
          git commit -m "Publish tested V6 preview ${GITHUB_SHA}"
          git push --force origin HEAD:v6-live-preview
