name: Contextual Why It Matters Validation

on:
  push:
    branches: [test/contextual-why-matters-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextual-why-matters-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Run editorial and category regressions
        run: |
          python tests/feed_quality_regression_test.py
          python tests/editorial_integrity_test.py
          python tests/category_relevance_smoke.py

      - name: Regenerate contextual Why It Matters on branch snapshot
        run: python scripts/update_why_matters.py

      - name: Check contextual output and legacy-template conflicts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('News').getroot()
          legacy={
            'technology':'It may affect privacy, security, access to technology, users, or how the technology is regulated and deployed.',
            'entertainment':'It may affect the artist or production involved, audiences, release plans, contracts, careers, or the wider entertainment industry.',
          }
          for cat in ('technology','gaming','entertainment'):
              items=[i for i in root.findall('.//item') if (i.findtext('category') or '').strip().lower()==cat]
              assert items, f'no {cat} items in branch snapshot'
              values=[(i.findtext('whyMatters') or '').strip() for i in items]
              assert all(v.startswith('Why it matters: ') for v in values), f'missing Why It Matters text in {cat}'
              unique=len(set(values))
              assert unique >= min(3,len(values)), f'{cat} output is still effectively a single canned template: {unique} unique'
              if cat in legacy:
                  assert not any(v.endswith(legacy[cat]) for v in values), f'legacy {cat} template survived final pass'
              print(cat, len(items), 'items', unique, 'unique Why It Matters values')
          PY

      - name: Build and audit site
        run: |
          python scripts/build_site.py
          python scripts/patch_entertainment_v4_ui.py
          python scripts/site_audit.py
          python scripts/v4_release_gate.py
