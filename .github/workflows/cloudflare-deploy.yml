name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker.js'
      - 'cloudflare-entry.js'
      - 'cloudflare-runtime.js'
      - 'cloudflare-nfl.js'
      - 'cloudflare-services.js'
      - 'cloudflare-safe.js'
      - 'pool-maintenance.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'weather.js'
      - 'location.js'
      - 'app.js'
      - 'store.js'
      - 'renderers.js'
      - 'feedback.js'
      - 'nfl-cloudflare-proxy.js'
      - 'index.html'
      - 'styles.css'
      - 'story-sanitize.js'
      - 'infinite-scroll.js'
      - 'story-position.js'
      - 'status-ux.js'
      - 'tab-ux.js'
      - 'tab-count-sync.js'
      - 'feed.json'
      - 'status.json'
      - 'nfl.json'
      - 'boxoffice.json'
      - 'markets.json'
      - 'admin-ops-cloudflare.js'
      - 'admin-layout.js'
      - 'admin-refresh.js'
      - 'admin-pool.js'
      - 'admin-runtime-files.js'
      - 'admin-export.js'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['V6 Data-Only Production Refresh']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Cloudflare assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cloudflare-assets
          mkdir -p .cloudflare-assets

          assets=(
            index.html styles.css app.js store.js renderers.js location.js feedback.js weather.js
            nfl-cloudflare-proxy.js story-sanitize.js infinite-scroll.js story-position.js status-ux.js tab-ux.js tab-count-sync.js
            admin-ops-cloudflare.js admin-layout.js admin-refresh.js admin-pool.js admin-runtime-files.js admin-export.js
            feed.json status.json nfl.json boxoffice.json markets.json
          )
          for file in "${assets[@]}"; do
            test -f "$file"
            cp "$file" ".cloudflare-assets/$file"
          done

          for file in .cloudflare-assets/*.js; do
            node --check "$file"
          done

          sed -i 's#https://bkcrgfkhgjypvzwubwrh.supabase.co/functions/v1/nfl-live#/api/nfl-live#g' .cloudflare-assets/app.js
          sed -i 's#https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard#/api/nfl-scoreboard#g' .cloudflare-assets/app.js
          sed -i 's#https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary#/api/nfl-summary#g' .cloudflare-assets/app.js

          git fetch --depth=1 origin v6
          git show FETCH_HEAD:v6/config/sources.json > .cloudflare-assets/sources.json
          git show FETCH_HEAD:v6/config/sources-extra.json > .cloudflare-assets/sources-extra.json

          jq empty .cloudflare-assets/feed.json .cloudflare-assets/status.json .cloudflare-assets/nfl.json .cloudflare-assets/boxoffice.json .cloudflare-assets/markets.json .cloudflare-assets/sources.json .cloudflare-assets/sources-extra.json
          jq -e '.sources | type=="array" and length>0' .cloudflare-assets/sources.json >/dev/null
          jq -e '.sources | type=="array" and length>0' .cloudflare-assets/sources-extra.json >/dev/null
          jq -s '[.[].sources[]?.id] | length == (unique|length)' .cloudflare-assets/sources.json .cloudflare-assets/sources-extra.json | grep -qx true

          if grep -Eqi 'supabase\.co|vercel\.app|github\.io|raw\.githubusercontent\.com|site\.api\.espn\.com' .cloudflare-assets/*.js; then
            echo 'Legacy/direct-provider reference remains in production browser bundle.' >&2
            grep -Ein 'supabase\.co|vercel\.app|github\.io|raw\.githubusercontent\.com|site\.api\.espn\.com' .cloudflare-assets/*.js || true
            exit 1
          fi
          echo "Prepared $(find .cloudflare-assets -type f | wc -l) V6 production assets"

          python - <<'PY'
          from pathlib import Path
          import re
          html=Path(".cloudflare-assets/index.html").read_text()
          refs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              path=src.split("?",1)[0]
              if path.startswith(("http://","https://","//")):
                  continue
              refs.append(path.lstrip("/"))
          missing=[p for p in refs if not Path(".cloudflare-assets",p).is_file()]
          if missing:
              raise SystemExit("Missing deployed scripts referenced by index.html: "+", ".join(missing))
          print("Index script asset audit OK:", ", ".join(refs))
          PY

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Production V6 smoke audit
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://news.luckynumbers7ven.workers.dev'
          sleep 5
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1" body="$2" headers="$3"
            local code
            code=$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors -D "$headers" -o "$body" -w '%{http_code}' "$SITE$path")
            if [ "$code" != '200' ]; then
              echo "FAIL $path HTTP $code" >&2
              cat "$body" >&2 || true
              return 1
            fi
            test -s "$body"
          }

          scripts=(
            app.js store.js renderers.js location.js feedback.js weather.js nfl-cloudflare-proxy.js
            story-sanitize.js infinite-scroll.js story-position.js status-ux.js tab-ux.js tab-count-sync.js
            admin-ops-cloudflare.js admin-layout.js admin-refresh.js admin-pool.js admin-runtime-files.js admin-export.js
          )
          for file in "${scripts[@]}"; do
            fetch "/$file?smoke=$GITHUB_SHA" "$tmp/$file" "$tmp/$file.h"
            if head -c 200 "$tmp/$file" | grep -Eqi '<!doctype html|<html'; then
              echo "FAIL $file returned HTML" >&2; exit 1
            fi
            if grep -Eqi 'supabase\.co|vercel\.app|github\.io|raw\.githubusercontent\.com|site\.api\.espn\.com' "$tmp/$file"; then
              echo "FAIL $file contains legacy/direct-provider reference" >&2; exit 1
            fi
            echo "OK script $file"
          done

          jsons=(feed.json status.json nfl.json markets.json boxoffice.json sources.json sources-extra.json)
          for file in "${jsons[@]}"; do
            fetch "/$file?smoke=$GITHUB_SHA" "$tmp/$file" "$tmp/$file.h"
            jq empty "$tmp/$file"
            if grep -qi '^X-Underreported-Fallback: 1' "$tmp/$file.h"; then
              echo "FAIL $file is using bundled fallback" >&2; exit 1
            fi
            echo "OK json $file"
          done

          for file in feed.json status.json nfl.json markets.json boxoffice.json; do
            jq -e '.cloudflareRuntime == true' "$tmp/$file" >/dev/null || { echo "FAIL $file is not Cloudflare runtime" >&2; exit 1; }
          done
          jq -e '.sources | type=="array" and length>0' "$tmp/sources.json" >/dev/null
          jq -e '.sources | type=="array" and length>0' "$tmp/sources-extra.json" >/dev/null
          jq -s -e '[.[].sources[]?.id] | length == (unique|length)' "$tmp/sources.json" "$tmp/sources-extra.json" >/dev/null

          jq -e '.stories.x | type=="array" and length==10' "$tmp/feed.json" >/dev/null || { echo "FAIL X visible inventory is not 10" >&2; exit 1; }
          jq -e '[.stories.x[].source_id] | unique | length==10' "$tmp/feed.json" >/dev/null || { echo "FAIL X visible inventory does not contain 10 unique topic slots" >&2; exit 1; }
          jq -e '.movies | type=="array" and length>0' "$tmp/boxoffice.json" >/dev/null || { echo "FAIL Box Office inventory empty" >&2; exit 1; }
          jq -e '[.movies[] | (.tmdbId // (.title|ascii_downcase))] | length == (unique|length)' "$tmp/boxoffice.json" >/dev/null || { echo "FAIL Box Office contains duplicate movies" >&2; exit 1; }

          jq -e '([(.collectorErrors // [])[] | select(.source=="cloudflare-cron")] | length) == 0' "$tmp/status.json" >/dev/null
          jq -e '([(.sourceStatuses // [])[] | select((.status=="error") and ((.consecutiveFailures // 0) >= 3) and ((.storyCount // 0) <= 0))] | length) == 0' "$tmp/status.json" >/dev/null
          jq -e '(.sourceCount // 0) > 0 and ((.sourceStatuses // []) | length) > 0' "$tmp/status.json" >/dev/null

          fetch '/healthz' "$tmp/health.json" "$tmp/health.h"
          jq -e '.runtime == "cloudflare" and .ok == true and (.ageMinutes == null or .ageMinutes <= 90)' "$tmp/health.json" >/dev/null

          fetch '/api/feedback' "$tmp/feedback.json" "$tmp/feedback.h"
          jq -e '.ok == true and (.pools|type)=="object"' "$tmp/feedback.json" >/dev/null

          fetch '/api/weather?lat=36.7281&lon=-108.2187' "$tmp/weather.json" "$tmp/weather.h"
          jq -e '.current != null and .daily != null' "$tmp/weather.json" >/dev/null

          fetch '/api/nfl-scoreboard?limit=64' "$tmp/nfl-scoreboard.json" "$tmp/nfl-scoreboard.h"
          jq -e '.events | type=="array"' "$tmp/nfl-scoreboard.json" >/dev/null

          code=$(curl -sS -o "$tmp/nfl-live.json" -w '%{http_code}' "$SITE/api/nfl-live?gameID=invalid")
          test "$code" = '400'
          jq -e '.ok == false and .error == "invalid gameID"' "$tmp/nfl-live.json" >/dev/null

          code=$(curl -sS -o "$tmp/nfl-summary.json" -w '%{http_code}' "$SITE/api/nfl-summary")
          test "$code" = '400'
          jq -e '.error == "missing event"' "$tmp/nfl-summary.json" >/dev/null

          echo 'PRODUCTION V6 SMOKE AUDIT: PASS'
