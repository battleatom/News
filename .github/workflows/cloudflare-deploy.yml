name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker.js'
      - 'cloudflare-entry.js'
      - 'cloudflare-runtime.js'
      - 'cloudflare-nfl.js'
      - 'cloudflare-services.js'
      - 'pool-maintenance.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.assetsignore'
      - 'weather.js'
      - 'location.js'
      - 'app.js'
      - 'store.js'
      - 'feedback.js'
      - 'nfl-cloudflare-proxy.js'
      - 'index.html'
      - 'styles.css'
      - 'pool-status.js'
      - 'story-sanitize.js'
      - 'feed.json'
      - 'status.json'
      - 'nfl.json'
      - 'boxoffice.json'
      - 'markets.json'
      - 'admin-ops.js'
      - 'admin-cloudflare.js'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Cloudflare assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cloudflare-assets
          mkdir -p .cloudflare-assets
          while IFS= read -r file; do
            case "$file" in
              .*|News|V5-MIGRATION-LOG.md|cloudflare-worker.js|cloudflare-entry.js|cloudflare-runtime.js|cloudflare-nfl.js|cloudflare-services.js|pool-maintenance.js|wrangler.jsonc|package.json|package-lock.json|*.py)
                continue
                ;;
            esac
            cp "$file" ".cloudflare-assets/$file"
          done < <(git ls-files | awk 'index($0,"/")==0')

          # Production bundle uses the Cloudflare same-origin NFL endpoint even
          # though the historical source file still contains the retired URL.
          sed -i 's#https://bkcrgfkhgjypvzwubwrh.supabase.co/functions/v1/nfl-live#/api/nfl-live#g' .cloudflare-assets/app.js

          # Bundle source registries into Cloudflare. Production runtime never
          # contacts GitHub, Vercel, or Supabase for registry data.
          git fetch --depth=1 origin v6
          git show FETCH_HEAD:v6/config/sources.json > .cloudflare-assets/sources.json
          git show FETCH_HEAD:v6/config/sources-extra.json > .cloudflare-assets/sources-extra.json

          test -f .cloudflare-assets/index.html
          test -f .cloudflare-assets/app.js
          test -f .cloudflare-assets/nfl-cloudflare-proxy.js
          test -f .cloudflare-assets/feed.json
          test -s .cloudflare-assets/sources.json
          test -s .cloudflare-assets/sources-extra.json
          if grep -q 'supabase.co' .cloudflare-assets/app.js; then
            echo 'Supabase reference remains in production app bundle.' >&2
            exit 1
          fi
          echo "Prepared $(find .cloudflare-assets -type f | wc -l) production assets"

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
