name: Apply Related Coverage UI

on:
  workflow_run:
    workflows: ["Update News Feed"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: related-coverage-ui
  cancel-in-progress: true

jobs:
  apply-related-ui:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply related coverage UI
        run: python scripts/patch_related_ui.py

      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Related coverage UI is already current."
            exit 0
          fi
          git commit -m "Add similar coverage links"
          git push origin HEAD:main
