name: Cross Tab Integrity Test

on:
  push:
    branches: [test/cross-tab-integrity-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile integrity pass
        run: python -m py_compile scripts/cross_tab_integrity.py
      - name: Audit current feed without mutation
        run: python scripts/cross_tab_integrity.py --report /tmp/cross-tab-dry.json
      - name: Apply to isolated feed copy
        run: |
          cp News /tmp/News.test
          python scripts/cross_tab_integrity.py --feed /tmp/News.test --report /tmp/cross-tab-apply.json --apply
      - name: Recheck isolated result
        run: python scripts/cross_tab_integrity.py --feed /tmp/News.test --report /tmp/cross-tab-recheck.json
      - name: Cross-reference category preservation
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from collections import Counter
          def counts(path):
              return Counter((i.findtext('category') or '').strip().lower() for i in ET.parse(path).getroot().findall('./channel/item'))
          before, after = counts('News'), counts('/tmp/News.test')
          report=json.load(open('/tmp/cross-tab-apply.json',encoding='utf-8'))
          print('Detected pairs:', report['crossTabPairsDetected'])
          print('Removed:', report['crossTabDuplicatesRemoved'])
          print('Category drops:', report['categoryDrops'])
          for cat,n in before.items():
              if n >= 10 and after[cat] < max(8, int(n*.75)):
                  raise SystemExit(f'{cat} over-pruned: {n} -> {after[cat]}')
          if report['residualStrongCrossTabPairs']:
              raise SystemExit('Residual strong cross-tab duplicates remain')
          print('Cross-reference passed; category pools preserved.')
          PY
