name: US Sports Leakage V2 Test

on:
  push:
    branches: [fix/us-sports-leakage-v2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Run editorial integrity regression
        run: python tests/editorial_integrity_test.py
      - name: Apply final editorial integrity to current feed
        run: python scripts/enforce_editorial_integrity.py
      - name: Verify no sports leakage remains in United States
        run: python tests/us_sports_feed_check.py
