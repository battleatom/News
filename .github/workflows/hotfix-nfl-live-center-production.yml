name: NFL Live Center Production Hotfix

on:
  push:
    branches: [hotfix/nfl-live-center-production]
    paths:
      - '.github/workflows/hotfix-nfl-live-center-production.yml'

permissions:
  contents: write

jobs:
  deploy-index-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source syntax
        run: python -m py_compile scripts/patch_nfl_live_center.py scripts/build_site.py

      - name: Rebuild current production page only
        run: python scripts/build_site.py

      - name: Verify NFL Live Center is in generated production page
        run: |
          grep -q 'nfl-live-center-v1' index.html
          grep -q 'renderLivePlayCenter' index.html
          grep -q "liveCenter.className='nfl-live-center'" index.html
          echo 'NFL Live Center production markers verified.'

      - name: Run generated-site audit
        run: python scripts/site_audit.py

      - name: Isolate index-only artifact
        run: |
          cp index.html /tmp/index-hotfix.html
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/index-hotfix.html index.html
          git diff --check -- index.html
          git diff --quiet -- News || { echo 'News data changed unexpectedly'; exit 1; }

      - name: Publish only production index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production index already contains the NFL Live Center.'
            exit 0
          fi
          git commit -m 'Hotfix production NFL live center'
          git push origin HEAD:main
