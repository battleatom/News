name: Overnight Fix Validation

on:
  push:
    branches: [fix/overnight-regressions-2026-09-11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-fix-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile scripts/dedupe_news_legacy.py scripts/dedupe_news_stories.py tests/event_cluster_dedupe_test.py

      - name: Run event and regional dedupe regression tests
        run: python tests/event_cluster_dedupe_test.py

      - name: Audit current feed and generated site
        run: python scripts/site_audit.py

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local branch site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-http.log 2>&1 &
          echo $! > /tmp/news-http.pid
          sleep 2

      - name: Test V3 news UI and responsive behavior
        run: python tests/site_smoke_v26.py

      - name: Test mobile fetch status and live countdown
        run: python tests/mobile_status_smoke.py

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/news-http.log || true
