name: Validate NFL Icons and Team Accent
on:
  push:
    branches: [fix/nfl-icons-team-accent-2026-09-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/patch_nfl_live.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Audit generated site
        run: python scripts/site_audit.py
      - name: Validate NFL visual contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'logos rendered':'nfl-logo-pair' in s and 'team?.logo' in s,
            'home team accent':'--nfl-home-accent' in s and 'alternateColor' in s,
            'light color fallback':'pickTeamAccent' in s,
            'compact matchup line':'nfl-matchup-line' in s and ' at ' in s,
            'watch/time line':'nfl-game-subline' in s,
            'two-column mobile grid':'grid-template-columns:repeat(2,minmax(0,1fr))' in s,
          }
          for name,ok in checks.items(): print(name, 'PASS' if ok else 'FAIL')
          assert all(checks.values()), checks
          PY
# Temporary branch-only validation workflow; remove before merge.
