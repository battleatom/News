name: City Only Location Test

on:
  push:
    branches: [fix/remove-county-location-scope]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Apply location build patch
        run: python scripts/patch_v25_location_content.py
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/news-http.log 2>&1 &
          sleep 2
      - name: Run V4 browser smoke
        run: python tests/site_smoke_v32.py
