name: Update Market Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_markets.py'
      - '.github/workflows/update-markets.yml'

permissions:
  contents: write

jobs:
  update-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        run: python scripts/update_markets.py

      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json
          if git diff --cached --quiet; then
            echo "Market data is already current."
          else
            git commit -m "Auto-update market data"
            git push
          fi
