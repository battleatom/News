name: V6 Production Refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v6-production-refresh
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V6 source
        uses: actions/checkout@v4
        with:
          ref: v6
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate V6 source
        run: |
          python -m py_compile v6/src/*.py v6/tests/test_v6.py
          for f in v6/web/*.js; do node --input-type=module --check < "$f"; done
          python -m unittest discover -s v6/tests -p 'test_*.py'

      - name: Build live V6
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python v6/src/build.py

      - name: Audit live V6
        run: |
          python v6/src/audit.py
          python v6/src/live_quality.py

      - name: Preserve validated runtime
        run: |
          rm -rf /tmp/v6-production-dist
          mkdir -p /tmp/v6-production-dist
          cp -a v6/dist/. /tmp/v6-production-dist/

      - name: Publish V6 runtime to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          for file in index.html styles.css app.js store.js renderers.js location.js feedback.js feed.json nfl.json boxoffice.json markets.json status.json; do
            cp "/tmp/v6-production-dist/$file" "$file"
          done
          git add index.html styles.css app.js store.js renderers.js location.js feedback.js feed.json nfl.json boxoffice.json markets.json status.json
          if git diff --cached --quiet; then
            echo "V6 production is already current."
            exit 0
          fi
          git commit -m "V6 production refresh"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "V6 production publish succeeded."
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent production change conflicted; refusing to resolve silently."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          exit 1
