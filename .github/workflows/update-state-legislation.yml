name: Update State Legislation

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-state-legislation
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Refresh state legislation cache
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python scripts/update_state_legislation.py
      - name: Commit state cache
        run: |
          if [ ! -f state-legislation.json ]; then
            echo 'No state cache generated; LEGISCAN_API_KEY may not be configured.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state-legislation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update state legislation cache'
          git push origin main
