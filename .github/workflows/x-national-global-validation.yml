name: Validate X National Global Scope
on:
  push:
    branches: [fix/x-national-global-scope-2026-09-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: X candidate-scope regression
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import format_datetime
          sys.path.insert(0, 'scripts')
          import enrich_x_issues as x

          def item(cat, title, desc):
              node=ET.Element('item')
              ET.SubElement(node,'category').text=cat
              ET.SubElement(node,'title').text=title
              ET.SubElement(node,'description').text=desc
              ET.SubElement(node,'link').text='https://example.com/'+cat
              ET.SubElement(node,'source').text='Example'
              ET.SubElement(node,'pubDate').text=format_datetime(datetime.now(timezone.utc))
              return node

          nm=item('nm','New Mexico government politics update','White House Congress government politics Supreme Court New Mexico')
          local=item('local','Farmington government politics update','White House Congress government politics Supreme Court Farmington')
          region=item('region','Southwest government politics update','White House Congress government politics Supreme Court Southwest')
          national=item('us','Congress and White House government politics update','White House Congress government politics Supreme Court national')
          rows=x.existing_candidates([nm,local,region,national],'White House Congress Supreme Court politics government')
          titles=[row[1]['title'] for row in rows]
          assert any('Congress and White House' in t for t in titles), titles
          assert not any('New Mexico' in t or 'Farmington' in t or 'Southwest' in t for t in titles), titles
          print('X national/global candidate-scope regression PASS')
          PY
      - name: Rebuild X topics from current feed
        run: python scripts/enrich_x_issues.py
      - name: Verify fixed X topics
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          expected=['Health','Technology & AI','Celebrities & Public Figures','World','Politics & Government','Entertainment','Sports','Business & Economy','Gaming','Science']
          items=ET.parse('News').getroot().findall('.//item')
          topics=[(i.findtext('xTopic') or '').strip() for i in items if (i.findtext('category') or '').strip()=='x']
          assert topics==expected, topics
          print('X fixed-topic validation PASS')
          PY
      - name: Build site
        run: python scripts/build_site.py
      - name: Site audit
        run: python scripts/site_audit.py
# Temporary branch-only validation workflow; remove before merge.
