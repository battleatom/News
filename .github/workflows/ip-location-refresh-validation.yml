name: IP Location Refresh Validation

on:
  push:
    branches: [fix/ip-location-refresh-cadence]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/patch_auto_refresh_timer.py
      - name: Validate IP persistence policy
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/location-v2.js').read_text()
          assert "let current=null" in s
          assert "v.source!=='ip'" in s
          assert "if(out.source==='ip')" in s
          assert "localStorage.removeItem(CACHE_KEY)" in s
          assert "source:'ip'" in s
          print('IP location is session-only and ignored as durable cache.')
          PY
      - name: Build canonical V5
        run: bash -e v5-apply.sh
      - name: Validate 15-minute pairing
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'const INTERVAL=15*60*1000' in s
          assert 'refreshApproximateLocation' in s
          assert "loc.source==='ip'" in s
          assert "svc.get({force:true})" in s
          assert 'await refreshApproximateLocation();' in s
          print('IP refresh is paired to the 15-minute news updater.')
          PY
      - name: Run release gates
        run: |
          python scripts/site_audit.py
          python scripts/v5_runtime_audit.py
          python scripts/v5_release_gate.py
