name: Test Card Feedback Text Gutter
on:
  push:
    branches: [fix/card-feedback-text-gutter]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: python scripts/build_site.py
      - name: Validate feedback gutter
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/card-feedback.css').read_text()
          html=Path('index.html').read_text()
          required=['--feedback-safe-gutter:112px','.x-issue-meta','.underreported-topline','.leg-top','.ent-card-flags','--feedback-safe-gutter:106px']
          for token in required:
              assert token in css, token
          assert 'card-feedback.css?v=' in html
          assert 'card-feedback.js?v=' in html
          assert 'x-issue-meta' in html
          assert 'TOP X CONVERSATION' in html
          print('CARD FEEDBACK GUTTER TEST PASS')
          PY
