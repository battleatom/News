name: AI Classifier Live Test

on:
  push:
    branches: [ai-classifier-live-test]
    paths-ignore:
      - 'News'
      - 'News.classified-preview'
      - 'classifier-report.json'
  workflow_dispatch:

concurrency:
  group: ai-classifier-live-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  classify-live-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ai-classifier-live-test
          fetch-depth: 0

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_news.py scripts/classify_live_feed.py

      - name: Pull current live news feed
        run: |
          echo 'Fetching live Google News RSS through the existing collector...'
          python scripts/update_news.py

      - name: Run source/category classifier in shadow mode
        run: python scripts/classify_live_feed.py

      - name: Print classifier summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('classifier-report.json').read_text(encoding='utf-8'))
          print('Total:', data['totalArticles'])
          print('Summary:', data['summary'])
          print('Reroutes:', data['reroutes'])
          print('\nHighest-confidence reroutes/rejections:')
          rows=[d for d in data['decisions'] if d['action'] in ('reroute','reject')]
          rows.sort(key=lambda d:d['confidence'], reverse=True)
          for d in rows[:30]:
              print(f"{d['action']:7} {d['confidence']:.3f} {d['current']} -> {d.get('category')} | {d['source']} | {d['title'][:120]}")
          PY

      - name: Verify production feed was not mutated by classifier
        run: |
          test -s News
          test -s News.classified-preview
          test -s classifier-report.json
          grep -q 'shadow-live-test' classifier-report.json

      - name: Upload live-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-classifier-live-test
          path: |
            classifier-report.json
            News.classified-preview
          retention-days: 14

      - name: Save latest test report on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add classifier-report.json News.classified-preview
          if git diff --cached --quiet; then
            echo 'No classifier report changes.'
            exit 0
          fi
          git commit -m 'Update AI classifier live test report'
          git push origin ai-classifier-live-test
