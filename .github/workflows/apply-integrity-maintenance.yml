name: Apply Integrity Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-integrity-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Patch main workflow
        run: python scripts/patch_workflow_integrity.py
      - name: Remove dead collector and bytecode
        run: |
          rm -f scripts/collect_official_legislation.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit maintenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/update-news.yml scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply site integrity maintenance'
          git push origin main
