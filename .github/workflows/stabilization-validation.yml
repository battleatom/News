name: Stabilization Validation

on:
  push:
    branches: [stabilize-production-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilization-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-production-pipeline
          fetch-depth: 0

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Run verification regression tests
        run: python tests/verify_feed_test.py

      - name: Run collector preflight
        run: python scripts/preflight_feed.py

      - name: Pull live news feed
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Live collection attempt ${attempt}/3"
            if python scripts/update_news.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Live collection failed after three attempts"
            exit 1
          fi

      - name: Run enrichment chain
        run: |
          python scripts/refine_tech_gaming.py
          python scripts/collect_official_legislation_v2.py
          python scripts/enrich_world_content.py
          python scripts/enrich_underreported.py
          python scripts/enrich_legislation.py
          python scripts/enrich_x_issues.py
          python scripts/enrich_box_office.py
          python scripts/patch_boxoffice_location.py
          python scripts/clean_news.py
          python scripts/filter_landing_pages.py

      - name: Run unified source/category/event verification
        run: python scripts/verify_feed.py --apply

      - name: Show verification summary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('verification-report.json',encoding='utf-8'))
          print('INPUT', r['inputArticles'])
          print('OUTPUT', r['outputArticles'])
          print('REJECTED SOURCES', r['rejectedSources'])
          print('EVENT DUPLICATES REMOVED', r['removedEventDuplicates'])
          print('CLASSIFIER ACTIONS', r['classifierActions'])
          for c in r['clusters'][:30]:
              print('CLUSTER', c['category'], c['size'], 'KEEP:', c['kept'])
          PY

      - name: Install content brief dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7

      - name: Build content briefs and site
        run: |
          python scripts/create_content_briefs.py
          python scripts/build_site.py
          python scripts/site_audit.py

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local branch site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-http.log 2>&1 &
          echo $! > /tmp/news-http.pid
          sleep 2

      - name: Run browser regression tests
        run: |
          python tests/site_smoke_v26.py
          python tests/mobile_status_smoke.py

      - name: Final syntax and integrity check
        run: |
          python -m py_compile scripts/*.py tests/*.py
          python scripts/site_audit.py

      - name: Upload branch verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-live-build
          path: |
            News
            index.html
            verification-report.json
            classifier-report.json
            boxoffice.json
            content-brief-cache.json
          retention-days: 14

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/news-http.log || true
