name: Validate Exact-Link Dedupe Fix
on:
  push:
    branches: [fix/exact-link-dedupe-2026-09-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: Exact-link regression
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          sys.path.insert(0, 'scripts')
          import verify_feed as vf
          def item(cat, title, link):
              x=ET.Element('item')
              ET.SubElement(x,'category').text=cat
              ET.SubElement(x,'title').text=title
              ET.SubElement(x,'link').text=link
              ET.SubElement(x,'description').text='Different wording should not matter for an identical URL.'
              ET.SubElement(x,'source').text='Source New Mexico'
              return x
          a=item('nm','New Mexico remembers 9/11 - Source New Mexico','https://example.com/story')
          b=item('nm','A differently formatted duplicate title','https://example.com/story')
          c=item('world','Same URL, different category','https://example.com/story')
          assert vf.same_event(a,b), 'same-category exact URL must collapse'
          assert not vf.same_event(a,c), 'cross-category exact URL policy must remain unchanged'
          print('Exact-link duplicate regression PASS')
          PY
      - name: Build site
        run: python scripts/build_site.py
      - name: Audit current generated site
        run: python scripts/site_audit.py
# Temporary branch-only validation workflow; remove before merge.
