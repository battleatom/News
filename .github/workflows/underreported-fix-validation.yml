name: Underreported Fix Validation

on:
  push:
    branches: [fix/underreported-ranking-2026-09-11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: underreported-fix-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile scripts/underreported_priority.py scripts/patch_underreported_ui.py tests/underreported_priority_test.py tests/underreported_ui_smoke.py

      - name: Run Underreported ranking regression tests
        run: python tests/underreported_priority_test.py

      - name: Apply ranking to CI feed copy and build site
        run: |
          cp News /tmp/News.original
          python scripts/underreported_priority.py --rank
          python scripts/build_site.py
          python scripts/site_audit.py

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local branch site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-http.log 2>&1 &
          echo $! > /tmp/news-http.pid
          sleep 2

      - name: Test Underreported age colors and leakage guard
        run: python tests/underreported_ui_smoke.py

      - name: Run normal V3 responsive smoke test
        run: python tests/site_smoke_v26.py

      - name: Restore feed copy
        if: always()
        run: mv /tmp/News.original News || true

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/news-http.log || true
