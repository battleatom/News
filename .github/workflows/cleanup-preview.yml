name: Underreported 2.0 Preview Validation

on:
  push:
    branches: [underreported-2.0-cleanup, v2.1-mobile-cleanup, v2.2-new-status-audio, v2.3-new-badges-audio, v2.5-location-government-header, v2.6-presidential-state-newbadges, refinement-v2.7-test]
    paths-ignore:
      - 'News'
      - 'index.html'
      - 'scripts/update_news.py'
      - 'refresh-health.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: underreported-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply production collector refinement chain
        run: |
          python scripts/preflight_feed.py
          python scripts/patch_news_selector.py
          python scripts/patch_top_diversity.py
          python scripts/patch_event_dedupe.py
          python scripts/patch_dedupe_scope.py
          python scripts/patch_public_interest_legislation.py
          python scripts/patch_public_interest_quality.py
          python scripts/patch_category_quality.py
          python scripts/patch_collector_hygiene.py
          python scripts/patch_region_state_tags.py
          python scripts/patch_presidential_us_only.py

      - name: Generate branch-only preview feed
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Preview RSS update attempt ${attempt}/3"
            if python scripts/update_news.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo 'Preview feed generation failed after three attempts.'
            exit 1
          fi
          python scripts/refine_tech_gaming.py
          python scripts/clean_news.py
          python scripts/dedupe_news_stories.py

      - name: Build V2 page in canonical order
        run: python scripts/build_site.py

      - name: Audit generated site
        run: python scripts/site_audit.py

      - name: Validate Python syntax and V2.7 refinement invariants
        run: |
          python -m py_compile scripts/*.py tests/*.py
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          collector=Path('scripts/update_news.py').read_text(encoding='utf-8')
          workflow=Path('.github/workflows/update-news.yml').read_text(encoding='utf-8')
          stats=Path('scripts/record_pull_stats.py').read_text(encoding='utf-8')
          location_js=Path('assets/location-content-v25.js').read_text(encoding='utf-8')
          location_core=Path('assets/location-v2.js').read_text(encoding='utf-8')
          required=(
              'data-underreported-version="2"',
              'styles/v2.css?v=5',
              'assets/location-v2.js?v=2',
              'assets/app-v2.js?v=3',
              'assets/location-content-v25.js?v=2',
              'auto-refresh-timer-v1',
              'bookmarks-v1',
              'related-coverage-v1',
              'alerts-status-v22',
              'alerts-new-v23',
              'new-badge-v26-style',
              '__alertsNewV26',
              'refresh-success-handling-v2',
              'Display refresh failed · retry scheduled',
          )
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing V2.7 generated markers: '+', '.join(missing))
          for marker in ('__locationContentV26','mergedStatePool','removeMergedTabs','__presidentialRelevantV26','FOUR_CORNERS_LOCAL_TERMS'):
              if marker not in location_js:
                  raise SystemExit('Missing V2.7 location controller marker: '+marker)
          if "if(rank(local,loc).length<6)local=local.concat(stateSpecific)" in location_js:
              raise SystemExit('State stories can still be relabeled Local to fill a quota')
          if "category(item)==='local')return true" in location_js:
              raise SystemExit('Local category still bypasses geographic matching')
          for legacy_key in ("localStorage.removeItem('underreported-location')","localStorage.removeItem('underreported-state')"):
              if legacy_key not in location_core:
                  raise SystemExit('Location clear does not remove '+legacy_key)
          if 'VISIBLE_SOURCE_CAP = 2' not in collector or 'coverage_boost' not in collector or 'Build event clusters before scoring' not in collector:
              raise SystemExit('Event-first Top ranking or visible publisher diversity is missing')
          forbidden=(
              'setInterval(decorate,1500)',
              'setInterval(()=>{ensureBookmarkTab();},1000)',
              'setInterval(tick,1000)',
              'setInterval(ensureVisibleUI,500)',
              'setInterval(renderStats,1000)',
              'new-badge-expiry-v1',
              'if(test)synthPop()',
          )
          found=[x for x in forbidden if x in html]
          if found:
              raise SystemExit('Legacy generated behavior remains: '+', '.join(found))
          if 'item["state"] = region_query_state(region_query)' not in collector or '<state>' not in collector:
              raise SystemExit('Regional state tagging is not installed in collector')
          if 'is_us_presidential_story' not in collector or 'category == "presidential" and not is_us_presidential_story' not in collector:
              raise SystemExit('Strict U.S. Presidential filter is not installed')
          if 'firstSeenAt' not in stats:
              raise SystemExit('Persistent first-seen NEW timing is not installed')
          if "- 'markets.json'" not in workflow:
              raise SystemExit('Market data is not ignored by news push trigger')
          for required_step in ('python scripts/patch_region_state_tags.py','python scripts/patch_presidential_us_only.py'):
              if required_step not in workflow:
                  raise SystemExit('Production workflow missing '+required_step)
          if 'git merge --no-edit -X ours origin/main' in workflow:
              raise SystemExit('Unsafe automatic ours-merge remains in production workflow')
          for marker in ('sound-alerts-toggle','Next in','duplicates removed','__queueNewArticlePopV23','__markNewArticleLinksV23','__classifyNewBadgeV26'):
              if marker not in html:
                  raise SystemExit('Missing alert/status marker: '+marker)
          if '<script id="pull-stats-ui-v1">' in html:
              raise SystemExit('Legacy status controller still present alongside V2.2/V2.6')
          print('V2.7 refinement static invariants pass.')
          PY

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local preview
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-preview-http.log 2>&1 &
          echo $! > /tmp/news-preview-http.pid
          sleep 2

      - name: Verify V2.7 refinement behavior
        run: python tests/site_smoke_v26.py

      - name: Diagnose alert-enable audio path
        run: python tests/audio_debug.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/news-preview-http.log || true

      - name: Commit validated generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add News index.html scripts/update_news.py
          if git diff --cached --quiet; then
            echo 'Generated preview is already current.'
            exit 0
          fi
          git commit -m 'Build validated V2.7 refinement preview [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
