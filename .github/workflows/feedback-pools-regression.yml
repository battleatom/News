name: Feedback Pools Regression

on:
  pull_request:
    paths:
      - 'assets/card-feedback.js'
      - 'scripts/apply_feedback_pools.py'
      - '.github/workflows/apply-feedback-pools.yml'
      - '.github/workflows/feedback-pools-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check assets/card-feedback.js
          python -m py_compile scripts/apply_feedback_pools.py

      - name: Verify browser uses persistent pools
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/card-feedback.js').read_text(encoding='utf-8')
          required=[
            "supabase.co/functions/v1/news-feedback",
            "method:'POST'",
            "method:'GET'",
            "dataset.cardFeedback='persistent'",
            "tabFor(card)==='boxoffice'",
            "activeTab()==='boxoffice'",
            "key==='boxoffice'",
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing persistent feedback markers: '+repr(missing))
          if 'localStorage' in s: raise SystemExit('Feedback source of truth must not use browser localStorage')
          print('Browser persistent feedback contract passed.')
          PY

      - name: Verify pool matching semantics
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/apply_feedback_pools.py')
          spec=importlib.util.spec_from_file_location('feedback',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          item={'title_key':'same story','url_key':'https://example.com/a','source_key':'source','category':'technology'}
          d={'title':'Same Story','url':'https://example.com/a?utm_source=x','source':'Source','category':'world'}
          nr={'title':'Same Story','url':'https://example.com/a','source':'Source','category':'world'}
          assert m.same_article(item,d,require_category=False)
          assert not m.same_article(item,nr,require_category=True)
          nr['category']='technology'
          assert m.same_article(item,nr,require_category=True)
          print('Pool matching semantics passed.')
          PY

      - name: Verify remote pool endpoint contract
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://bkcrgfkhgjypvzwubwrh.supabase.co/functions/v1/news-feedback'
          with urllib.request.urlopen(url,timeout=15) as r:
              assert r.status==200
              data=json.load(r)
          assert set(data.get('pools',{}))=={'D','NR','NW'}
          assert set(data.get('counts',{}))=={'D','NR','NW'}
          print('Remote pool endpoint contract passed:',data['counts'])
          PY
