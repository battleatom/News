name: Age Legend All Tabs Test

on:
  push:
    branches: [v5.1-age-legend-all-tabs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/v3-ui.js
      - name: Verify age legend contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/v3-ui.js').read_text(encoding='utf-8')
          for token in [
              "if(age<=2)return 'blue'",
              "if(age<=4)return 'green'",
              "if(age<=7)return 'orange'",
              "if(age<=10)return 'purple'",
              "return 'red'",
              "0–2 days",
              "2–4 days",
              "4–7 days",
              "7–10 days",
              "10–14 days",
              "legendExcluded=new Set(['nfl','boxoffice'])",
              "bookmarksVisible()",
              "card.dataset.railMeaning='age'",
          ]:
              assert token in s, f'missing age legend contract token: {token}'
          assert "if(current==='underreported')" not in s, 'legend still special-cased to Underreported only'
          print('Age legend contract passed.')
          PY
