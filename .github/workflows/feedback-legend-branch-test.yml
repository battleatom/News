name: Feedback Legend Branch Test

on:
  push:
    branches: [v5.1-feedback-legend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check assets/v3-ui.js

      - name: Verify feedback legend contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/v3-ui.js').read_text(encoding='utf-8')
          for token in [
              "const legendExcluded=new Set(['nfl','boxoffice'])",
              "bookmarksVisible()",
              "D</b>Duplicate",
              "NR</b>Not Relevant",
              "NW</b>Not Wanted",
              "current==='underreported'",
              "className='feedback-legend'",
              "className='underreported-age-key'",
          ]:
              assert token in s, f'missing legend contract token: {token}'
          assert 'installUnderreportedLegend' not in s, 'old underreported-only legend path remains'
          print('Feedback legend contract passed.')
          PY
