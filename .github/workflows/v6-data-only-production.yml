name: V6 Data-Only Production Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.force-v6-data-refresh'
      - '.force-v6-data-refresh-*'
  schedule:
    # Keep the proven V6 Python collector off the top of the hour.
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: write

concurrency:
  group: v6-data-publish
  cancel-in-progress: true

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V6 source
        uses: actions/checkout@v4
        with:
          ref: v6
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture last validated Box Office data
        run: |
          git show origin/main:boxoffice.json > /tmp/previous-boxoffice.json 2>/dev/null || echo '{"movies":[]}' > /tmp/previous-boxoffice.json

      - name: Validate V6 collector source
        run: |
          python -m py_compile v6/src/*.py v6/tests/test_v6.py
          python -m unittest discover -s v6/tests -p 'test_*.py'
          jq -e '.sources | type=="array" and length>0' v6/config/sources.json >/dev/null
          jq -e '.sources | type=="array" and length>0' v6/config/sources-extra.json >/dev/null
          jq -s -e '[.[].sources[].id] | length == (unique|length)' v6/config/sources.json v6/config/sources-extra.json >/dev/null
          jq -s -e '[.[].sources[] | select(.category=="x") | .id] | sort == ["x-business","x-celebrities","x-entertainment","x-gaming","x-health","x-politics","x-science","x-sports","x-technology","x-world"]' v6/config/sources.json v6/config/sources-extra.json >/dev/null

      - name: Build dynamic data only
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python v6/src/build.py --data-only

      - name: Recover upcoming movies on release-source outage
        run: |
          python - <<'PY'
          import json,re
          from datetime import date
          from pathlib import Path
          new_path=Path("v6/dist/boxoffice.json")
          prev_path=Path("/tmp/previous-boxoffice.json")
          new=json.loads(new_path.read_text())
          prev=json.loads(prev_path.read_text()) if prev_path.exists() else {"movies":[]}
          if "releases-" in str(new.get("error") or ""):
              today=date.today().isoformat()
              current=list(new.get("movies") or [])
              prior=[
                  m for m in (prev.get("movies") or [])
                  if str(m.get("status") or "").lower()=="upcoming"
                  and str(m.get("releaseDate") or "") >= today
              ]
              def key(m):
                  tid=str(m.get("tmdbId") or "").strip()
                  if tid:return "tmdb:"+tid
                  title=re.sub(r"[^a-z0-9]+"," ",str(m.get("title") or "").lower()).strip()
                  return "title:"+title
              merged={}
              for m in prior: merged[key(m)]=m
              for m in current: merged[key(m)]=m
              new["movies"]=list(merged.values())
              note="upcoming releases retained from previous validated build"
              new["error"]=(str(new.get("error") or "")+"; "+note).strip("; ")
              new_path.write_text(json.dumps(new,indent=2,ensure_ascii=False)+"\n")
              print(f"Box Office recovery: {len(current)} current + {len(prior)} retained upcoming -> {len(new['movies'])} unique movies")
          PY

      - name: Validate dynamic inventory
        run: |
          python v6/src/live_quality.py
          jq -e '.stories.x | length == 10' v6/dist/feed.json >/dev/null
          jq -e '[.stories.x[].source_id] | unique | length == 10' v6/dist/feed.json >/dev/null
          jq -e '.movies | type=="array" and length>0' v6/dist/boxoffice.json >/dev/null
          jq -e '[.movies[] | (.tmdbId // (.title|ascii_downcase))] | length == (unique|length)' v6/dist/boxoffice.json >/dev/null

      - name: Preserve validated JSON
        run: |
          mkdir -p /tmp/v6-data
          cp v6/dist/feed.json v6/dist/nfl.json v6/dist/boxoffice.json v6/dist/markets.json v6/dist/status.json /tmp/v6-data/

      - name: Publish JSON only to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/v6-data/*.json .
          git add feed.json nfl.json boxoffice.json markets.json status.json
          if git diff --cached --quiet; then
            echo "Dynamic V6 data is already current."
            exit 0
          fi
          git commit -m "V6 validated data refresh"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "V6 data publish succeeded."
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent data publish conflicted; refusing to resolve silently."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          exit 1
