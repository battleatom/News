name: Site Browser Smoke Test

on:
  workflow_run:
    workflows: ['Update News Feed']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-http.log 2>&1 &
          echo $! > /tmp/news-http.pid
          sleep 2
      - name: Test V3 news cards, infinite scroll, NEW badges and responsive UI
        run: python tests/site_smoke_v26.py
      - name: Test mobile fetch status and live countdown
        run: python tests/mobile_status_smoke.py
      - name: Verify deployed GitHub Pages matches this build
        run: python tests/live_site_smoke.py
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/news-http.log || true
