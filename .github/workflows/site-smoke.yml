name: Site Browser Smoke Test

on:
  push:
    branches:
      - fix/x-celebrity-fallback-2026-09-13

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate X fallback syntax
        run: python -m py_compile scripts/enrich_x_issues.py
      - name: Run X enrichment against current feed
        run: python scripts/enrich_x_issues.py
      - name: Verify exactly ten unique relevant X slots
        run: |
          python - <<'PY'
          import importlib.util
          import xml.etree.ElementTree as ET
          spec=importlib.util.spec_from_file_location('xmod','scripts/enrich_x_issues.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          root=ET.parse('News').getroot(); items=root.findall('./channel/item')
          xs=[i for i in items if mod.clean(i.findtext('category'))=='x']
          topics=[mod.clean(i.findtext('xTopic')) for i in xs]
          assert len(xs)==10, len(xs)
          assert topics==mod.EXPECTED_TOPICS, topics
          links=[mod.clean(i.findtext('link')) for i in xs]
          assert len(set(links))==10, links
          for item in xs:
              topic=mod.clean(item.findtext('xTopic'))
              assert mod.topic_relevant(topic, mod.news_item_data(item)), topic
          print('X FALLBACK INTEGRATION TEST PASS')
          PY
