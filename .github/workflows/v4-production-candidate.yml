name: V4 Production Candidate

on:
  push:
    branches: [v4-production-candidate-2026-09-12]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/v4-production-candidate.yml'
      - '.github/workflows/update-news.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-production-candidate
  cancel-in-progress: true

jobs:
  build-test-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout controlled candidate
        uses: actions/checkout@v4
        with:
          ref: v4-production-candidate-2026-09-12
          fetch-depth: 0

      - name: Record exact source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout immutable V3 archive
        uses: actions/checkout@v4
        with:
          ref: archive-v3-stable-2026-09-12
          path: baseline-v3
          fetch-depth: 1

      - name: Validate Python before collection
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Collector preflight
        run: python scripts/preflight_feed.py

      - name: Collect full V4 feed with retry
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Collection attempt ${attempt}/3"
            if python scripts/update_news_v4.py; then success=1; break; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          if [ "$success" -ne 1 ]; then exit 1; fi

      - name: Replace provisional Entertainment with authoritative pools
        run: python scripts/update_entertainment_only_v4.py

      - name: Refine Technology and Gaming
        run: python scripts/refine_tech_gaming.py

      - name: Collect strict official legislation
        run: python scripts/collect_official_legislation_strict.py

      - name: Enrich World
        run: python scripts/enrich_world_content.py

      - name: Discover enrich and rank Underreported
        run: |
          python scripts/underreported_priority.py --discover
          python scripts/enrich_underreported.py
          python scripts/underreported_priority.py --rank

      - name: Enrich and enforce legislation
        run: |
          python scripts/enrich_legislation.py
          python scripts/enforce_official_legislation.py

      - name: Enrich X Top Issues
        run: python scripts/enrich_x_issues.py

      - name: Enrich Box Office
        run: |
          python scripts/enrich_box_office.py
          python scripts/patch_boxoffice_location.py

      - name: Clean and cluster feed
        run: |
          python scripts/clean_news.py
          python scripts/filter_landing_pages.py
          python scripts/record_pull_stats.py
          python scripts/cluster_related_coverage.py

      - name: Run V4 final verifier
        run: python scripts/verify_feed_v4.py --apply

      - name: Enforce final federal and legislation routing
        run: |
          python scripts/enforce_us_federal.py
          python scripts/enforce_official_legislation.py

      - name: Verify no strong duplicate pairs remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('verification-report.json').read_text(encoding='utf-8'))
          pairs=report.get('residualStrongDuplicatePairs',[])
          if pairs:
              for pair in pairs[:20]: print(pair)
              raise SystemExit(f'{len(pairs)} residual strong duplicate pair(s) remain')
          print('Duplicate guard passed.')
          PY

      - name: Rebuild and verify fixed X topics
        run: |
          python scripts/enrich_x_issues.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          expected=['Health','Technology & AI','Celebrities & Public Figures','World','Politics & Government','Entertainment','Sports','Business & Economy','Gaming','Science']
          items=ET.parse('News').getroot().findall('.//item')
          topics=[(i.findtext('xTopic') or '').strip() for i in items if (i.findtext('category') or '').strip()=='x']
          if topics != expected: raise SystemExit(f'X validation failed: {topics}')
          print('X fixed-topic guard passed.')
          PY

      - name: Finalize feed pull statistics
        run: python scripts/record_pull_stats.py --finalize

      - name: Install content brief dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7

      - name: Build content briefs and Why It Matters
        run: |
          python scripts/create_content_briefs.py
          python scripts/update_why_matters.py

      - name: Build final site
        run: |
          python scripts/build_site.py
          python scripts/patch_entertainment_v4_ui.py

      - name: Audit generated site
        run: python scripts/site_audit.py

      - name: Run release-candidate feed gate
        run: python scripts/v4_release_gate.py

      - name: Run deterministic unit regressions
        run: |
          python tests/news_market_db_test.py
          python tests/entertainment_v4_test.py
          python tests/verify_feed_test.py

      - name: Install Chromium for browser regressions
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start generated candidate and archived V3 sites
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-v4-http.log 2>&1 &
          (cd baseline-v3 && python -m http.server 8766 --bind 127.0.0.1 > /tmp/news-v3-http.log 2>&1 &)
          sleep 2

      - name: Run location and scroll browser regression
        run: python tests/location_routing_v27.py

      - name: Run Entertainment browser regression
        run: python tests/entertainment_v4_ui_test.py

      - name: Compare candidate to archived V3
        run: python tests/live_ab_compare_v27.py

      - name: Write controlled promotion report
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          items=ET.parse('News').getroot().findall('.//item')
          counts=Counter((i.findtext('category') or '').strip() for i in items)
          ent=[i for i in items if (i.findtext('category') or '').strip()=='entertainment']
          report={
            'status':'validated-production-candidate',
            'sourceSha':os.environ['SOURCE_SHA'],
            'generatedAt':datetime.now(timezone.utc).isoformat(),
            'feedItems':len(items),
            'categoryCounts':dict(sorted(counts.items())),
            'entertainment':{
              'clean':sum((i.findtext('entertainmentSafety') or '').strip()=='clean' for i in ent),
              'dirty':sum((i.findtext('entertainmentSafety') or '').strip()=='dirty' for i in ent)
            },
            'baseline':'archive-v3-stable-2026-09-12',
            'rollbackMain':'backup-main-pre-v4-2026-09-12',
            'checks':['python-syntax','preflight','feed-verifier','dedupe','x-topics','site-audit','release-gate','unit-regressions','location-scroll-browser','entertainment-browser','v3-v4-browser-comparison']
          }
          with open('v4-production-promotion-report.json','w',encoding='utf-8') as f:
            json.dump(report,f,indent=2);f.write('\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Ensure candidate source did not change during validation
        run: |
          git fetch origin v4-production-candidate-2026-09-12
          remote_sha=$(git rev-parse origin/v4-production-candidate-2026-09-12)
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "Candidate changed during validation: source=$SOURCE_SHA remote=$remote_sha"
            exit 1
          fi

      - name: Freeze exact validated production candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add News index.html update-stats.json boxoffice.json refresh-health.json content-brief-cache.json verification-report.json v4-release-report.json v4-production-promotion-report.json assets/location-content-v25.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Validated candidate produced no generated changes.'
            exit 0
          fi
          git commit -m 'Freeze validated V4 production candidate [skip ci]'
          git push origin HEAD:v4-production-candidate-2026-09-12

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-production-candidate-reports
          path: |
            live-ab-report.json
            verification-report.json
            v4-release-report.json
            v4-production-promotion-report.json
          retention-days: 90

      - name: Show local servers on failure
        if: failure()
        run: |
          cat /tmp/news-v4-http.log 2>/dev/null || true
          cat /tmp/news-v3-http.log 2>/dev/null || true
