name: V5 Visual Safety Validation

on:
  push:
    branches: [v5-visual-refinement-2026-09-13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout visual candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove renderer code is untouched
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(assets/app-v2\.js|assets/location-v2\.js|assets/entertainment-v4\.js|News)$'; then
            echo 'Visual branch changed renderer/feed code.'
            exit 1
          fi

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Build canonical page
        run: python scripts/build_site.py

      - name: Confirm visual layer is materialized
        run: |
          grep -q 'styles/v5-visual.css?v=1' index.html
          test -s styles/v5-visual.css
          grep -q 'v3-importance.high' styles/v5-visual.css
          grep -q 'news-item:not(.nfl-game-card)' styles/v5-visual.css

      - name: Run structural audits
        run: |
          python scripts/site_audit.py
          python scripts/v5_runtime_audit.py

      - name: Check CSS structure
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/v5-visual.css').read_text(encoding='utf-8')
          assert css.count('{')==css.count('}'), 'Unbalanced CSS braces'
          assert 'display:none' not in css.replace('display:none!important',''), 'Unexpected hiding rule'
          assert 'fetch(' not in css and '<script' not in css
          print('Visual CSS structure OK')
          PY
