name: Final V5 Fast Validation

on:
  push:
    branches: [Final-V5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-v5-fast-validation
  cancel-in-progress: true

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Final V5
        uses: actions/checkout@v4
        with:
          ref: Final-V5
          fetch-depth: 0

      - name: Set up cached Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Checkout immutable V4 baseline
        uses: actions/checkout@v4
        with:
          ref: v4-hard-save-2026-09-12
          path: baseline-v4
          fetch-depth: 1

      - name: Prove V4 baseline identity
        run: |
          test "$(git -C baseline-v4 rev-parse HEAD)" = "9549044575ac8ce8c17eccaa09702e157797b1cd"
          echo "V4 baseline locked at 9549044"

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Install lightweight dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7

      - name: Apply V5 transforms and canonical build
        run: bash -e v5-apply.sh

      - name: Prove checked-in preview matches canonical build
        run: |
          if ! git diff --quiet -- News index.html assets/location-content-v25.js; then
            echo 'Final-V5 checked-in preview is stale relative to the canonical V5 build.'
            git diff --stat -- News index.html assets/location-content-v25.js
            exit 1
          fi
          echo 'Checked-in Final-V5 preview matches the canonical build.'

      - name: Run structural runtime and release gates
        run: |
          python scripts/site_audit.py
          python scripts/v5_runtime_audit.py
          python scripts/v5_final_audit.py
          python scripts/v5_release_gate.py

      - name: Run inherited deterministic regressions
        run: |
          python tests/news_market_db_test.py
          python tests/entertainment_v4_test.py
          python tests/verify_feed_test.py

      - name: Run enabled V5 hardening tests
        run: |
          set -e
          while IFS= read -r t; do
            t="${t%%#*}"
            t="$(echo "$t" | xargs)"
            [ -z "$t" ] && continue
            echo "=== $t ==="
            test -f "$t"
            python "$t"
          done < v5-enabled-tests.txt

      - name: Prove canonical build is idempotent
        run: |
          cp index.html /tmp/v5-index-before.html
          python scripts/build_site.py
          cmp -s /tmp/v5-index-before.html index.html || { echo 'Canonical build is not idempotent'; diff -u /tmp/v5-index-before.html index.html | head -200; exit 1; }
          echo 'Canonical V5 build is idempotent.'

      - name: Compare source delta to hard-saved V4
        run: |
          git diff --check 9549044575ac8ce8c17eccaa09702e157797b1cd..HEAD
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-status','9549044575ac8ce8c17eccaa09702e157797b1cd..HEAD'],text=True)
          deleted=[line.split('\t',1)[1] for line in changed.splitlines() if line.startswith('D\t')]
          bad=[p for p in deleted if p not in {'.github/workflows/v4-stable-candidate.yml'}]
          if bad: raise SystemExit('Unexpected V4 source deletion(s): '+', '.join(bad))
          print('No unexpected V4 source deletions.')
          PY

  publish-preview:
    needs: fast-regression
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: final-v5-live-preview
      cancel-in-progress: true
    steps:
      - name: Checkout validated V5 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1

      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Materialize isolated V5 live preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production/v5-preview
          mkdir -p production/v5-preview
          cp candidate/index.html candidate/News production/v5-preview/
          cp -R candidate/assets candidate/styles production/v5-preview/
          for f in markets.json update-stats.json boxoffice.json state-legislation.json refresh-health.json content-brief-cache.json verification-report.json v4-release-report.json; do
            [ -f "candidate/$f" ] && cp "candidate/$f" production/v5-preview/
          done
          printf '{"sourceSha":"%s","branch":"Final-V5"}\n' "${GITHUB_SHA}" > production/v5-preview/preview-meta.json

      - name: Publish preview without touching production root
        working-directory: production
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5-preview
          if git diff --cached --quiet; then
            echo 'V5 preview already current.'
            exit 0
          fi
          git commit -m 'Update isolated Final V5 preview [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            [ "$attempt" -lt 3 ] && sleep 2
          done
          exit 1

      - name: Publish preview URL
        run: |
          echo 'Preview: https://battleatom.github.io/News/v5-preview/' >> "$GITHUB_STEP_SUMMARY"
