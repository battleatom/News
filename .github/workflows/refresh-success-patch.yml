name: Apply Refresh Success Fix (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-success-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply refresh success handling
        run: python scripts/patch_refresh_success.py

      - name: Validate page
        run: |
          python -m py_compile scripts/*.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if 'refresh-success-handling-v1' not in s:
              raise SystemExit('Refresh success marker missing')
          if re.search(r'</html>\s*<(?:script|style)\b', s, flags=re.I):
              raise SystemExit('Generated page contains script/style tags after </html>')
          print('Refresh success handling validation passed.')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_refresh_success.py .github/workflows/refresh-success-patch.yml
          if git diff --cached --quiet; then
            echo 'Refresh success fix already present.'
            exit 0
          fi
          git commit -m 'Fix refresh success state'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            git fetch origin main
            git merge --no-edit -X ours origin/main || {
              git merge --abort || true
              exit 1
            }
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          exit 1
