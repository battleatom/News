name: Validate NFL Compact Grid
on:
  push:
    branches: [fix/nfl-compact-grid-full-names-2026-09-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/patch_nfl_live.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Audit generated site
        run: python scripts/site_audit.py
      - name: Validate NFL generated contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'two-column mobile grid':'@media(max-width:600px){.nfl-live-note' in s and 'grid-template-columns:repeat(2,minmax(0,1fr))' in s,
            'full team names':'team?.displayName' in s,
            'next badge':'nfl-badge">NEXT' in s,
            'live-first ordering':"state==='in'?0:state==='pre'?1:2" in s,
            'final after upcoming':"return ra===2?tb-ta:ta-tb" in s,
            'no NFL toggle':'Upcoming | Recent | All' not in s,
          }
          for name,ok in checks.items(): print(name, 'PASS' if ok else 'FAIL')
          assert all(checks.values()), checks
          PY
# Temporary branch-only validation workflow; remove before merge.
