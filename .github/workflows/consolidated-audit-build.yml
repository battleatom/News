name: Consolidated Audit Build

on:
  push:
    branches:
      - consolidation/audit-build-2026-09-11-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture current production baseline
        run: |
          git fetch origin main
          git show origin/main:News > baseline-News
          git show origin/main:index.html > baseline-index.html

      - name: Install dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7

      - name: Run consolidated candidate pipeline
        run: python scripts/consolidated_pipeline.py

      - name: Compare every tab and article with production baseline
        run: python scripts/consolidated_compare_audit.py baseline-News baseline-index.html

      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-audit-${{ github.run_number }}
          path: |
            consolidated-audit.json
            consolidated-audit.md
            verification-report.json
            update-stats.json
            News
            index.html
            baseline-News
            baseline-index.html
          if-no-files-found: warn
