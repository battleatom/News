name: Promote V5.1 Inventory Policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v51_inventory_policy.py'
  workflow_dispatch:

concurrency:
  group: promote-v51-inventory-policy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply tested V5.1 policy
        run: |
          python scripts/apply_v51_inventory_policy.py
          python -m py_compile scripts/*.py tests/*.py
          grep -q 'const STORIES_PER_PAGE = 50;' scripts/patch_load_more.py
          grep -q 'const RESERVE_PAGE = 25;' scripts/patch_load_more.py
          grep -q 'NFL offseason news trades contracts roster' scripts/update_news.py
          grep -q 'MAX_TECH = 90' scripts/refine_tech_gaming.py
          grep -q 'MAX_ITEMS = 75' scripts/underreported_priority.py

      - name: Verify Box Office remains outside V5.1 policy
        run: |
          if grep -qi 'boxoffice' scripts/apply_v51_inventory_policy.py; then
            echo 'Box Office reference found in V5.1 policy; refusing promotion.'
            exit 1
          fi
          echo 'Box Office remains untouched by V5.1 inventory policy.'

      - name: Commit permanent V5.1 source settings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_news_normalized.py scripts/refine_tech_gaming.py scripts/refine_entertainment.py scripts/underreported_priority.py scripts/update_news.py scripts/patch_load_more.py assets/card-feedback.js
          if git diff --cached --quiet; then
            echo 'V5.1 policy already permanent; nothing to commit.'
            exit 0
          fi
          git commit -m 'Promote V5.1 deep inventory policy'
          git pull --rebase origin main
          git push origin main
