name: NFL Streaming Branch Test

on:
  push:
    branches:
      - fix/nfl-streaming-availability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile patch
        run: python -m py_compile scripts/patch_nfl_streaming.py scripts/patch_nfl_live.py
      - name: Regenerate NFL UI
        run: |
          python scripts/patch_nfl_live.py
          python scripts/patch_nfl_streaming.py
      - name: Validate streaming mappings and rendered hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['function nflStreamingServices(','Paramount+','Peacock','Prime Video','Netflix','FOX One','ESPN+','NFL+','YouTube Sunday Ticket (out-of-market)','<strong>Airing:</strong>','nfl-stream-label']
          missing=[x for x in required if x not in s]
          assert not missing,missing
          assert s.count('function nflStreamingServices(')==1
          assert s.count('class=\\"nfl-airing\\"')==1
          print('NFL STREAMING BRANCH TEST PASSED')
          PY
