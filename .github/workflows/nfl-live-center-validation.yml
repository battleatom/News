name: NFL Live Center Validation

on:
  push:
    branches: [feature/nfl-live-playbyplay]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/patch_nfl_live_center.py scripts/build_site.py tests/v5_nfl_live_center_test.py
      - name: Build canonical V5
        run: bash -e v5-apply.sh
      - name: Validate NFL live center contract
        run: python tests/v5_nfl_live_center_test.py
      - name: Run release gates
        run: |
          python scripts/site_audit.py
          python scripts/v5_runtime_audit.py
          python scripts/v5_release_gate.py
      - name: Prove build idempotence
        run: |
          cp index.html /tmp/index-before.html
          bash -e v5-apply.sh
          cmp /tmp/index-before.html index.html
