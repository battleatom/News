name: Tab Scroll Reset Test

on:
  push:
    branches: [v5.1-tab-scroll-reset]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/v51-category-sticky-ux.js
      - name: Verify scroll reset contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/v51-category-sticky-ux.js').read_text(encoding='utf-8')
          assert "const wasActive=clicked.classList.contains('active')" in s
          assert "if(!wasActive)window.scrollTo({top:0,left:0,behavior:'auto'})" in s
          assert "scrollActiveTab('smooth')" in s
          assert "v51-sticky-shell" not in s
          print('Tab scroll reset contract passed.')
          PY
