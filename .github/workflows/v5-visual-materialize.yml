name: Materialize V5 Visual Candidate

on:
  push:
    branches: [v5-visual-refinement-2026-09-13]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v5-visual-refinement-2026-09-13
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical page
        run: python scripts/build_site.py

      - name: Audit generated page
        run: |
          grep -q 'styles/v5-visual.css?v=1' index.html
          python scripts/site_audit.py
          python scripts/v5_runtime_audit.py

      - name: Commit only generated page
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Visual candidate already materialized.'
            exit 0
          fi
          git commit -m 'Materialize tested V5 visual candidate [skip ci]'
          git push origin HEAD:v5-visual-refinement-2026-09-13
