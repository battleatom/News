name: Validate Normalized Category Pools

on:
  push:
    branches: [fix/normalized-category-pools-2026-09-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/*.py tests/normalized_category_pools_test.py
      - name: Pool regression tests
        run: python tests/normalized_category_pools_test.py
      - name: Existing feed verification
        run: python scripts/verify_feed.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Audit site
        run: python scripts/site_audit.py

# Branch-only validation; removed before merge.
