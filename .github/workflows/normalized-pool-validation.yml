name: Validate Normalized Category Pools

on:
  push:
    branches: [fix/normalized-category-pools-2026-09-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/*.py tests/normalized_category_pools_test.py tests/official_legislation_guard_test.py
      - name: Pool regression tests
        run: python tests/normalized_category_pools_test.py
      - name: Official legislation guard regression test
        run: python tests/official_legislation_guard_test.py
      - name: Run normalized live collector
        run: python scripts/update_news_normalized.py
      - name: Confirm news collector emits no Legislation journalism cards
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          rows=[x for x in ET.parse('News').getroot().findall('.//item') if (x.findtext('category') or '').strip()=='legislation']
          assert not rows, f'Normalized news collector emitted {len(rows)} legislation card(s)'
          print('Normalized news collector correctly leaves Legislation empty for official collector.')
          PY
      - name: Collect strict official legislation records
        run: python scripts/collect_official_legislation_strict.py
      - name: Enrich legislation with supporting coverage
        run: python scripts/enrich_legislation.py
      - name: Enforce official-only legislation
        run: python scripts/enforce_official_legislation.py
      - name: Validate Legislation cards are official records only
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('News').getroot()
          rows=[x for x in root.findall('.//item') if (x.findtext('category') or '').strip()=='legislation']
          assert rows, 'No official legislation records were collected'
          bad=[]
          for x in rows:
              source=(x.findtext('source') or '').strip()
              official=(x.findtext('officialSource') or '').strip()
              if not official:
                  bad.append((x.findtext('title') or '', source))
          assert not bad, f'Non-official legislation cards remain: {bad[:5]}'
          print(f'Legislation validation passed: {len(rows)} official record(s), zero standalone news cards.')
          PY
      - name: Apply final feed verification
        run: python scripts/verify_feed.py --apply
      - name: Verify generated category caps
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          counts=Counter((x.findtext('category') or '').strip() for x in ET.parse('News').getroot().findall('.//item'))
          print('Generated category counts:', dict(sorted(counts.items())))
          for cat in ('world','us','presidential','federal','nm','region','nfl','technology','gaming','military'):
              assert counts[cat] <= 40, (cat, counts[cat])
          assert counts['local'] <= 30, counts['local']
          assert counts['region'] <= 40, counts['region']
          assert counts['underreported'] <= 30, counts['underreported']
          for x in ET.parse('News').getroot().findall('.//item'):
              if (x.findtext('category') or '').strip() == 'legislation':
                  assert (x.findtext('officialSource') or '').strip(), x.findtext('title')
          print('Category cap and official-legislation validation passed.')
          PY
      - name: Install content brief dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7
      - name: Generate content briefs
        run: python scripts/create_content_briefs.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Audit site
        run: python scripts/site_audit.py

# Branch-only validation; removed before merge.
