name: Test Consolidation Location

on:
  push:
    branches: ['test/consolidation-location-dedupe-v1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/consolidation-location-dedupe-v1
          fetch-depth: 0

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Run generic feed verification regressions
        run: python tests/verify_feed_test.py

      - name: Run site integrity audit
        run: python scripts/site_audit.py

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local test site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-test-http.log 2>&1 &
          echo $! > /tmp/news-test-http.pid
          sleep 2

      - name: Test generic location routing
        run: python tests/location_routing_v27.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/news-test-http.log || true
