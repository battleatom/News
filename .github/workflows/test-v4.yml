name: V4 Snapshot Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          ref: V4
          fetch-depth: 0

      - name: Checkout stable V3 baseline
        uses: actions/checkout@v4
        with:
          ref: version-3
          path: baseline-v3
          fetch-depth: 1

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Validate nationwide market database
        run: python tests/news_market_db_test.py

      - name: Run V4 Entertainment unit regressions
        run: python tests/entertainment_v4_test.py

      - name: Run generic feed verification regressions
        run: python tests/verify_feed_test.py

      - name: Run site integrity audit on committed V4 snapshot
        run: python scripts/site_audit.py

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start committed V4 and stable V3 sites
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-v4-http.log 2>&1 &
          echo $! > /tmp/news-v4-http.pid
          (cd baseline-v3 && python -m http.server 8766 --bind 127.0.0.1 > /tmp/news-v3-http.log 2>&1 &)
          sleep 2

      - name: Test nationwide location routing
        run: python tests/location_routing_v27.py

      - name: Test Entertainment browser UI and red footnote
        run: python tests/entertainment_v4_ui_test.py

      - name: Run stable-V3 vs V4 browser comparison
        run: python tests/live_ab_compare_v27.py

      - name: Print A/B report
        if: always()
        run: cat live-ab-report.json || true

      - name: Upload A/B comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-v4-snapshot-comparison
          path: live-ab-report.json
          retention-days: 14

      - name: Show server logs on failure
        if: failure()
        run: |
          cat /tmp/news-v4-http.log || true
          cat /tmp/news-v3-http.log || true
