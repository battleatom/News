name: V3.1 Maintenance Validation

on:
  push:
    branches: [maintenance-v3.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v31-maintenance-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance-v3.1

      - name: Install content extraction dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7

      - name: Apply feed cleanup and rebuild current V3 site
        run: |
          python scripts/filter_landing_pages.py
          python scripts/record_pull_stats.py
          python scripts/dedupe_news_stories.py
          python scripts/record_pull_stats.py --finalize
          python scripts/create_content_briefs.py
          python scripts/build_site.py

      - name: Audit generated site and Python syntax
        run: |
          python scripts/site_audit.py
          python -m py_compile scripts/*.py tests/*.py

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Start local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/news-v31-http.log 2>&1 &
          echo $! > /tmp/news-v31-http.pid
          sleep 2

      - name: Run V3.1 browser regression suite
        run: python tests/site_smoke_v26.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/news-v31-http.log || true
