name: V6 Market Scroller Migration

on:
  push:
    branches: [v6]
    paths:
      - '.github/workflows/v6-market-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v6
          fetch-depth: 0
      - name: Apply native V6 market scroller changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old,new,1))

          replace('v6/web/app.js', '''function renderMarkets(){const rows=store.markets?.markets||[];if(!rows.length){marketsRoot.innerHTML='<span class="market-note">Markets unavailable</span>';return}marketsRoot.innerHTML=rows.map(row=>{const pct=Number(row.changePct||0),cls=pct>0?"up":pct<0?"down":"flat";return `<span class="market-item"><b>${row.label||row.symbol}</b><span>${Number(row.price||0).toLocaleString(undefined,{maximumFractionDigits:2})}</span><em class="${cls}">${pct>0?"+":""}${pct.toFixed(2)}%</em></span>`}).join("")}''', '''function renderMarkets(){const rows=store.markets?.markets||[],generated=store.markets?.generatedAt||"";const formatPrice=row=>{const value=Number(row.price||0),label=String(row.label||row.symbol||"").toUpperCase();if(label==="VIX"||label==="10Y")return value.toFixed(2);if(label==="WTI OIL"||label==="GOLD")return`$${value.toFixed(2)}`;return value.toLocaleString(undefined,{maximumFractionDigits:2})};const items=rows.map(row=>{const pct=Number(row.changePct||0),cls=pct>0?"up":pct<0?"down":"flat",arrow=pct>0?"▲":pct<0?"▼":"—";return `<span class="market"><span class="market-name">${row.label||row.symbol}</span><span class="market-value">${formatPrice(row)}</span><span class="${cls}">${arrow} ${Math.abs(pct).toFixed(2)}%</span></span>`}).join("");const benchmark=rows.find(row=>row.symbol==="^GSPC")||rows[0],closed=/closed/i.test(String(benchmark?.marketState||"")),dt=new Date(generated),stamp=Number.isNaN(dt.getTime())?"":new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(dt),status=`${closed?"MARKETS CLOSED":"MARKET DATA"}${stamp?` · ${stamp}`:""}`;marketsRoot.innerHTML=`<div class="markets-track"><span class="market-label">MARKETS</span>${items||'<span class="market-note">Markets unavailable</span>'}<span class="market"><span class="market-name">OPEC</span><span class="flat">WATCH</span></span><span class="market-time">${status}</span></div>`}''')

          replace('v6/web/styles.css', '''.markets{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:0 18px 8px;scrollbar-width:none}.markets::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.market-item{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:4px 7px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:.62rem}.market-item b{font-size:.6rem}.market-item em{font-style:normal;font-weight:900}.market-item .up{color:var(--good)}.market-item .down{color:var(--bad)}.market-item .flat{color:var(--muted)}.market-note{font-size:.62rem;color:var(--muted)}''', '''.markets{display:block;width:100%;height:32px;min-height:32px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}.markets::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.markets-track{display:flex;flex-wrap:nowrap;width:max-content;min-width:max-content;height:32px;padding:0 12px;gap:13px;align-items:center;justify-content:flex-start;white-space:nowrap}.market-label{font-size:.58rem;font-weight:950;letter-spacing:.08em;color:var(--text)}.market{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;font-size:.62rem;color:var(--muted)}.market-name{opacity:.82;font-weight:750}.market-value{color:var(--text);font-variant-numeric:tabular-nums}.market .up,.market .down,.market .flat{font-weight:900;font-variant-numeric:tabular-nums}.market .up{color:var(--good)}.market .down{color:var(--bad)}.market .flat{color:var(--muted)}.market:has(.up){background:rgba(22,163,74,.07);border-radius:999px;padding:3px 6px}.market:has(.down){background:rgba(220,38,38,.07);border-radius:999px;padding:3px 6px}.market-time,.market-note{font-size:.58rem;color:var(--muted)}''')
          replace('v6/web/styles.css', '.markets{padding:0 12px 6px}', '.markets{padding:0}')
          replace('v6/web/styles.css', '.nfl-grid{grid-template-columns:1fr}.market-item:nth-child(n+5){display:none}.movie-card', '.nfl-grid{grid-template-columns:1fr}.movie-card')

          replace('v6/src/specialized.py', 'MARKETS=[("^GSPC","S&P 500"),("^DJI","Dow"),("^IXIC","Nasdaq"),("BTC-USD","Bitcoin"),("GC=F","Gold"),("CL=F","Oil")]', 'MARKETS=[("^GSPC","S&P 500"),("^DJI","DOW"),("^IXIC","NASDAQ"),("^VIX","VIX"),("CL=F","WTI OIL"),("GC=F","GOLD"),("^TNX","10Y")]')

          replace('v6/tests/browser_smoke.py', '        assert page.locator("#markets").count()==1 and page.locator("#refresh-status").count()==1 and page.locator("#location-button").count()==1\n', '        assert page.locator("#markets").count()==1 and page.locator("#refresh-status").count()==1 and page.locator("#location-button").count()==1\n        assert page.locator("#markets .markets-track").count()==1;assert page.locator("#markets .market-label").get_by_text("MARKETS",exact=True).count()==1;assert page.locator("#markets .market-item").count()==0\n        market_style=page.locator("#markets").evaluate("el=>({overflowX:getComputedStyle(el).overflowX,height:el.getBoundingClientRect().height})");assert market_style["overflowX"]=="auto";assert abs(market_style["height"]-32)<=1\n')

          Path('.github/workflows/v6-market-migration.yml').unlink()
          PY
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore V5.3.1-style V6 market scroller"
          git push origin v6
