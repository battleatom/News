name: Static Header Branch Test

on:
  push:
    branches: [v5.1-static-header-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Validate Python and JavaScript
        run: |
          python -m py_compile scripts/patch_v2_frontend.py
          node --check assets/v51-category-sticky-ux.js

      - name: Build structural sticky shell
        run: python scripts/patch_v2_frontend.py

      - name: Verify shell ownership and ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start='<!--V51_STICKY_SHELL_START--><div class="v51-sticky-shell">'
          end='</div><!--V51_STICKY_SHELL_END-->'
          assert s.count(start)==1, f'expected one sticky shell start, got {s.count(start)}'
          assert s.count(end)==1, f'expected one sticky shell end, got {s.count(end)}'
          a=s.index(start)+len(start)
          b=s.index(end,a)
          shell=s[a:b]
          tokens=[
              '<header><h1>UNDERREPORTED</h1>',
              'class="toolbar"',
              'id="pull-stats-ui"',
              'class="markets"',
              'id="tabs"',
          ]
          positions=[]
          for token in tokens:
              pos=shell.find(token)
              assert pos>=0, f'missing {token} from sticky shell'
              positions.append(pos)
          assert positions==sorted(positions), f'header controls out of order: {positions}'
          feed=s.find('<div id="news-feed"',b)
          assert feed>b, '#news-feed must remain below sticky shell'
          assert 'v51-fixed-stack' not in s, 'retired runtime fixed stack remains in generated HTML'
          print('Structural sticky shell regression passed:', positions)
          PY

      - name: Verify CSS is wrapper-owned
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/v51-sticky-nav.css').read_text(encoding='utf-8')
          js=Path('assets/v51-category-sticky-ux.js').read_text(encoding='utf-8')
          assert '.v51-sticky-shell{position:sticky' in css.replace('\n','')
          assert 'position:fixed' not in css
          assert 'v51-fixed-stack' not in css
          assert 'ensureFixedStack' not in js
          assert 'syncStickyMetrics' not in js
          assert '--v51-header-h' not in js
          print('Sticky ownership regression passed.')
          PY
