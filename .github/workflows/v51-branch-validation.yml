name: V5.1 Optimization Branch Validation

on:
  push:
    branches: [v5.1-optimization-audit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v51-optimization-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.1-optimization-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Install lightweight dependencies
        run: python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7
      - name: V5.1 architecture tests
        run: python tests/v51_architecture_test.py
      - name: Existing V5 tab quality tests
        run: python tests/v5_tab_quality_test.py
      - name: Canonical V5 build with V5.1 policies
        run: bash -e v5-apply.sh
      - name: Source health
        run: python scripts/source_health.py
      - name: Structural and release gates
        run: |
          python scripts/site_audit.py
          python scripts/v5_runtime_audit.py
          python scripts/v5_final_audit.py
          python scripts/v5_release_gate.py
      - name: Enabled V5 regression suite
        run: |
          set -e
          while IFS= read -r t; do
            t="${t%%#*}"; t="$(echo "$t" | xargs)"; [ -z "$t" ] && continue
            python "$t"
          done < v5-enabled-tests.txt
      - name: Idempotence
        run: |
          cp News /tmp/v51-news
          cp index.html /tmp/v51-index
          bash -e v5-apply.sh
          cmp -s /tmp/v51-news News
          cmp -s /tmp/v51-index index.html
      - name: V4 ancestry and whitespace safety
        run: |
          git merge-base --is-ancestor 9549044575ac8ce8c17eccaa09702e157797b1cd HEAD
          git diff --check 9549044575ac8ce8c17eccaa09702e157797b1cd..HEAD
