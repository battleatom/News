name: V5.3.1 UX Cleanup Validation
on:
  push:
    branches: [v5.3.1-ux-cleanup]
    paths:
      - 'assets/entertainment-v4.js'
      - 'scripts/patch_site_features.py'
      - 'styles/v5-visual.css'
      - 'scripts/v53_quality_layer.py'
      - 'scripts/update_news_v53.py'
      - 'scripts/v53_underreported_guard.py'
      - '.github/workflows/v531-ux-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch stable V5.3 baseline
        run: git fetch origin stable-v5.3-2026-09-16
      - name: Syntax checks
        run: |
          python -m py_compile scripts/patch_site_features.py scripts/v53_quality_layer.py scripts/update_news_v53.py scripts/v53_underreported_guard.py
          node --check assets/entertainment-v4.js
      - name: Verify feature cleanup
        run: |
          ! grep -Eq 'AudioContext|unlockPopAudio|playNewArticlePop' scripts/patch_site_features.py
          ! grep -Eq 'imageUrl|ent-card-image|ent-image-link|safeImage' assets/entertainment-v4.js
          grep -q 'display:block!important' styles/v5-visual.css
          grep -q 'overflow-wrap:anywhere!important' styles/v5-visual.css
      - name: Quality layer exact-output parity
        run: |
          rm -rf /tmp/v53-base /tmp/v53-candidate
          mkdir -p /tmp/v53-base /tmp/v53-candidate
          git show origin/stable-v5.3-2026-09-16:News > /tmp/v53-base/News
          cp /tmp/v53-base/News /tmp/v53-candidate/News
          git show origin/stable-v5.3-2026-09-16:scripts/v53_quality_layer.py > /tmp/v53-base/v53_quality_layer.py
          cp scripts/v53_quality_layer.py /tmp/v53-candidate/v53_quality_layer.py
          (cd /tmp/v53-base && python v53_quality_layer.py >/tmp/v53-base.stdout)
          cp /tmp/v53-quality-report.json /tmp/v53-base-report.json
          (cd /tmp/v53-candidate && python v53_quality_layer.py >/tmp/v53-candidate.stdout)
          cp /tmp/v53-quality-report.json /tmp/v53-candidate-report.json
          cmp /tmp/v53-base/News /tmp/v53-candidate/News
          cmp /tmp/v53-base-report.json /tmp/v53-candidate-report.json
          echo 'Quality optimization output is byte-identical to stable V5.3.'
      - name: Verify source-table isolation
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import update_news_v53 as mod

          base = mod.core.TRUSTED_CATEGORY_FALLBACKS
          snapshot = {k: list(v) for k, v in base.items()}
          expanded = mod._expanded_fallbacks()
          assert expanded is not base
          assert base == snapshot, 'building V5.3 fallbacks mutated V5.2 state'
          for category, additions in (
              ('world', mod.WORLD_SOURCE_EXPANSION),
              ('nfl', mod.NFL_SOURCE_EXPANSION),
          ):
              before = {(str(n).lower(), str(q).lower()) for n, q in snapshot.get(category, [])}
              expected_new = {(str(n).lower(), str(q).lower()) for n, q in additions} - before
              after = {(str(n).lower(), str(q).lower()) for n, q in expanded.get(category, [])}
              assert expected_new <= after
              assert len(expanded.get(category, [])) == len(snapshot.get(category, [])) + len(expected_new)
          expanded.setdefault('world', []).append(('TEST ONLY', 'TEST ONLY'))
          assert base == snapshot, 'expanded copy still aliases V5.2 rows'
          print('V5.3 source expansion is isolated from V5.2 module state.')
          PY
      - name: Verify Underreported overlap handling
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import format_datetime
          sys.path.insert(0, 'scripts')
          import v53_underreported_guard as guard

          now = datetime.now(timezone.utc)
          item = ET.Element('item')
          ET.SubElement(item, 'source').text = 'Primary'
          pool = ET.SubElement(item, 'coveragePool')
          def add(source, days):
              node = ET.SubElement(pool, 'article')
              ET.SubElement(node, 'source').text = source
              ET.SubElement(node, 'pubDate').text = format_datetime(now - timedelta(days=days))
          add('Source A', 10)
          add('Source A', 220)
          add('Source B', 170)
          add('Source C', 20)
          recent, historical, oldest = guard.evidence(item, now)
          assert set(recent) == {'sourcea', 'sourcec'}
          assert set(historical) == {'sourceb'}, historical
          assert 169 <= oldest <= 171, oldest
          print('Recent+historical overlap is counted once; historical-only metadata is correct.')
          PY
      - name: Underreported ranking/eligibility parity
        run: |
          rm -rf /tmp/ur-base /tmp/ur-candidate
          mkdir -p /tmp/ur-base /tmp/ur-candidate
          git show origin/stable-v5.3-2026-09-16:News > /tmp/ur-base/News
          cp /tmp/ur-base/News /tmp/ur-candidate/News
          git show origin/stable-v5.3-2026-09-16:scripts/v53_underreported_guard.py > /tmp/ur-base/v53_underreported_guard.py
          cp scripts/v53_underreported_guard.py /tmp/ur-candidate/v53_underreported_guard.py
          (cd /tmp/ur-base && python v53_underreported_guard.py >/tmp/ur-base.stdout)
          cp /tmp/v53-underreported-guard.json /tmp/ur-base-report.json
          (cd /tmp/ur-candidate && python v53_underreported_guard.py >/tmp/ur-candidate.stdout)
          cp /tmp/v53-underreported-guard.json /tmp/ur-candidate-report.json
          python - <<'PY'
          import json, xml.etree.ElementTree as ET

          def items(path):
              ch = ET.parse(path).getroot().find('channel')
              return list(ch.findall('item'))
          base = items('/tmp/ur-base/News')
          cand = items('/tmp/ur-candidate/News')
          identity = lambda x: (
              (x.findtext('category') or '').strip().lower(),
              (x.findtext('title') or '').strip(),
              (x.findtext('link') or '').strip(),
          )
          assert [identity(x) for x in base] == [identity(x) for x in cand], 'story eligibility/order changed'
          base_u = [x for x in base if identity(x)[0] == 'underreported']
          cand_u = [x for x in cand if identity(x)[0] == 'underreported']
          stable_tags = ('recentSupportingSourceCount','underreportedPriority','underreportedScore','coverage','underreportedConfidence')
          for b, c in zip(base_u, cand_u):
              assert identity(b) == identity(c)
              for tag in stable_tags:
                  assert (b.findtext(tag) or '') == (c.findtext(tag) or ''), (identity(b), tag)
              bh = int(b.findtext('historicalSupportingSourceCount') or 0)
              ch = int(c.findtext('historicalSupportingSourceCount') or 0)
              assert ch <= bh, (identity(b), bh, ch)
          assert json.load(open('/tmp/ur-base-report.json')) == json.load(open('/tmp/ur-candidate-report.json'))
          print('Underreported eligibility, ranking, recent-source counts and guard report are unchanged; historical metadata only becomes more precise.')
          PY
      - name: Protect sticky navigation UX
        run: |
          git diff --exit-code origin/stable-v5.3-2026-09-16 -- assets/v51-category-sticky-ux.js styles/v51-sticky-nav.css
      - name: Limit patch scope
        run: |
          ALLOWED='^(assets/entertainment-v4.js|scripts/patch_site_features.py|styles/v5-visual.css|scripts/v53_quality_layer.py|scripts/update_news_v53.py|scripts/v53_underreported_guard.py|.github/workflows/v531-ux-cleanup.yml)$'
          bad=$(git diff --name-only origin/stable-v5.3-2026-09-16...HEAD | grep -Ev "$ALLOWED" || true)
          if [ -n "$bad" ]; then echo "Unexpected files changed:"; echo "$bad"; exit 1; fi
      - name: Summary
        run: |
          echo 'V5.3.1 validation passed: UX cleanup preserved, quality output matches stable exactly, source expansion isolated, Underreported ranking preserved with cleaner historical metadata, sticky UX unchanged.'
