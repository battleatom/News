name: Validate X Render Mobile Sticky and Feed
on:
  push:
    branches: [fix/x-render-mobile-sticky-smoke-2026-09-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/*.py tests/site_smoke_v26.py tests/site_smoke_v32.py tests/x_static_topics_test.py
      - name: Static X topic contract
        run: python tests/x_static_topics_test.py
      - name: Verify X renderer registry and sticky patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          x=Path('scripts/patch_x_ui.py').read_text()
          hot=Path('scripts/patch_interaction_hotfix.py').read_text()
          assert 'window.__categoryRenderers.x=renderXIssues' in x
          assert "render=function(items){if(active==='x'" not in x
          assert 'mobile-sticky-nav-v1' in hot
          assert '.container{overflow:visible!important}' in hot
          print('Static renderer/sticky contracts passed.')
          PY
      - name: Run normalized live collector
        run: python scripts/update_news_normalized.py
      - name: Refine Technology and Gaming
        run: python scripts/refine_tech_gaming.py
      - name: Collect strict official legislation
        run: python scripts/collect_official_legislation_strict.py
      - name: Enrich World
        run: python scripts/enrich_world_content.py
      - name: Discover and rank Underreported
        run: |
          python scripts/underreported_priority.py --discover
          python scripts/enrich_underreported.py
          python scripts/underreported_priority.py --rank
      - name: Enrich and guard legislation
        run: |
          python scripts/enrich_legislation.py
          python scripts/enforce_official_legislation.py
      - name: Build initial X pool
        run: python scripts/enrich_x_issues.py
      - name: Clean and verify feed
        run: |
          python scripts/clean_news.py
          python scripts/filter_landing_pages.py
          python scripts/record_pull_stats.py
          python scripts/cluster_related_coverage.py
          python scripts/verify_feed.py --apply
      - name: Verify no strong duplicate pairs remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('verification-report.json').read_text())
          pairs=report.get('residualStrongDuplicatePairs',[])
          assert not pairs, pairs[:10]
          print('Duplicate guard passed.')
          PY
      - name: Rebuild fixed X after verification
        run: python scripts/enrich_x_issues.py
      - name: Verify exact ten fixed X topics
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          expected=['Health','Technology & AI','Celebrities & Public Figures','World','Politics & Government','Entertainment','Sports','Business & Economy','Gaming','Science']
          items=ET.parse('News').getroot().findall('.//item')
          x=[i for i in items if (i.findtext('category') or '').strip()=='x']
          topics=[(i.findtext('xTopic') or '').strip() for i in x]
          assert len(x)==10 and topics==expected and len(set(topics))==10, topics
          print('Feed contains exactly ten fixed X topics.')
          PY
      - name: Install content and browser dependencies
        run: |
          python -m pip install --quiet beautifulsoup4 googlenewsdecoder==0.1.7 playwright
          python -m playwright install --with-deps chromium
      - name: Generate briefs and Why It Matters
        run: |
          python scripts/create_content_briefs.py
          python scripts/update_why_matters.py
      - name: Build and audit site
        run: |
          python scripts/build_site.py
          python scripts/site_audit.py
      - name: Validate generated X registry and sticky style
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'window.__categoryRenderers.x=renderXIssues' in s
          assert 'mobile-sticky-nav-v1' in s
          assert 'full-why-matters-v1' in s
          print('Generated site contracts passed.')
          PY
      - name: Start local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/news-http.log 2>&1 &
          sleep 2
      - name: Browser smoke including X and mobile sticky navigation
        run: python tests/site_smoke_v32.py
      - name: Mobile status smoke
        run: python tests/mobile_status_smoke.py
# Temporary branch-only workflow; remove before merge.
