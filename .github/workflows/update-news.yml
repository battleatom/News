name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - 'News'
      - 'index.html'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: update-news-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Ensure rolling 48-hour feed window
        run: python scripts/patch_feed_window.py

      - name: Ensure NFL feed category
        run: python scripts/patch_nfl_feed.py

      - name: Patch news collector rules
        run: python scripts/patch_news_collector.py

      - name: Patch Top Stories topic and entity diversity
        run: python scripts/patch_top_diversity.py

      - name: Strengthen event-level duplicate detection
        run: python scripts/patch_event_dedupe.py

      - name: Patch site cache metadata
        run: python scripts/patch_cache_metadata.py

      - name: Apply site theme
        run: python scripts/patch_theme.py

      - name: Apply live local date time and weather
        run: python scripts/patch_local_status.py

      - name: Apply page-level newspaper header
        run: python scripts/patch_newspaper_header.py

      - name: Persist selected news tab
        run: python scripts/patch_tab_persistence.py

      - name: Apply article styling
        run: python scripts/patch_article_style.py

      - name: Patch location-aware Regional tab
        run: python scripts/patch_region_tab.py

      - name: Verify and enforce NFL and X tabs
        run: python scripts/patch_nfl_x_tabs.py

      - name: Fix Regional tab click handling
        run: python scripts/patch_region_click.py

      - name: Patch Underreported detail UI
        run: python scripts/patch_underreported_detail.py

      - name: Patch X Top Issues UI
        run: python scripts/patch_x_issues_ui.py

      - name: Update RSS feed
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "RSS update attempt ${attempt}/3"
            if python scripts/update_news.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "RSS update failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "All RSS update attempts failed. Preserving the existing News feed and continuing the workflow."
          fi

      - name: Enrich World news content
        run: python scripts/enrich_world_content.py

      - name: Enrich Underreported context and long-term supporting coverage
        run: python scripts/enrich_underreported.py

      - name: Enrich X Top Issues
        run: python scripts/enrich_x_issues.py

      - name: Enrich Box Office and Farmington movie data
        run: python scripts/enrich_box_office.py

      - name: Add location-aware Box Office data
        run: python scripts/patch_boxoffice_location.py

      - name: Clean commerce and paywall-heavy links
        run: python scripts/clean_news.py

      - name: Record feed pull statistics
        run: python scripts/record_pull_stats.py

      - name: Remove exact and near-duplicate news stories
        run: python scripts/dedupe_news_stories.py

      - name: Finalize feed pull statistics
        run: python scripts/record_pull_stats.py --finalize

      - name: Canonicalize final page features
        run: python scripts/patch_site_features.py

      - name: Apply reliable automatic refresh timer
        run: python scripts/patch_auto_refresh_timer.py

      - name: Apply location-aware Box Office UI
        run: python scripts/patch_boxoffice_ui.py

      - name: Apply detailed pull statistics UI
        run: python scripts/patch_pull_stats_ui.py

      - name: Apply persistent article bookmarks
        run: python scripts/patch_bookmarks.py

      - name: Add live NFL scoreboard presentation
        run: python scripts/patch_nfl_live.py

      - name: Expire NEW badges after one hour
        run: python scripts/patch_new_badges.py

      - name: Add Load More pagination
        run: python scripts/patch_load_more.py

      - name: Deduplicate generated UI styles
        run: python scripts/dedupe_generated_ui.py

      - name: Validate generated page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=['pull-stats-ui-v1','bookmarks-v1','auto-refresh-timer-v1']
          missing=[m for m in required if m not in s]
          if missing:
              raise SystemExit('Missing required UI markers: '+', '.join(missing))
          if s.count('id="auto-refresh-timer-v1"') != 1:
              raise SystemExit('Expected exactly one auto refresh timer marker')
          if '<html' not in s.lower() or '</html>' not in s.lower():
              raise SystemExit('Invalid generated page')
          print('Generated page validation passed.')
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add News index.html update-stats.json boxoffice.json scripts .github/workflows/update-news.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Automated news feed update'
          git push origin main
