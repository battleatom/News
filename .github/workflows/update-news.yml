name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - News
      - index.html
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Ensure rolling 48-hour feed window
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MAX_AGE_HOURS = 72', 'MAX_AGE_HOURS = 48')
          s = s.replace('f"{query} when:3d"', 'f"{query} when:2d"')
          p.write_text(s, encoding='utf-8')
          print('Enforced rolling 48-hour RSS window.')
          PY

      - name: Ensure NFL feed category
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    "technology": "technology AI cybersecurity science",', '    "nfl": ["NFL news", "NFL injuries trades free agency", "NFL scores results"],\n    "technology": "technology AI cybersecurity science",')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch news collector rules
        run: python scripts/patch_news_selector.py

      - name: Patch site cache metadata
        run: python scripts/patch_site_cache.py

      - name: Apply site theme
        run: python scripts/apply_clean_design.py

      - name: Apply live local date time weather
        run: python scripts/add_local_status.py

      - name: Apply page-level newspaper header
        run: python scripts/patch_header.py

      - name: Persist selected news tab
        run: python scripts/persist_active_tab.py

      - name: Apply article styling
        run: python scripts/patch_article_style.py

      - name: Patch location-aware Regional tab
        run: python scripts/patch_region_tab.py

      - name: Verify and enforce NFL and X tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"const sections=\[[^;]*\];"
          replacement = "const sections=[['top','🔴 Top Stories','#dc2626'],['nfl','🏈 NFL','#166534'],['x','𝕏 Top Issues','#111827'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a00'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['region','🌎 Region','#2563eb'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b']];"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate sections declaration in index.html')
          p.write_text(s2, encoding='utf-8')
          print('NFL and X tabs verified.')
          PY

      - name: Fix Regional tab click handling
        run: python scripts/fix_region_tab_click.py

      - name: Patch Underreported detail UI
        run: python scripts/patch_underreported_ui.py

      - name: Patch X Top Issues UI
        run: python scripts/patch_x_ui.py

      - name: Update RSS feed
        run: |
          set -o pipefail
          success=0
          for attempt in 1 2 3; do
            echo "RSS update attempt ${attempt}/3"
            if python scripts/update_news.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "RSS update failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "All RSS update attempts failed. Preserving the existing News feed and continuing the workflow."
          fi

      - name: Enrich World news content
        run: python scripts/enrich_world_content.py

      - name: Enrich Underreported context and long-term supporting coverage
        run: python scripts/enrich_underreported.py

      - name: Enrich X Top Issues
        run: python scripts/enrich_x_issues.py

      - name: Enrich Box Office and Farmington movie data
        run: python scripts/enrich_box_office.py

      - name: Add location-aware Box Office data
        run: python scripts/patch_boxoffice_location.py

      - name: Clean commerce and paywall-heavy links
        run: python scripts/clean_news.py

      - name: Record feed pull statistics
        run: python scripts/record_pull_stats.py

      - name: Remove exact and near-duplicate news stories
        run: python scripts/dedupe_news_stories.py

      - name: Finalize feed pull statistics
        run: python scripts/record_pull_stats.py --finalize

      - name: Canonicalize final page features
        run: python scripts/patch_site_features.py

      - name: Apply location-aware Box Office UI
        run: python scripts/patch_boxoffice_ui.py

      - name: Apply detailed pull statistics UI
        run: python scripts/patch_pull_stats_ui.py

      - name: Add live NFL scoreboard presentation
        run: python scripts/patch_nfl_live.py

      - name: Expire NEW badges after one hour
        run: python scripts/patch_new_badges.py

      - name: Add Load More pagination
        run: python scripts/patch_load_more.py

      - name: Deduplicate generated UI styles
        run: python scripts/dedupe_generated_ui.py

      - name: Validate generated page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          required = ['id="tabs"', 'id="refresh"', 'site-features-v2', 'pull-stats-ui-v1', 'nfl-live-v1', 'new-badge-expiry-v1', 'load-more-v1', 'styles/header.css', 'boxoffice-location-v1']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Generated page missing required features: ' + ', '.join(missing))
          if not re.search(r"\['boxoffice'", s):
              raise SystemExit('Generated page is missing the Box Office tab declaration')
          if len(re.findall(r'<nav[^>]+id=["\']tabs["\']', s, flags=re.I)) != 1:
              raise SystemExit('Generated page does not contain exactly one tabs container')
          if len(re.findall(r'const sections=', s)) != 1:
              raise SystemExit('Generated page does not contain exactly one sections declaration')
          if len(re.findall(r'<script\s+id=["\']load-more-v1["\']', s, flags=re.I)) != 1:
              raise SystemExit('Generated page does not contain exactly one Load More script')
          for style_id in ('site-features-style', 'nfl-live-style'):
              count = len(re.findall(rf'<style\s+id=["\']{re.escape(style_id)}["\']', s, flags=re.I))
              if count != 1:
                  raise SystemExit(f'Generated page contains {count} copies of {style_id}; expected exactly 1')
          print('Generated page validation passed with detailed pull statistics and existing features.')
          PY

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "News feed is already current."
            exit 0
          fi

          git fetch origin main
          git reset --soft origin/main
          git add -A

          if git diff --cached --quiet; then
            echo "No changes remain after syncing with latest main."
            exit 0
          fi

          git commit -m "Automated news feed update"
          git push origin HEAD:main
