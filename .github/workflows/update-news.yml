name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - News
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch news collector rules
        run: python scripts/patch_news_selector.py

      - name: Update RSS feed
        run: python scripts/update_news.py

      - name: Clean commerce and paywall-heavy links
        run: python scripts/clean_news.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add News
          if git diff --cached --quiet; then
            echo "News feed is already current."
          else
            git commit -m "Auto-update news feed"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push conflict; rebasing onto the latest main (attempt $attempt)."
              git fetch origin main
              git rebase origin/main
            done
            echo "Unable to push after 3 attempts."
            exit 1
          fi
