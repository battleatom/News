name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - 'News'
      - 'index.html'
      - 'update-stats.json'
      - 'boxoffice.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: update-news-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply collector preflight
        run: python scripts/preflight_feed.py

      - name: Patch news collector rules
        run: python scripts/patch_news_selector.py

      - name: Patch Top Stories topic and entity diversity
        run: python scripts/patch_top_diversity.py

      - name: Strengthen event-level duplicate detection
        run: python scripts/patch_event_dedupe.py

      - name: Keep exact-link dedupe category scoped
        run: python scripts/patch_dedupe_scope.py

      - name: Patch site cache metadata
        run: python scripts/patch_site_cache.py

      - name: Add public-interest Underreported and legislation collection
        run: python scripts/patch_public_interest_legislation.py

      - name: Apply public-interest quality gate
        run: python scripts/patch_public_interest_quality.py

      - name: Tighten category quality
        run: python scripts/patch_category_quality.py

      - name: Canonicalize collector patch artifacts
        run: python scripts/patch_collector_hygiene.py

      - name: Apply site theme
        run: python scripts/apply_clean_design.py

      - name: Apply live local date time and weather
        run: python scripts/add_local_status.py

      - name: Apply page-level newspaper header
        run: python scripts/patch_header.py

      - name: Persist selected news tab
        run: python scripts/persist_active_tab.py

      - name: Apply article styling
        run: python scripts/patch_article_style.py

      - name: Patch location-aware Regional tab
        run: python scripts/patch_region_tab.py

      - name: Fix Regional tab click handling
        run: python scripts/fix_region_tab_click.py

      - name: Patch Underreported detail UI
        run: python scripts/patch_underreported_ui.py

      - name: Patch X Top Issues UI
        run: python scripts/patch_x_ui.py

      - name: Update RSS feed
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "RSS update attempt ${attempt}/3"
            if python scripts/update_news.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "RSS update failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "All RSS update attempts failed. Preserving the existing News feed and continuing the workflow."
          fi

      - name: Refine Gaming and upcoming Technology
        run: python scripts/refine_tech_gaming.py

      - name: Collect official legislation records
        run: python scripts/collect_official_legislation_v2.py

      - name: Enrich World news content
        run: python scripts/enrich_world_content.py

      - name: Enrich Underreported context and long-term supporting coverage
        run: python scripts/enrich_underreported.py

      - name: Enrich Laws & Legislation
        run: python scripts/enrich_legislation.py

      - name: Enrich X Top Issues
        run: python scripts/enrich_x_issues.py

      - name: Enrich Box Office and movie data
        run: python scripts/enrich_box_office.py

      - name: Add location-aware Box Office data
        run: python scripts/patch_boxoffice_location.py

      - name: Clean commerce and paywall-heavy links
        run: python scripts/clean_news.py

      - name: Record feed pull statistics
        run: python scripts/record_pull_stats.py

      - name: Remove exact and near-duplicate news stories
        run: python scripts/dedupe_news_stories.py

      - name: Finalize feed pull statistics
        run: python scripts/record_pull_stats.py --finalize

      - name: Canonicalize final page features
        run: python scripts/patch_site_features.py

      - name: Bridge shared page state
        run: python scripts/patch_shared_page_state.py

      - name: Apply reliable automatic refresh timer
        run: python scripts/patch_auto_refresh_timer.py

      - name: Apply location-aware Box Office UI
        run: python scripts/patch_boxoffice_ui.py

      - name: Apply detailed pull statistics UI
        run: python scripts/patch_pull_stats_ui.py

      - name: Apply persistent article bookmarks
        run: python scripts/patch_bookmarks.py

      - name: Add live NFL scoreboard presentation
        run: python scripts/patch_nfl_live.py

      - name: Expire NEW badges and wire notification audio
        run: python scripts/patch_new_badges.py

      - name: Add Load More pagination
        run: python scripts/patch_load_more.py

      - name: Add Laws & Legislation card UI
        run: python scripts/patch_legislation_ui.py

      - name: Deduplicate generated UI blocks
        run: python scripts/dedupe_generated_ui.py

      - name: Normalize generated HTML structure
        run: python scripts/normalize_generated_html.py

      - name: Audit generated site integrity
        run: python scripts/site_audit.py

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py

      - name: Remove generated bytecode and dead collector
        run: |
          rm -f scripts/collect_official_legislation.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A News index.html update-stats.json boxoffice.json scripts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Automated news feed update'
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected; synchronizing with latest main before retry ${attempt}."
            git fetch origin main
            git merge --no-edit -X ours origin/main || {
              echo 'Unable to merge concurrent main changes safely.'
              git merge --abort || true
              exit 1
            }
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo 'Push failed after 3 attempts.'
          exit 1
