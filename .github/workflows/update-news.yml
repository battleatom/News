name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - News
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update RSS feed
        run: python scripts/update_news.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add News
          if git diff --cached --quiet; then
            echo "News feed is already current."
          else
            git commit -m "Auto-update news feed"
            git push
          fi
