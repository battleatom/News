name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - News
      - index.html
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Ensure rolling 48-hour feed window
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MAX_AGE_HOURS = 72', 'MAX_AGE_HOURS = 48')
          s = s.replace('f"{query} when:3d"', 'f"{query} when:2d"')
          p.write_text(s, encoding='utf-8')
          print('Enforced rolling 48-hour RSS window.')
          PY

      - name: Ensure NFL feed category
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('SECTIONS = ["top", "underreported", "world", "us", "presidential", "federal", "nm", "local", "region", "technology", "gaming", "military"]', 'SECTIONS = ["top", "nfl", "underreported", "world", "us", "presidential", "federal", "nm", "local", "region", "technology", "gaming", "military"]')
          s = s.replace('    "technology": "technology AI cybersecurity science",', '    "nfl": "NFL football news OR NFL scores OR NFL injuries OR NFL trades OR NFL teams",\n    "technology": "technology AI cybersecurity science",')
          s = s.replace('CATEGORY_WEIGHT = {"world": 18, "us": 22, "presidential": 24, "federal": 22, "military": 20, "technology": 12, "gaming": 16, "nm": 8, "local": 6}', 'CATEGORY_WEIGHT = {"world": 18, "us": 22, "presidential": 24, "federal": 22, "military": 20, "nfl": 18, "technology": 12, "gaming": 16, "nm": 8, "local": 6}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch news collector rules
        run: python scripts/patch_news_selector.py

      - name: Patch site cache metadata
        run: python scripts/patch_site_cache.py

      - name: Apply site theme
        run: python scripts/apply_clean_design.py

      - name: Persist selected news tab
        run: python scripts/persist_active_tab.py

      - name: Apply article styling
        run: python scripts/patch_article_style.py

      - name: Patch location-aware Regional tab
        run: python scripts/patch_region_tab.py

      - name: Verify and enforce NFL tab
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          nfl = "['nfl','🏈 NFL','#166534']"
          pattern = r"const sections=\[[^;]*\];"
          replacement = "const sections=[['top','🔴 Top Stories','#dc2626'],['nfl','🏈 NFL','#166534'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a04'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['region','🌎 Region','#2563eb'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b']];"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate sections declaration in index.html')
          if nfl not in s2:
              raise SystemExit('NFL tab verification failed')
          p.write_text(s2, encoding='utf-8')
          print('NFL tab verified and enforced.')
          PY

      - name: Add Load More pagination
        run: python scripts/patch_load_more.py

      - name: Update RSS feed
        run: python scripts/update_news.py

      - name: Clean commerce and paywall-heavy links
        run: python scripts/clean_news.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "News feed is already current."
            exit 0
          fi

          git fetch origin main
          git reset --soft origin/main
          git add -A

          if git diff --cached --quiet; then
            echo "No changes remain after syncing with latest main."
            exit 0
          fi

          git commit -m "Auto-update news feed"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push raced with another commit; refreshing main (attempt $attempt)."
            git fetch origin main
            git reset --soft origin/main
            git add -A
            git commit --amend --no-edit
            sleep 2
          done
          echo "Unable to push after 5 attempts."
          exit 1
