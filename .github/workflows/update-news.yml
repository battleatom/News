name: Update News Feed

on:
  push:
    branches: [main]
    paths-ignore:
      - 'News'
      - 'index.html'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: update-news-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Ensure rolling 48-hour feed window
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MAX_AGE_HOURS = 72', 'MAX_AGE_HOURS = 48')
          s = s.replace('f"{query} when:3d"', 'f"{query} when:2d"')
          p.write_text(s, encoding='utf-8')
          print('Enforced rolling 48-hour RSS window.')
          PY

      - name: Ensure NFL feed category
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          line = '    "nfl": ["NFL news", "NFL injuries trades free agency", "NFL scores results"],'
          s = re.sub(r'(?:\n?' + re.escape(line) + r'){1,}', '\n' + line, s)
          if '    "technology": "technology AI cybersecurity science",' in s and line not in s:
              s = s.replace('    "technology": "technology AI cybersecurity science",', line + '\n    "technology": "technology AI cybersecurity science",', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch news collector rules
        run: python scripts/patch_news_selector.py

      - name: Patch Top Stories topic and entity diversity
        run: python scripts/patch_top_diversity.py

      - name: Strengthen event-level duplicate detection
        run: python scripts/patch_event_dedupe.py

      - name: Patch site cache metadata
        run: python scripts/patch_site_cache.py

      - name: Apply site theme
        run: python scripts/apply_clean_design.py

      - name: Apply live local date time and weather
        run: python scripts/add_local_status.py

      - name: Apply page-level newspaper header
        run: python scripts/patch_header.py

      - name: Persist selected news tab
        run: python scripts/persist_active_tab.py

      - name: Apply article styling
        run: python scripts/patch_article_style.py

      - name: Patch location-aware Regional tab
        run: python scripts/patch_region_tab.py

      - name: Verify and enforce NFL and X tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"const sections=\[[^;]*\];"
          replacement = "const sections=[['top','🔴 Top Stories','#dc2626'],['nfl','🏈 NFL','#166534'],['x','𝕏 Top Issues','#111827'],['underreported','🟣 Underreported','#7c3aed'],['world','🌎 World','#2563eb'],['us','🇺🇸 United States','#1e3a8a'],['presidential','🏛️ Presidential','#b45309'],['federal','🏛️ Federal Government','#ca8a00'],['nm','🏜️ New Mexico','#0f766e'],['local','📍 Local / Four Corners','#15803d'],['region','🌎 Region','#2563eb'],['technology','💻 Technology','#0891b2'],['gaming','🎮 Gaming & Computing','#7c3aed'],['military','⚔️ Military & War','#991b1b']];"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate sections declaration in index.html')
          p.write_text(s2, encoding='utf-8')
          print('NFL and X tabs verified.')
          PY

      - name: Fix Regional tab click handling
        run: python scripts/fix_region_tab_click.py

      - name: Patch Underreported detail UI
        run: python scripts/patch_underreported_ui.py

      - name: Patch X Top Issues UI
        run: python scripts/patch_x_ui.py

      - name: Update RSS feed
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "RSS update attempt ${attempt}/3"
            if python scripts/update_news.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "RSS update failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "All RSS update attempts failed. Preserving the existing News feed and continuing the workflow."
          fi

      - name: Enrich World news content
        run: python scripts/enrich_world_content.py

      - name: Enrich Underreported context and long-term supporting coverage
        run: python scripts/enrich_underreported.py

      - name: Enrich X Top Issues
        run: python scripts/enrich_x_issues.py

      - name: Enrich Box Office and Farmington movie data
        run: python scripts/enrich_box_office.py

      - name: Add location-aware Box Office data
        run: python scripts/patch_boxoffice_location.py

      - name: Clean commerce and paywall-heavy links
        run: python scripts/clean_news.py

      - name: Record feed pull statistics
        run: python scripts/record_pull_stats.py

      - name: Remove exact and near-duplicate news stories
        run: python scripts/dedupe_news_stories.py

      - name: Finalize feed pull statistics
        run: python scripts/record_pull_stats.py --finalize

      - name: Canonicalize final page features
        run: python scripts/patch_site_features.py

      - name: Bridge shared page state
        run: python scripts/patch_shared_page_state.py

      - name: Apply reliable automatic refresh timer
        run: python scripts/patch_auto_refresh_timer.py

      - name: Apply location-aware Box Office UI
        run: python scripts/patch_boxoffice_ui.py

      - name: Apply detailed pull statistics UI
        run: python scripts/patch_pull_stats_ui.py

      - name: Apply persistent article bookmarks
        run: python scripts/patch_bookmarks.py

      - name: Add live NFL scoreboard presentation
        run: python scripts/patch_nfl_live.py

      - name: Expire NEW badges after one hour
        run: python scripts/patch_new_badges.py

      - name: Add Load More pagination
        run: python scripts/patch_load_more.py

      - name: Deduplicate generated UI styles
        run: python scripts/dedupe_generated_ui.py

      - name: Normalize generated HTML structure
        run: python scripts/normalize_generated_html.py

      - name: Validate generated page and scripts
        run: |
          python -m py_compile scripts/*.py
          python - <<'PY'
          from pathlib import Path
          import re
          workflow=Path('.github/workflows/update-news.yml').read_text(encoding='utf-8')
          script_refs=re.findall(r'(?:run:\s*python\s+|python\s+)(scripts/[A-Za-z0-9_./-]+\.py)', workflow)
          missing=[p for p in sorted(set(script_refs)) if not Path(p).exists()]
          if missing:
              raise SystemExit('Workflow references missing scripts: '+', '.join(missing))
          s=Path('index.html').read_text(encoding='utf-8')
          required=['pull-stats-ui-v1','bookmarks-v1','auto-refresh-timer-v1','boxoffice-location-v1','shared-page-state-bridge-v1']
          missing_ui=[m for m in required if m not in s]
          if missing_ui:
              raise SystemExit('Missing required UI markers: '+', '.join(missing_ui))
          if s.count('id="auto-refresh-timer-v1"') != 1:
              raise SystemExit('Expected exactly one auto refresh timer marker')
          if s.count('id="shared-page-state-bridge-v1"') != 1:
              raise SystemExit('Expected exactly one shared state bridge marker')
          if re.search(r'</html>\s*<(?:script|style)\b', s, flags=re.I):
              raise SystemExit('Generated page contains script/style tags after </html>')
          if '<html' not in s.lower() or '</html>' not in s.lower():
              raise SystemExit('Invalid generated page')
          if len(re.findall(r'const sections=', s)) != 1:
              raise SystemExit('Generated page does not contain exactly one sections declaration')
          print('Generated page, workflow references, HTML structure, and Python syntax validation passed.')
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add News index.html update-stats.json boxoffice.json scripts .github/workflows/update-news.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Automated news feed update'
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected; synchronizing with latest main before retry ${attempt}."
            git fetch origin main
            git merge --no-edit -X ours origin/main || {
              echo 'Unable to merge concurrent main changes safely.'
              git merge --abort || true
              exit 1
            }
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo 'Push failed after 3 attempts.'
          exit 1
