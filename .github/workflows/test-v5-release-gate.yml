name: Test V5 Release Gate

on:
  push:
    branches:
      - fix/v5-release-gate-thresholds-2026-09-13

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python -m py_compile scripts/v4_release_gate.py
      - name: Verify V5 production counts satisfy updated floors
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('gate','scripts/v4_release_gate.py')
          gate=importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          production_counts={
            'top':52,'nfl':16,'underreported':30,'world':40,'us':9,
            'presidential':23,'federal':11,'legislation':22,'nm':35,
            'local':4,'region':12,'technology':7,'gaming':10,'military':23,
          }
          failures={k:(production_counts.get(k,0),v) for k,v in gate.MIN_COUNTS.items() if production_counts.get(k,0)<v}
          assert not failures, failures
          assert gate.MIN_COUNTS['local'] >= 1
          assert gate.MIN_COUNTS['us'] >= 5
          assert gate.MIN_COUNTS['technology'] >= 5
          print('V5 RELEASE THRESHOLD TEST PASS')
          PY
